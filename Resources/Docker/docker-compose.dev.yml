# Development Environment - Complete Configuration
# Usage: docker-compose -f docker-compose.dev.yml --profile http up
# Purpose: Development-friendly configuration with simplified setup

services:
  keycloak-local:
    image: quay.io/keycloak/keycloak:25.0.6
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      - KEYCLOAK_ADMIN=${LOCAL_KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${LOCAL_KEYCLOAK_ADMIN_PASSWORD}
      - KC_HTTP_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_PROXY=edge
    volumes:
      - ../../Resources/Keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - xy-dev-network
    profiles: ["identity", "all"]

  api-dev-http:
    image: xydatalabs-orderprocessingsystem-api-http:dev
    build:
      context: ../..
      dockerfile: XYDataLabs.OrderProcessingSystem.API/Dockerfile
      target: final
    ports:
      - "5020:5020"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5020
      - ASPNETCORE_HTTP_PORTS=5020
      - ConnectionStrings__OrderProcessingSystemDbConnection=Server=sql-server,1433;Database=OrderProcessingSystem_Dev;User Id=sa;Password=${LOCAL_SQL_PASSWORD};TrustServerCertificate=True;
      - DedicatedTenantConnectionStrings__TenantC=Server=sql-server,1433;Database=OrderProcessingSystem_TenantC_Dev;User Id=sa;Password=${LOCAL_SQL_PASSWORD};TrustServerCertificate=True;
      - OpenPay__MerchantId=${LOCAL_OPENPAY_MERCHANT_ID}
      - OpenPay__PublicKey=${LOCAL_OPENPAY_PUBLIC_KEY}
      - OpenPay__PrivateKey=${LOCAL_OPENPAY_PRIVATE_KEY}
      - OpenPay__DeviceSessionId=${LOCAL_OPENPAY_DEVICE_SESSION_ID}
      - Razorpay__MerchantId=${LOCAL_RAZORPAY_MERCHANT_ID}
      - Razorpay__PrivateKey=${LOCAL_RAZORPAY_PRIVATE_KEY}
      - Webhooks__Razorpay__Secret=${LOCAL_RAZORPAY_WEBHOOK_SECRET}
      - Webhooks__OpenPay__Secret=${LOCAL_OPENPAY_WEBHOOK_SECRET}
      - IdentityProvider__Enabled=true
      - IdentityProvider__Mode=KeycloakLocal
      - IdentityProvider__Authority=http://localhost:8081/realms/xy-phase9
      - IdentityProvider__Audience=xy-order-processing
      - IdentityProvider__Scheme=Bearer
      - IdentityProvider__ClientId=${LOCAL_KEYCLOAK_BACKEND_CLIENT_ID}
      - IdentityProvider__ClientSecret=${LOCAL_KEYCLOAK_BACKEND_CLIENT_SECRET}
      - PaymentProviders__TenantA__OpenPay__PrivateKey=${LOCAL_OPENPAY_PRIVATE_KEY}
      - PaymentProviders__TenantB__OpenPay__PrivateKey=${LOCAL_OPENPAY_PRIVATE_KEY}
      - PaymentProviders__TenantC__OpenPay__PrivateKey=${LOCAL_OPENPAY_PRIVATE_KEY}
      - PaymentProviders__TenantA__Razorpay__PrivateKey=${LOCAL_RAZORPAY_PRIVATE_KEY}
      - PaymentProviders__TenantB__Razorpay__PrivateKey=${LOCAL_RAZORPAY_PRIVATE_KEY}
      - PaymentProviders__TenantC__Razorpay__PrivateKey=${LOCAL_RAZORPAY_PRIVATE_KEY}
      - USE_HTTPS=false
    volumes:
      - ../../logs:/logs
      - ../../Resources/Certificates/aspnetapp.pfx:/https/aspnetapp.pfx:ro
      - ../../Resources/Configuration/sharedsettings.dev.json:/app/Resources/Configuration/sharedsettings.dev.json:ro
    networks:
      - xy-dev-network
      - xy-database-network
    profiles: ["http", "all", "api"]
    depends_on:
      sql-server:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:5020/swagger --insecure || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  api-dev-https:
    image: xydatalabs-orderprocessingsystem-api-https:dev
    build:
      context: ../..
      dockerfile: XYDataLabs.OrderProcessingSystem.API/Dockerfile
      target: final
    ports:
      - "5021:5021"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:5021
      - ASPNETCORE_HTTPS_PORTS=5021
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${LOCAL_CERT_PASSWORD}
      - ApiSettings__API__https__CertPassword=${LOCAL_CERT_PASSWORD}
      - ConnectionStrings__OrderProcessingSystemDbConnection=Server=sql-server,1433;Database=OrderProcessingSystem_Dev;User Id=sa;Password=${LOCAL_SQL_PASSWORD};TrustServerCertificate=True;
      - DedicatedTenantConnectionStrings__TenantC=Server=sql-server,1433;Database=OrderProcessingSystem_TenantC_Dev;User Id=sa;Password=${LOCAL_SQL_PASSWORD};TrustServerCertificate=True;
      - OpenPay__MerchantId=${LOCAL_OPENPAY_MERCHANT_ID}
      - OpenPay__PublicKey=${LOCAL_OPENPAY_PUBLIC_KEY}
      - OpenPay__PrivateKey=${LOCAL_OPENPAY_PRIVATE_KEY}
      - OpenPay__DeviceSessionId=${LOCAL_OPENPAY_DEVICE_SESSION_ID}
      - Razorpay__MerchantId=${LOCAL_RAZORPAY_MERCHANT_ID}
      - Razorpay__PrivateKey=${LOCAL_RAZORPAY_PRIVATE_KEY}
      - Webhooks__Razorpay__Secret=${LOCAL_RAZORPAY_WEBHOOK_SECRET}
      - Webhooks__OpenPay__Secret=${LOCAL_OPENPAY_WEBHOOK_SECRET}
      - IdentityProvider__Enabled=true
      - IdentityProvider__Mode=KeycloakLocal
      - IdentityProvider__Authority=http://localhost:8081/realms/xy-phase9
      - IdentityProvider__Audience=xy-order-processing
      - IdentityProvider__Scheme=Bearer
      - IdentityProvider__ClientId=${LOCAL_KEYCLOAK_BACKEND_CLIENT_ID}
      - IdentityProvider__ClientSecret=${LOCAL_KEYCLOAK_BACKEND_CLIENT_SECRET}
      - PaymentProviders__TenantA__OpenPay__PrivateKey=${LOCAL_OPENPAY_PRIVATE_KEY}
      - PaymentProviders__TenantB__OpenPay__PrivateKey=${LOCAL_OPENPAY_PRIVATE_KEY}
      - PaymentProviders__TenantC__OpenPay__PrivateKey=${LOCAL_OPENPAY_PRIVATE_KEY}
      - PaymentProviders__TenantA__Razorpay__PrivateKey=${LOCAL_RAZORPAY_PRIVATE_KEY}
      - PaymentProviders__TenantB__Razorpay__PrivateKey=${LOCAL_RAZORPAY_PRIVATE_KEY}
      - PaymentProviders__TenantC__Razorpay__PrivateKey=${LOCAL_RAZORPAY_PRIVATE_KEY}
      - USE_HTTPS=true
    volumes:
      - ../../logs:/logs
      - ../../Resources/Certificates/aspnetapp.pfx:/https/aspnetapp.pfx:ro
      - ../../Resources/Configuration/sharedsettings.dev.json:/app/Resources/Configuration/sharedsettings.dev.json:ro
    networks:
      - xy-dev-network
      - xy-database-network
    profiles: ["https", "all", "api-https"]
    depends_on:
      sql-server:
        condition: service_healthy
    healthcheck:
      test: curl --fail https://localhost:5021/swagger --insecure || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  ui-dev-http:
    image: xydatalabs-orderprocessingsystem-ui-http:dev
    build:
      context: ../..
      dockerfile: frontend/apps/web/Dockerfile
      target: final
      args:
        VITE_ORDERPROCESSING_API_BASE_URL: http://localhost:5020
        VITE_KEYCLOAK_AUTHORITY: http://localhost:8081
        VITE_KEYCLOAK_REALM: xy-phase9
        VITE_KEYCLOAK_CLIENT_ID: ${LOCAL_KEYCLOAK_WEB_CLIENT_ID}
        VITE_KEYCLOAK_USERNAME: tenant-admin
        VITE_KEYCLOAK_PASSWORD: LocalP@ssw0rd!
    ports:
      - "5022:5022"
    environment:
      - HOST=0.0.0.0
      - PORT=5022
      - USE_HTTPS=false
    networks:
      - xy-dev-network
      - xy-database-network
    profiles: ["http", "all", "ui"]
    depends_on:
      api-dev-http:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5022/customers').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  ui-dev-https:
    image: xydatalabs-orderprocessingsystem-ui-https:dev
    build:
      context: ../..
      dockerfile: frontend/apps/web/Dockerfile
      target: final
      args:
        VITE_ORDERPROCESSING_API_BASE_URL: https://localhost:5021
        VITE_KEYCLOAK_AUTHORITY: http://localhost:8081
        VITE_KEYCLOAK_REALM: xy-phase9
        VITE_KEYCLOAK_CLIENT_ID: ${LOCAL_KEYCLOAK_WEB_CLIENT_ID}
        VITE_KEYCLOAK_USERNAME: tenant-admin
        VITE_KEYCLOAK_PASSWORD: LocalP@ssw0rd!
    ports:
      - "5023:5023"
    environment:
      - HOST=0.0.0.0
      - PORT=5023
      - USE_HTTPS=true
      - PFX_PATH=/https/aspnetapp.pfx
      - PFX_PASSWORD=${LOCAL_CERT_PASSWORD}
    volumes:
      - ../../Resources/Certificates/aspnetapp.pfx:/https/aspnetapp.pfx:ro
    networks:
      - xy-dev-network
      - xy-database-network
    profiles: ["https", "all", "ui-https"]
    depends_on:
      api-dev-https:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.env.NODE_TLS_REJECT_UNAUTHORIZED='0'; fetch('https://localhost:5023/customers').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

# Development networking
networks:
  xy-dev-network:
    external: true
  xy-database-network:
    external: true
