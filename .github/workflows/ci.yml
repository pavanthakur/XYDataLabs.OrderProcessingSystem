name: CI — PR Validation Only (No Deployment)

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'XYDataLabs.OrderProcessingSystem.API/**'
      - 'XYDataLabs.OrderProcessingSystem.Application/**'
      - 'XYDataLabs.OrderProcessingSystem.Domain/**'
      - 'XYDataLabs.OrderProcessingSystem.Gateway/**'
      - 'XYDataLabs.OrderProcessingSystem.Infrastructure/**'
      - 'XYDataLabs.OrderProcessingSystem.SharedKernel/**'
      - 'XYDataLabs.OpenPayAdapter/**'
      - 'frontend/**'
      - 'frontend/.gitignore'
      - 'scripts/validate-tracked-generated-artifacts.ps1'
      - 'tests/**'
      - 'Resources/Configuration/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '*.sln'

permissions:
  contents: read
  pull-requests: write

env:
  DOTNET_VERSION: '8.x'
  NODE_VERSION: '20.x'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate tracked generated artifacts
        shell: pwsh
        run: scripts/validate-tracked-generated-artifacts.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate frontend type safety
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend workspace
        working-directory: frontend
        run: npm run test:web

      - name: Build frontend workspace
        working-directory: frontend
        run: npm run build

      - name: Restore dependencies
        run: dotnet restore XYDataLabs.OrderProcessingSystem.sln

      - name: Build solution
        run: dotnet build XYDataLabs.OrderProcessingSystem.sln --configuration Release --no-restore

      - name: Test — Domain
        run: dotnet test tests/XYDataLabs.OrderProcessingSystem.Domain.Tests/XYDataLabs.OrderProcessingSystem.Domain.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Test — Application
        run: dotnet test tests/XYDataLabs.OrderProcessingSystem.Application.Tests/XYDataLabs.OrderProcessingSystem.Application.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Test — API
        run: dotnet test tests/XYDataLabs.OrderProcessingSystem.API.Tests/XYDataLabs.OrderProcessingSystem.API.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Test — Gateway
        run: dotnet test tests/XYDataLabs.OrderProcessingSystem.Gateway.Tests/XYDataLabs.OrderProcessingSystem.Gateway.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Test — Architecture
        run: dotnet test tests/XYDataLabs.OrderProcessingSystem.Architecture.Tests/XYDataLabs.OrderProcessingSystem.Architecture.Tests.csproj --configuration Release --no-build --verbosity normal

        # Integration tests require Testcontainers + Docker daemon (Linux containers).
        # windows-latest runner does not support Linux containers.
        # Run locally or promote to a dedicated linux runner when Testcontainers CI is needed.

      - name: PR Validation Summary
        if: always()
        shell: pwsh
        run: |
          "## ✅ PR Validation Complete" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "> **This workflow validates pull requests only. It does not deploy to Azure.**" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "### Phase 10 Deployment Information" >> $env:GITHUB_STEP_SUMMARY
          "- This CI workflow runs on pull requests to ``dev``, ``staging``, or ``main`` when relevant validation paths change." >> $env:GITHUB_STEP_SUMMARY
          "- It does **not** run on direct pushes or merges." >> $env:GITHUB_STEP_SUMMARY
          "- Azure deployment is handled manually through [01 Phase 10 Azure Deploy Orchestrator](https://github.com/${{ github.repository }}/actions/workflows/phase10-deploy-orchestrator.yml)." >> $env:GITHUB_STEP_SUMMARY
          "- After deployment, run [02 Phase 10 Azure Runtime Smoke](https://github.com/${{ github.repository }}/actions/workflows/phase10-azure-runtime-smoke.yml), then [03 Phase 10 Azure Transport Smoke](https://github.com/${{ github.repository }}/actions/workflows/phase10-azure-transport-smoke.yml)." >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "### Branch → Environment Mapping" >> $env:GITHUB_STEP_SUMMARY
          "| Branch | Environment |" >> $env:GITHUB_STEP_SUMMARY
          "|--------|-------------|" >> $env:GITHUB_STEP_SUMMARY
          "| ``dev`` | dev |" >> $env:GITHUB_STEP_SUMMARY
          "| ``staging`` | staging |" >> $env:GITHUB_STEP_SUMMARY
          "| ``main`` | prod |" >> $env:GITHUB_STEP_SUMMARY
