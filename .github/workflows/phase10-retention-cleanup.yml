name: Phase 10 Retention Cleanup (Internal)

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Preview only; do not delete anything'
        required: true
        default: true
        type: boolean
      keepLastPackages:
        description: 'Keep the most recent package versions per GHCR image'
        required: true
        default: 10
        type: number
      olderThanDays:
        description: 'Only delete package versions older than this many days'
        required: true
        default: 30
        type: number
      cleanupArtifacts:
        description: 'Also delete old GitHub Actions artifacts'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  cleanup:
    name: Cleanup GHCR Images and Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Capture retention inputs
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dryRun=${{ inputs.dryRun }}" >> "$GITHUB_OUTPUT"
            echo "keepLastPackages=${{ inputs.keepLastPackages }}" >> "$GITHUB_OUTPUT"
            echo "olderThanDays=${{ inputs.olderThanDays }}" >> "$GITHUB_OUTPUT"
            echo "cleanupArtifacts=${{ inputs.cleanupArtifacts }}" >> "$GITHUB_OUTPUT"
          else
            echo "dryRun=false" >> "$GITHUB_OUTPUT"
            echo "keepLastPackages=10" >> "$GITHUB_OUTPUT"
            echo "olderThanDays=30" >> "$GITHUB_OUTPUT"
            echo "cleanupArtifacts=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview cleanup scope
        shell: bash
        run: |
          echo "## 🧹 Phase 10 Retention Cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry Run | ${{ steps.params.outputs.dryRun }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Keep Last Packages | ${{ steps.params.outputs.keepLastPackages }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Older Than Days | ${{ steps.params.outputs.olderThanDays }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cleanup Artifacts | ${{ steps.params.outputs.cleanupArtifacts }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | ${{ github.repository }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow targets GHCR package versions and GitHub Actions artifacts. It does not touch Azure resource groups, Container Apps, Key Vault, or Log Analytics." >> "$GITHUB_STEP_SUMMARY"

      - name: Delete old GHCR versions
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ownerType = context.payload.repository?.owner?.type || 'User';
            const dryRun = String('${{ steps.params.outputs.dryRun }}') === 'true';
            const keepLastPackages = Number('${{ steps.params.outputs.keepLastPackages }}');
            const olderThanDays = Number('${{ steps.params.outputs.olderThanDays }}');
            const cutoff = new Date(Date.now() - olderThanDays * 24 * 60 * 60 * 1000);
            const packageNames = [
              'orderprocessing-gateway',
              'orderprocessing-orders',
              'orderprocessing-inventory',
              'orderprocessing-notifications',
              'orderprocessing-ui'
            ];

            const summary = [];

            for (const package_name of packageNames) {
              const versions = await github.paginate(
                ownerType === 'Organization'
                  ? 'GET /orgs/{org}/packages/{package_type}/{package_name}/versions'
                  : 'GET /users/{username}/packages/{package_type}/{package_name}/versions',
                ownerType === 'Organization'
                  ? {
                      org: owner,
                      package_type: 'container',
                      package_name,
                      per_page: 100
                    }
                  : {
                      username: owner,
                      package_type: 'container',
                      package_name,
                      per_page: 100
                    }
              );

              const sorted = versions
                .slice()
                .sort((a, b) => new Date(b.updated_at || b.created_at || 0) - new Date(a.updated_at || a.created_at || 0));

              let retained = 0;

              for (const version of sorted) {
                const versionDate = new Date(version.updated_at || version.created_at || 0);
                const shouldKeep = retained < keepLastPackages || versionDate >= cutoff;

                if (shouldKeep) {
                  retained += 1;
                  summary.push(`KEEP ${package_name} ${version.name || version.id}`);
                  continue;
                }

                summary.push(`${dryRun ? 'DRY RUN DELETE' : 'DELETE'} ${package_name} ${version.name || version.id}`);
                if (!dryRun) {
                  await github.request(
                    ownerType === 'Organization'
                      ? 'DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}'
                      : 'DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                    ownerType === 'Organization'
                      ? {
                          org: owner,
                          package_type: 'container',
                          package_name,
                          package_version_id: version.id
                        }
                      : {
                          username: owner,
                          package_type: 'container',
                          package_name,
                          package_version_id: version.id
                        }
                  );
                }
              }
            }

            core.summary.addHeading('GHCR package retention');
            core.summary.addRaw(summary.join('\n')).addEOL();
            await core.summary.write();

      - name: Delete old GitHub Actions artifacts
        if: ${{ steps.params.outputs.cleanupArtifacts == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const dryRun = String('${{ steps.params.outputs.dryRun }}') === 'true';
            const olderThanDays = Number('${{ steps.params.outputs.olderThanDays }}');
            const cutoff = new Date(Date.now() - olderThanDays * 24 * 60 * 60 * 1000);
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner,
              repo,
              per_page: 100
            });

            const deletions = [];
            for (const artifact of artifacts) {
              const createdAt = new Date(artifact.created_at);
              if (createdAt < cutoff) {
                deletions.push(`${artifact.name} (${artifact.id})`);
                if (!dryRun) {
                  await github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: artifact.id
                  });
                }
              }
            }

            core.summary.addHeading('Artifact retention');
            if (deletions.length === 0) {
              core.summary.addRaw('No artifacts matched the retention rule.').addEOL();
            } else {
              core.summary.addRaw(deletions.join('\n')).addEOL();
            }
            await core.summary.write();

      - name: Write cleanup result
        shell: bash
        run: |
          if [ "${{ steps.params.outputs.dryRun }}" = "true" ]; then
            echo "Dry run completed. No GHCR packages or artifacts were deleted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Retention cleanup completed." >> "$GITHUB_STEP_SUMMARY"
          fi
