name: Phase 10 Retention Cleanup (Internal)

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Preview only; do not delete anything'
        required: true
        default: true
        type: boolean
      keepLastPackages:
        description: 'Keep the most recent package versions per GHCR image'
        required: true
        default: 10
        type: number
      olderThanDays:
        description: 'Only delete package versions older than this many days'
        required: true
        default: 30
        type: number
      cleanupArtifacts:
        description: 'Also delete old GitHub Actions artifacts'
        required: true
        default: true
        type: boolean
      cleanupAcr:
        description: 'Preview ACR manifests only (deletion is disabled)'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  cleanup:
    name: Cleanup GHCR Images and Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Capture retention inputs
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dryRun=${{ inputs.dryRun }}" >> "$GITHUB_OUTPUT"
            echo "keepLastPackages=${{ inputs.keepLastPackages }}" >> "$GITHUB_OUTPUT"
            echo "olderThanDays=${{ inputs.olderThanDays }}" >> "$GITHUB_OUTPUT"
            echo "cleanupArtifacts=${{ inputs.cleanupArtifacts }}" >> "$GITHUB_OUTPUT"
            echo "cleanupAcr=${{ inputs.cleanupAcr }}" >> "$GITHUB_OUTPUT"
          else
            echo "dryRun=false" >> "$GITHUB_OUTPUT"
            echo "keepLastPackages=10" >> "$GITHUB_OUTPUT"
            echo "olderThanDays=30" >> "$GITHUB_OUTPUT"
            echo "cleanupArtifacts=true" >> "$GITHUB_OUTPUT"
            echo "cleanupAcr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview cleanup scope
        shell: bash
        run: |
          echo "## 🧹 Phase 10 Retention Cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry Run | ${{ steps.params.outputs.dryRun }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Keep Last Packages | ${{ steps.params.outputs.keepLastPackages }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Older Than Days | ${{ steps.params.outputs.olderThanDays }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cleanup Artifacts | ${{ steps.params.outputs.cleanupArtifacts }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cleanup ACR | ${{ steps.params.outputs.cleanupAcr }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | ${{ github.repository }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scheduled Run | Sundays at 03:00 UTC |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This scheduled workflow cleans historical GHCR package versions and GitHub Actions artifacts. ACR is inventoried only on a manually requested preview; ACR deletion is disabled. It does not touch app environment resource groups, Container Apps, Key Vault, or Log Analytics." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Azure resource cleanup remains manual through the Phase 10 deploy orchestrator with cleanupInfra=true." >> "$GITHUB_STEP_SUMMARY"

      - name: Delete old GHCR versions
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ownerType = context.payload.repository?.owner?.type || 'User';
            const dryRun = String('${{ steps.params.outputs.dryRun }}') === 'true';
            const keepLastPackages = Number('${{ steps.params.outputs.keepLastPackages }}');
            const olderThanDays = Number('${{ steps.params.outputs.olderThanDays }}');
            const cutoff = new Date(Date.now() - olderThanDays * 24 * 60 * 60 * 1000);
            const packageNames = [
              'orderprocessing-gateway',
              'orderprocessing-orders',
              'orderprocessing-payments',
              'orderprocessing-inventory',
              'orderprocessing-notifications',
              'orderprocessing-ui'
            ];

            const summary = [];

            for (const package_name of packageNames) {
              let versions = [];
              try {
                versions = await github.paginate(
                  ownerType === 'Organization'
                    ? 'GET /orgs/{org}/packages/{package_type}/{package_name}/versions'
                    : 'GET /users/{username}/packages/{package_type}/{package_name}/versions',
                  ownerType === 'Organization'
                    ? {
                        org: owner,
                        package_type: 'container',
                        package_name,
                        per_page: 100
                      }
                    : {
                        username: owner,
                        package_type: 'container',
                        package_name,
                        per_page: 100
                      }
                );
              } catch (error) {
                if (error.status === 404) {
                  summary.push(`SKIP ${package_name} package not found`);
                  continue;
                }

                throw error;
              }

              const sorted = versions
                .slice()
                .sort((a, b) => new Date(b.updated_at || b.created_at || 0) - new Date(a.updated_at || a.created_at || 0));

              let retained = 0;

              for (const version of sorted) {
                const versionDate = new Date(version.updated_at || version.created_at || 0);
                const shouldKeep = retained < keepLastPackages || versionDate >= cutoff;

                if (shouldKeep) {
                  retained += 1;
                  summary.push(`KEEP ${package_name} ${version.name || version.id}`);
                  continue;
                }

                summary.push(`${dryRun ? 'DRY RUN DELETE' : 'DELETE'} ${package_name} ${version.name || version.id}`);
                if (!dryRun) {
                  await github.request(
                    ownerType === 'Organization'
                      ? 'DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}'
                      : 'DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                    ownerType === 'Organization'
                      ? {
                          org: owner,
                          package_type: 'container',
                          package_name,
                          package_version_id: version.id
                        }
                      : {
                          username: owner,
                          package_type: 'container',
                          package_name,
                          package_version_id: version.id
                        }
                  );
                }
              }
            }

            core.summary.addHeading('GHCR package retention');
            core.summary.addRaw(summary.join('\n')).addEOL();
            await core.summary.write();

      - name: Delete old GitHub Actions artifacts
        if: ${{ steps.params.outputs.cleanupArtifacts == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const dryRun = String('${{ steps.params.outputs.dryRun }}') === 'true';
            const olderThanDays = Number('${{ steps.params.outputs.olderThanDays }}');
            const cutoff = new Date(Date.now() - olderThanDays * 24 * 60 * 60 * 1000);
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner,
              repo,
              per_page: 100
            });

            const deletions = [];
            for (const artifact of artifacts) {
              const createdAt = new Date(artifact.created_at);
              if (createdAt < cutoff) {
                deletions.push(`${artifact.name} (${artifact.id})`);
                if (!dryRun) {
                  await github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: artifact.id
                  });
                }
              }
            }

            core.summary.addHeading('Artifact retention');
            if (deletions.length === 0) {
              core.summary.addRaw('No artifacts matched the retention rule.').addEOL();
            } else {
              core.summary.addRaw(deletions.join('\n')).addEOL();
            }
            await core.summary.write();

      - name: Write cleanup result
        shell: bash
        run: |
          if [ "${{ steps.params.outputs.dryRun }}" = "true" ]; then
            echo "Dry run completed. No GHCR packages or artifacts were deleted. ACR deletion is disabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GHCR/artifact retention cleanup completed. ACR deletion remains disabled." >> "$GITHUB_STEP_SUMMARY"
          fi

  cleanup_acr:
    name: Preview ACR Image Inventory (Platform, Read Only)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanupAcr == true }}
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Capture retention inputs
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dryRun=${{ inputs.dryRun }}" >> "$GITHUB_OUTPUT"
            echo "keepLastPackages=${{ inputs.keepLastPackages }}" >> "$GITHUB_OUTPUT"
            echo "olderThanDays=${{ inputs.olderThanDays }}" >> "$GITHUB_OUTPUT"
          else
            echo "dryRun=false" >> "$GITHUB_OUTPUT"
            echo "keepLastPackages=10" >> "$GITHUB_OUTPUT"
            echo "olderThanDays=30" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure CLI Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Inventory ACR manifests without deletion
        shell: bash
        run: |
          set -euo pipefail

          PLATFORM_SUFFIX="platform"
          ACR_NAME="$(printf 'xyops%s' "${{ github.repository_owner }}orderprocessing${PLATFORM_SUFFIX}" | tr '[:upper:]' '[:lower:]' | tr -d '-')"
          RG_NAME="rg-orderprocessing-${PLATFORM_SUFFIX}"
          KEEP_LAST="${{ steps.params.outputs.keepLastPackages }}"
          OLDER_THAN_DAYS="${{ steps.params.outputs.olderThanDays }}"
          REPOSITORIES=(
            orderprocessing-gateway
            orderprocessing-orders
            orderprocessing-payments
            orderprocessing-inventory
            orderprocessing-notifications
            orderprocessing-ui
          )

          {
            echo "## ACR retention: platform"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| ACR | ${ACR_NAME} |"
            echo "| Resource Group | ${RG_NAME} |"
            echo "| ACR deletion | Disabled in this workflow |"
            echo "| Keep Last | ${KEEP_LAST} |"
            echo "| Older Than Days | ${OLDER_THAN_DAYS} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          ACR_ID="$(az acr show --name "$ACR_NAME" --query id --output tsv)"
          [[ -n "$ACR_ID" ]] || { echo "ACR identity query returned no resource ID; inventory is incomplete." >&2; exit 1; }
          ACR_RG="$(az acr show --name "$ACR_NAME" --query resourceGroup --output tsv)"
          [[ "$ACR_RG" == "$RG_NAME" ]] || { echo "ACR resolved to an unexpected resource group; expected ${RG_NAME}, got ${ACR_RG:-<empty>}." >&2; exit 1; }

          az containerapp list --query "[].{name:name,resourceGroup:resourceGroup}" -o json > container-apps.json
          jq -e 'type == "array" and all(.[]; (.name | type == "string" and length > 0) and (.resourceGroup | type == "string" and length > 0))' container-apps.json >/dev/null
          echo "ACR deletion is disabled. This preview inventories active revision references, but it does not infer a rollback release or authorize deletion." >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r APP; do
            APP_NAME="$(printf '%s' "$APP" | jq -r '.name')"
            APP_RG="$(printf '%s' "$APP" | jq -r '.resourceGroup')"
            REVISIONS="$(az containerapp revision list --name "$APP_NAME" --resource-group "$APP_RG" --all --output json)"
            printf '%s' "$REVISIONS" | jq -e 'type == "array" and all(.[]; (.properties.active | type) == "boolean" and (if .properties.active == true then (.properties.template.containers | type == "array" and length > 0 and all(.[]; (.image | type == "string" and length > 0))) else true end))' >/dev/null
            while IFS= read -r IMAGE_REF; do
              [[ "$IMAGE_REF" == "${ACR_NAME}.azurecr.io/"* ]] || continue
              if [[ "$IMAGE_REF" =~ ^[^/]+/([^@]+)@(sha256:[a-f0-9]{64})$ ]]; then
                echo "- ACTIVE REVISION DIGEST ${BASH_REMATCH[1]} ${BASH_REMATCH[2]} (${APP_NAME})" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "An active image from this ACR is not digest-qualified; complete protected-digest inventory cannot be proven." >&2
                exit 1
              fi
            done < <(printf '%s' "$REVISIONS" | jq -r '.[] | select(.properties.active == true) | .properties.template.containers[]?.image')
          done < <(jq -c '.[]' container-apps.json)

          for REPOSITORY in "${REPOSITORIES[@]}"; do
            MANIFESTS_JSON="$(az acr manifest list-metadata --registry "$ACR_NAME" --name "$REPOSITORY" --output json)"
            printf '%s' "$MANIFESTS_JSON" | jq -e 'type == "array" and all(.[]; (.digest | test("^sha256:[a-f0-9]{64}$")) and ((.tags == null) or (.tags | type == "array")) and ((.lastUpdateTime // .createdTime) | type == "string"))' >/dev/null
            MANIFEST_COUNT="$(printf '%s' "$MANIFESTS_JSON" | jq 'length')"
            echo "- INVENTORY ${REPOSITORY}: ${MANIFEST_COUNT} manifests" >> "$GITHUB_STEP_SUMMARY"
            printf '%s' "$MANIFESTS_JSON" | jq -r '.[] | "  - \(.digest) | tags=\((.tags // []) | join(",")) | updated=\(.lastUpdateTime // .createdTime) | sizeBytes=\(.imageSize // "unknown")"' >> "$GITHUB_STEP_SUMMARY"
          done
