name: Phase 10 Retention Cleanup (Internal)

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Preview only; do not delete anything'
        required: true
        default: true
        type: boolean
      keepLastPackages:
        description: 'Keep the most recent package versions per GHCR image'
        required: true
        default: 10
        type: number
      olderThanDays:
        description: 'Only delete package versions older than this many days'
        required: true
        default: 30
        type: number
      cleanupArtifacts:
        description: 'Also delete old GitHub Actions artifacts'
        required: true
        default: true
        type: boolean
      cleanupAcr:
        description: 'Also clean stale ACR image tags after ACR cutover'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read
  packages: write
  actions: write
  id-token: write

jobs:
  cleanup:
    name: Cleanup GHCR Images and Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Capture retention inputs
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dryRun=${{ inputs.dryRun }}" >> "$GITHUB_OUTPUT"
            echo "keepLastPackages=${{ inputs.keepLastPackages }}" >> "$GITHUB_OUTPUT"
            echo "olderThanDays=${{ inputs.olderThanDays }}" >> "$GITHUB_OUTPUT"
            echo "cleanupArtifacts=${{ inputs.cleanupArtifacts }}" >> "$GITHUB_OUTPUT"
            echo "cleanupAcr=${{ inputs.cleanupAcr }}" >> "$GITHUB_OUTPUT"
          else
            echo "dryRun=false" >> "$GITHUB_OUTPUT"
            echo "keepLastPackages=10" >> "$GITHUB_OUTPUT"
            echo "olderThanDays=30" >> "$GITHUB_OUTPUT"
            echo "cleanupArtifacts=true" >> "$GITHUB_OUTPUT"
            echo "cleanupAcr=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview cleanup scope
        shell: bash
        run: |
          echo "## 🧹 Phase 10 Retention Cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry Run | ${{ steps.params.outputs.dryRun }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Keep Last Packages | ${{ steps.params.outputs.keepLastPackages }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Older Than Days | ${{ steps.params.outputs.olderThanDays }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cleanup Artifacts | ${{ steps.params.outputs.cleanupArtifacts }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cleanup ACR | ${{ steps.params.outputs.cleanupAcr }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | ${{ github.repository }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scheduled Run | Sundays at 03:00 UTC |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow targets GHCR package versions, the shared platform ACR image tags, and GitHub Actions artifacts. It does not touch the app environment resource groups, Container Apps, Key Vault, or Log Analytics." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Azure resource cleanup remains manual through the Phase 10 deploy orchestrator with cleanupInfra=true." >> "$GITHUB_STEP_SUMMARY"

      - name: Delete old GHCR versions
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ownerType = context.payload.repository?.owner?.type || 'User';
            const dryRun = String('${{ steps.params.outputs.dryRun }}') === 'true';
            const keepLastPackages = Number('${{ steps.params.outputs.keepLastPackages }}');
            const olderThanDays = Number('${{ steps.params.outputs.olderThanDays }}');
            const cutoff = new Date(Date.now() - olderThanDays * 24 * 60 * 60 * 1000);
            const packageNames = [
              'orderprocessing-gateway',
              'orderprocessing-orders',
              'orderprocessing-inventory',
              'orderprocessing-notifications',
              'orderprocessing-ui'
            ];

            const summary = [];

            for (const package_name of packageNames) {
              let versions = [];
              try {
                versions = await github.paginate(
                  ownerType === 'Organization'
                    ? 'GET /orgs/{org}/packages/{package_type}/{package_name}/versions'
                    : 'GET /users/{username}/packages/{package_type}/{package_name}/versions',
                  ownerType === 'Organization'
                    ? {
                        org: owner,
                        package_type: 'container',
                        package_name,
                        per_page: 100
                      }
                    : {
                        username: owner,
                        package_type: 'container',
                        package_name,
                        per_page: 100
                      }
                );
              } catch (error) {
                if (error.status === 404) {
                  summary.push(`SKIP ${package_name} package not found`);
                  continue;
                }

                throw error;
              }

              const sorted = versions
                .slice()
                .sort((a, b) => new Date(b.updated_at || b.created_at || 0) - new Date(a.updated_at || a.created_at || 0));

              let retained = 0;

              for (const version of sorted) {
                const versionDate = new Date(version.updated_at || version.created_at || 0);
                const shouldKeep = retained < keepLastPackages || versionDate >= cutoff;

                if (shouldKeep) {
                  retained += 1;
                  summary.push(`KEEP ${package_name} ${version.name || version.id}`);
                  continue;
                }

                summary.push(`${dryRun ? 'DRY RUN DELETE' : 'DELETE'} ${package_name} ${version.name || version.id}`);
                if (!dryRun) {
                  await github.request(
                    ownerType === 'Organization'
                      ? 'DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}'
                      : 'DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                    ownerType === 'Organization'
                      ? {
                          org: owner,
                          package_type: 'container',
                          package_name,
                          package_version_id: version.id
                        }
                      : {
                          username: owner,
                          package_type: 'container',
                          package_name,
                          package_version_id: version.id
                        }
                  );
                }
              }
            }

            core.summary.addHeading('GHCR package retention');
            core.summary.addRaw(summary.join('\n')).addEOL();
            await core.summary.write();

      - name: Delete old GitHub Actions artifacts
        if: ${{ steps.params.outputs.cleanupArtifacts == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const dryRun = String('${{ steps.params.outputs.dryRun }}') === 'true';
            const olderThanDays = Number('${{ steps.params.outputs.olderThanDays }}');
            const cutoff = new Date(Date.now() - olderThanDays * 24 * 60 * 60 * 1000);
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner,
              repo,
              per_page: 100
            });

            const deletions = [];
            for (const artifact of artifacts) {
              const createdAt = new Date(artifact.created_at);
              if (createdAt < cutoff) {
                deletions.push(`${artifact.name} (${artifact.id})`);
                if (!dryRun) {
                  await github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: artifact.id
                  });
                }
              }
            }

            core.summary.addHeading('Artifact retention');
            if (deletions.length === 0) {
              core.summary.addRaw('No artifacts matched the retention rule.').addEOL();
            } else {
              core.summary.addRaw(deletions.join('\n')).addEOL();
            }
            await core.summary.write();

      - name: Write cleanup result
        shell: bash
        run: |
          if [ "${{ steps.params.outputs.dryRun }}" = "true" ]; then
            echo "Dry run completed. No GHCR packages, ACR tags, or artifacts were deleted." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Retention cleanup completed." >> "$GITHUB_STEP_SUMMARY"
          fi

  cleanup_acr:
    name: Cleanup ACR Images (Platform)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cleanupAcr == true) }}
    environment: dev

    steps:
      - name: Capture retention inputs
        id: params
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dryRun=${{ inputs.dryRun }}" >> "$GITHUB_OUTPUT"
            echo "keepLastPackages=${{ inputs.keepLastPackages }}" >> "$GITHUB_OUTPUT"
            echo "olderThanDays=${{ inputs.olderThanDays }}" >> "$GITHUB_OUTPUT"
          else
            echo "dryRun=false" >> "$GITHUB_OUTPUT"
            echo "keepLastPackages=10" >> "$GITHUB_OUTPUT"
            echo "olderThanDays=30" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure CLI Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Delete stale ACR tags
        shell: bash
        run: |
          set -euo pipefail

          PLATFORM_SUFFIX="platform"
          ACR_NAME="$(printf 'xyops%s' "${{ github.repository_owner }}orderprocessing${PLATFORM_SUFFIX}" | tr '[:upper:]' '[:lower:]' | tr -d '-')"
          RG_NAME="rg-orderprocessing-${PLATFORM_SUFFIX}"
          DRY_RUN="${{ steps.params.outputs.dryRun }}"
          KEEP_LAST="${{ steps.params.outputs.keepLastPackages }}"
          OLDER_THAN_DAYS="${{ steps.params.outputs.olderThanDays }}"
          CUTOFF_EPOCH="$(date -u -d "${OLDER_THAN_DAYS} days ago" +%s)"
          REPOSITORIES=(
            orderprocessing-gateway
            orderprocessing-orders
            orderprocessing-inventory
            orderprocessing-notifications
            orderprocessing-ui
          )

          {
            echo "## ACR retention: platform"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| ACR | ${ACR_NAME} |"
            echo "| Resource Group | ${RG_NAME} |"
            echo "| Dry Run | ${DRY_RUN} |"
            echo "| Keep Last | ${KEEP_LAST} |"
            echo "| Older Than Days | ${OLDER_THAN_DAYS} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if ! az acr show --name "$ACR_NAME" --only-show-errors 1>/dev/null 2>&1; then
            echo "ACR '${ACR_NAME}' does not exist yet. Skipping platform cleanup." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ACTIVE_IMAGES="$(az containerapp list --query "[].properties.template.containers[].image" -o tsv 2>/dev/null || true)"

          for REPOSITORY in "${REPOSITORIES[@]}"; do
            if ! az acr repository show --name "$ACR_NAME" --repository "$REPOSITORY" --only-show-errors 1>/dev/null 2>&1; then
              echo "- SKIP ${REPOSITORY}: repository not found" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            TAGS_JSON="$(az acr repository show-tags --name "$ACR_NAME" --repository "$REPOSITORY" --orderby time_desc --detail -o json)"
            TAG_COUNT="$(printf '%s' "$TAGS_JSON" | jq 'length')"

            if [ "$TAG_COUNT" -eq 0 ]; then
              echo "- SKIP ${REPOSITORY}: no tags" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            INDEX=0
            printf '%s' "$TAGS_JSON" | jq -c '.[]' | while read -r TAG_ITEM; do
              TAG_NAME="$(printf '%s' "$TAG_ITEM" | jq -r '.name')"
              UPDATED_AT="$(printf '%s' "$TAG_ITEM" | jq -r '.lastUpdateTime // .createdTime')"
              UPDATED_EPOCH="$(date -u -d "$UPDATED_AT" +%s)"
              IMAGE_REF="${ACR_NAME}.azurecr.io/${REPOSITORY}:${TAG_NAME}"

              if [ "$INDEX" -lt "$KEEP_LAST" ]; then
                echo "- KEEP ${REPOSITORY}:${TAG_NAME}: within latest ${KEEP_LAST}" >> "$GITHUB_STEP_SUMMARY"
                INDEX=$((INDEX + 1))
                continue
              fi

              if [ "$UPDATED_EPOCH" -ge "$CUTOFF_EPOCH" ]; then
                echo "- KEEP ${REPOSITORY}:${TAG_NAME}: newer than ${OLDER_THAN_DAYS} days" >> "$GITHUB_STEP_SUMMARY"
                INDEX=$((INDEX + 1))
                continue
              fi

              if printf '%s\n' "$ACTIVE_IMAGES" | grep -Fxq "$IMAGE_REF"; then
                echo "- KEEP ${REPOSITORY}:${TAG_NAME}: referenced by active Container App revision" >> "$GITHUB_STEP_SUMMARY"
                INDEX=$((INDEX + 1))
                continue
              fi

              if [ "$DRY_RUN" = "true" ]; then
                echo "- DRY RUN DELETE ${REPOSITORY}:${TAG_NAME}" >> "$GITHUB_STEP_SUMMARY"
              else
                az acr repository delete --name "$ACR_NAME" --image "${REPOSITORY}:${TAG_NAME}" --yes --only-show-errors
                echo "- DELETE ${REPOSITORY}:${TAG_NAME}" >> "$GITHUB_STEP_SUMMARY"
              fi

              INDEX=$((INDEX + 1))
            done
          done
