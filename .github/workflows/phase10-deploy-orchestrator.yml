name: Phase 10 Deploy Orchestrator

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      location:
        description: 'Azure region'
        required: true
        default: 'centralindia'
        type: string
      publicDomain:
        description: 'Optional public DNS zone suffix used to build friendly aliases, e.g. contoso.com'
        required: false
        default: ''
        type: string
      bindAliases:
        description: 'Enable friendly alias summary and binding checks'
        required: false
        default: false
        type: boolean
      aliasMode:
        description: 'Friendly alias mode: direct ACA binding or front-door/DNS summary only'
        required: false
        default: 'direct'
        type: choice
        options:
          - direct
          - frontdoor
      dryRun:
        description: 'Dry run (what-if only)'
        required: true
        default: false
        type: boolean
      cleanupInfra:
        description: 'Destructive cleanup (tears down the environment-scoped resource group)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: Phase 10 Preflight
    if: ${{ !inputs.dryRun && !inputs.cleanupInfra }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Azure CLI Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Check Phase 10 prerequisites
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then ENV_SUFFIX="stg"; else ENV_SUFFIX="${{ inputs.environment }}"; fi
          RG_NAME="rg-orderprocessing-${ENV_SUFFIX}"
          KV_NAME="kv-orderprocessing-${ENV_SUFFIX}"
          echo "Checking Phase 10 prerequisites for ${ENV_SUFFIX}..." 
          echo "## ✅ Phase 10 Preflight" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Azure login | validated by azure/login |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment suffix | ${ENV_SUFFIX} |" >> $GITHUB_STEP_SUMMARY
          echo "| Resource Group | will be created by infra deployment if absent |" >> $GITHUB_STEP_SUMMARY
          echo "| Key Vault | will be created by infra deployment if absent |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Phase 10 preflight completed. Clean environments are allowed to continue into infra deployment." >> $GITHUB_STEP_SUMMARY

  build-images:
    name: Build Phase 10 Images
    if: ${{ !inputs.dryRun && !inputs.cleanupInfra }}
    needs: [preflight]
    uses: ./.github/workflows/build-phase10-images.yml
    with:
      imageTag: phase10

  deploy-or-cleanup:
    name: Deploy or Cleanup Phase 10
    needs: [preflight, build-images]
    if: ${{ always() && (inputs.dryRun || inputs.cleanupInfra || needs.build-images.result == 'success') }}
    uses: ./.github/workflows/infra-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      location: ${{ inputs.location }}
      publicDomain: ${{ inputs.publicDomain }}
      bindAliases: ${{ inputs.bindAliases }}
      aliasMode: ${{ inputs.aliasMode }}
      dryRun: ${{ inputs.dryRun }}
      cleanupInfra: ${{ inputs.cleanupInfra }}
    secrets: inherit

  summary:
    name: Phase 10 Run Summary
    runs-on: ubuntu-latest
    needs: [preflight, build-images, deploy-or-cleanup]
    if: always()
    steps:
      - name: Write summary
        shell: bash
        run: |
          echo "## 📊 Phase 10 Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 User Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Location | ${{ inputs.location }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry Run | ${{ inputs.dryRun }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cleanup Infra | ${{ inputs.cleanupInfra }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bind Aliases | ${{ inputs.bindAliases }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Alias Mode | ${{ inputs.aliasMode }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Public Domain | ${{ inputs.publicDomain || '(none)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Job Execution Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 10 Preflight | ${{ needs.preflight.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Phase 10 Images | ${{ needs.build-images.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy or Cleanup Phase 10 | ${{ needs.deploy-or-cleanup.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Summary | success |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dryRun }}" = "true" ] || [ "${{ inputs.cleanupInfra }}" = "true" ]; then
            echo "| Build Skipped | Yes |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Build Skipped | No |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Cleanup Requested | ${{ inputs.cleanupInfra }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Environment Execution" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.environment }}" = "dev" ]; then
            echo "| Dev | ${{ needs.deploy-or-cleanup.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Staging | skipped |" >> $GITHUB_STEP_SUMMARY
            echo "| Prod | skipped |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.environment }}" = "staging" ]; then
            echo "| Dev | skipped |" >> $GITHUB_STEP_SUMMARY
            echo "| Staging | ${{ needs.deploy-or-cleanup.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Prod | skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Dev | skipped |" >> $GITHUB_STEP_SUMMARY
            echo "| Staging | skipped |" >> $GITHUB_STEP_SUMMARY
            echo "| Prod | ${{ needs.deploy-or-cleanup.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Run and Endpoint Traceability" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Wrapper Run ID | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Wrapper Run Attempt | ${{ github.run_attempt }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Wrapper Run URL | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Workflow Output Name | ${{ needs.deploy-or-cleanup.outputs.deploymentName || '(not deployed)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gateway URL | https://${{ needs.deploy-or-cleanup.outputs.gatewayFqdn || 'n/a' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gateway Swagger | https://${{ needs.deploy-or-cleanup.outputs.gatewayFqdn || 'n/a' }}/swagger |" >> $GITHUB_STEP_SUMMARY
          echo "| UI URL | https://${{ needs.deploy-or-cleanup.outputs.uiFqdn || 'n/a' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Verification Checklist" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.cleanupInfra }}" = "true" ]; then
            echo "1. Confirm the resource group deletion request is visible in Azure." >> $GITHUB_STEP_SUMMARY
            echo "2. Confirm the environment will be recreated only after a fresh non-cleanup wrapper run." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.dryRun }}" = "true" ]; then
            echo "1. Review the what-if delta and compare it to the expected resource changes." >> $GITHUB_STEP_SUMMARY
            echo "2. Re-run the wrapper with dryRun=false when the plan is approved." >> $GITHUB_STEP_SUMMARY
          else
            echo "1. Open the Gateway Swagger URL and confirm the API surface is reachable." >> $GITHUB_STEP_SUMMARY
            echo "2. Open the UI URL and confirm the frontend resolves successfully." >> $GITHUB_STEP_SUMMARY
            echo "3. Run the transport publish/consume smoke and replay smoke." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📎 Copyable Verification Targets" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run URL | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gateway Swagger | https://${{ needs.deploy-or-cleanup.outputs.gatewayFqdn || 'n/a' }}/swagger |" >> $GITHUB_STEP_SUMMARY
          echo "| UI | https://${{ needs.deploy-or-cleanup.outputs.uiFqdn || 'n/a' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏗️ What Gets Created Automatically" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Automated? | Trigger |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| OIDC + GitHub Secrets | ✅ Prerequisite | Azure Initial Setup workflow |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 10 service images | ✅ Yes | build-phase10-images.yml or wrapper run |" >> $GITHUB_STEP_SUMMARY
          echo "| Resource Group + Service Bus + Log Analytics + App Insights + Container Apps + Function App + Key Vault | ✅ Yes | phase10-deploy-orchestrator.yml with cleanupInfra=false |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🗑️ What Can Be Safely Deleted and Re-Created" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Can Delete? | Notes |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Azure Phase 10 Resource Group | ⚠️ Caution | Re-created by the wrapper when cleanupInfra=false and deleted when cleanupInfra=true |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Apps / Function App / Key Vault / Insights / Service Bus | ✅ Yes | Recreated by the internal infra workflow as part of the environment stack |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Environment secrets | ⚠️ Caution | Recreated by Azure Initial Setup if removed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Current Mode" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.cleanupInfra }}" = "true" ]; then
            echo "- Cleanup mode: the wrapper queued destructive teardown for the selected environment." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.dryRun }}" = "true" ]; then
            echo "- Dry-run mode: the wrapper executed validation only." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.preflight.result }}" != "success" ]; then
            echo "- Setup-needed mode: the wrapper stopped before deploy because Phase 10 prerequisites were missing." >> $GITHUB_STEP_SUMMARY
          else
            echo "- Install/deploy mode: the wrapper built images and deployed the Phase 10 runtime stack." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.cleanupInfra }}" = "true" ]; then
            echo "1. Confirm the queued resource-group deletion in Azure." >> $GITHUB_STEP_SUMMARY
            echo "2. Re-run the wrapper with cleanupInfra=false when you are ready to recreate the stack." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.dryRun }}" = "true" ]; then
            echo "1. Review the what-if output." >> $GITHUB_STEP_SUMMARY
            echo "2. Re-run with dryRun=false when the plan looks correct." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.preflight.result }}" != "success" ]; then
            echo "1. Run Azure Initial Setup / prerequisite provisioning." >> $GITHUB_STEP_SUMMARY
            echo "2. Re-run the wrapper after the missing environment resources exist." >> $GITHUB_STEP_SUMMARY
          else
            echo "1. Verify the output URLs against the runbook." >> $GITHUB_STEP_SUMMARY
            echo "2. Run the transport publish/consume smoke." >> $GITHUB_STEP_SUMMARY
            echo "3. Run the replay smoke." >> $GITHUB_STEP_SUMMARY
          fi
