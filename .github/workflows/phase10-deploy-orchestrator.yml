name: 01 Phase 10 Azure Deploy Orchestrator

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      location:
        description: 'Azure region'
        required: true
        default: 'centralindia'
        type: string
      publicDomain:
        description: 'Optional public DNS zone suffix used to build friendly aliases, e.g. contoso.com'
        required: false
        default: ''
        type: string
      bindAliases:
        description: 'Enable friendly alias summary and binding checks'
        required: false
        default: false
        type: boolean
      aliasMode:
        description: 'Friendly alias mode: direct ACA binding or front-door/DNS summary only'
        required: false
        default: 'direct'
        type: choice
        options:
          - direct
          - frontdoor
      dryRun:
        description: 'Dry run (what-if only)'
        required: true
        default: false
        type: boolean
      cleanupInfra:
        description: 'Destructive cleanup (tears down the environment-scoped resource group)'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: Phase 10 Preflight
    if: ${{ !inputs.dryRun && !inputs.cleanupInfra }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Azure CLI Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Check Phase 10 prerequisites
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then ENV_SUFFIX="stg"; else ENV_SUFFIX="${{ inputs.environment }}"; fi
          RG_NAME="rg-orderprocessing-${ENV_SUFFIX}"
          KV_NAME="kv-orderprocessing-${ENV_SUFFIX}"
          echo "Checking Phase 10 prerequisites for ${ENV_SUFFIX}..." 
          echo "## ✅ Phase 10 Preflight" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Azure login | validated by azure/login |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment suffix | ${ENV_SUFFIX} |" >> $GITHUB_STEP_SUMMARY
          echo "| Resource Group | will be created by Azure deployment if absent |" >> $GITHUB_STEP_SUMMARY
          echo "| Key Vault | will be created by Azure deployment if absent |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Phase 10 preflight completed. Clean environments are allowed to continue into Azure deployment." >> $GITHUB_STEP_SUMMARY

  build_images:
    name: Build Phase 10 Images
    if: ${{ !inputs.dryRun && !inputs.cleanupInfra }}
    needs: [preflight, resolve_platform]
    uses: ./.github/workflows/build-phase10-images.yml
    with:
      imageTag: phase10
      registryLoginServer: ${{ needs.resolve_platform.outputs.acrLoginServer }}
      registryName: ${{ needs.resolve_platform.outputs.acrName }}
      environment: ${{ inputs.environment }}
    secrets: inherit

  resolve_platform:
    name: Resolve Phase 10 Platform Foundation
    needs: [preflight]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      platformResourceGroup: ${{ steps.params.outputs.platformResourceGroup }}
      acrName: ${{ steps.params.outputs.acrName }}
      acrLoginServer: ${{ steps.params.outputs.acrLoginServer }}
      acrPullIdentityId: ${{ steps.params.outputs.acrPullIdentityId }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Azure CLI Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Resolve platform foundation inputs
        id: params
        shell: bash
        run: |
          PLATFORM_SUFFIX="platform"
          PLATFORM_RG="rg-orderprocessing-${PLATFORM_SUFFIX}"
          PLATFORM_ACR_NAME="$(printf 'xyops%s' "${{ github.repository_owner }}orderprocessing${PLATFORM_SUFFIX}" | tr '[:upper:]' '[:lower:]' | tr -d '-')"
          PLATFORM_ACR_LOGIN_SERVER="${PLATFORM_ACR_NAME}.azurecr.io"
          PLATFORM_PULL_IDENTITY_NAME="id-orderprocessing-acr-pull-${PLATFORM_SUFFIX}"
          PLATFORM_PULL_IDENTITY_ID="/subscriptions/${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}/resourceGroups/${PLATFORM_RG}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${PLATFORM_PULL_IDENTITY_NAME}"

          echo "platformResourceGroup=${PLATFORM_RG}" >> "$GITHUB_OUTPUT"
          echo "acrName=${PLATFORM_ACR_NAME}" >> "$GITHUB_OUTPUT"
          echo "acrLoginServer=${PLATFORM_ACR_LOGIN_SERVER}" >> "$GITHUB_OUTPUT"
          echo "acrPullIdentityId=${PLATFORM_PULL_IDENTITY_ID}" >> "$GITHUB_OUTPUT"

      - name: Verify platform foundation exists
        if: ${{ !inputs.dryRun && !inputs.cleanupInfra }}
        shell: bash
        run: |
          RG_NAME="${{ steps.params.outputs.platformResourceGroup }}"
          ACR_NAME="${{ steps.params.outputs.acrName }}"
          ACR_LOGIN_SERVER="${{ steps.params.outputs.acrLoginServer }}"
          ACR_PULL_IDENTITY_ID="${{ steps.params.outputs.acrPullIdentityId }}"

          if ! az group exists --name "$RG_NAME" | grep -q true; then
            echo "## ❌ Phase 10 platform foundation is missing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Platform Resource Group | ${RG_NAME} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| ACR Name | ${ACR_NAME} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Decision | Run 00 Azure Platform Foundation first |" >> "$GITHUB_STEP_SUMMARY"
            echo "Platform resource group ${RG_NAME} does not exist. Run the platform foundation workflow before the deploy orchestrator." >&2
            exit 1
          fi

          if ! az acr show --name "$ACR_NAME" --only-show-errors 1>/dev/null 2>&1; then
            echo "## ❌ Phase 10 platform ACR is missing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Platform Resource Group | ${RG_NAME} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| ACR Name | ${ACR_NAME} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Decision | Run 00 Azure Platform Foundation first |" >> "$GITHUB_STEP_SUMMARY"
            echo "ACR ${ACR_NAME} does not exist yet. Run the platform foundation workflow before the deploy orchestrator." >&2
            exit 1
          fi

          if ! az identity show --ids "$ACR_PULL_IDENTITY_ID" --only-show-errors 1>/dev/null 2>&1; then
            echo "## ❌ Phase 10 platform pull identity is missing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Platform Resource Group | ${RG_NAME} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Pull Identity | ${ACR_PULL_IDENTITY_ID} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Decision | Run 00 Azure Platform Foundation first |" >> "$GITHUB_STEP_SUMMARY"
            echo "Pull identity ${ACR_PULL_IDENTITY_ID} does not exist yet. Run the platform foundation workflow before the deploy orchestrator." >&2
            exit 1
          fi

          {
            echo "## 🧰 Phase 10 Platform Foundation Resolved"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Resource Group | ${RG_NAME} |"
            echo "| ACR Name | ${ACR_NAME} |"
            echo "| ACR Login Server | ${ACR_LOGIN_SERVER} |"
            echo "| Pull Identity | ${ACR_PULL_IDENTITY_ID} |"
            echo "| Status | ready |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "platformResourceGroup=${RG_NAME}" >> "$GITHUB_OUTPUT"
          echo "acrName=${ACR_NAME}" >> "$GITHUB_OUTPUT"
          echo "acrLoginServer=${ACR_LOGIN_SERVER}" >> "$GITHUB_OUTPUT"
          echo "acrPullIdentityId=${ACR_PULL_IDENTITY_ID}" >> "$GITHUB_OUTPUT"

  route_child_workflow:
    name: Phase 10 Routed Child Workflow
    runs-on: ubuntu-latest
    needs: [preflight, resolve_platform, build_images]
    if: always()
    outputs:
      should_call: ${{ steps.route.outputs.should_call }}
      route_mode: ${{ steps.route.outputs.route_mode }}
      route_reason: ${{ steps.route.outputs.route_reason }}
    steps:
      - name: Resolve workflow route
        id: route
        shell: bash
        run: |
          SHOULD_CALL="false"
          ROUTE_MODE="blocked"
          ROUTE_REASON="unknown"

          if [ "${{ inputs.dryRun }}" = "true" ]; then
            SHOULD_CALL="true"
            ROUTE_MODE="validate"
            ROUTE_REASON="dry-run validation path"
          elif [ "${{ inputs.cleanupInfra }}" = "true" ]; then
            SHOULD_CALL="true"
            ROUTE_MODE="cleanup"
            ROUTE_REASON="destructive cleanup path"
          elif [ "${{ needs.preflight.result }}" = "success" ] && [ "${{ needs.resolve_platform.result }}" = "success" ] && [ "${{ needs.build_images.result }}" = "success" ]; then
            SHOULD_CALL="true"
            ROUTE_MODE="deploy"
            ROUTE_REASON="preflight, platform foundation, and image build completed"
          elif [ "${{ needs.preflight.result }}" != "success" ]; then
            ROUTE_REASON="blocked by preflight result: ${{ needs.preflight.result }}"
          elif [ "${{ needs.resolve_platform.result }}" != "success" ]; then
            ROUTE_REASON="blocked by platform foundation result: ${{ needs.resolve_platform.result }}"
          else
            ROUTE_REASON="blocked by image build result: ${{ needs.build_images.result }}"
          fi

          {
            echo "should_call=${SHOULD_CALL}"
            echo "route_mode=${ROUTE_MODE}"
            echo "route_reason=${ROUTE_REASON}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 🧭 Phase 10 Routed Child Workflow"
            echo ""
            echo "| Field | Value |"
            echo "|------|-------|"
            echo "| should_call | ${SHOULD_CALL} |"
            echo "| route_mode | ${ROUTE_MODE} |"
            echo "| route_reason | ${ROUTE_REASON} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_or_cleanup:
    name: Deploy Azure Phase 10 Resources (Internal)
    needs: [resolve_platform, route_child_workflow]
    if: ${{ always() && needs.route_child_workflow.outputs.should_call == 'true' }}
    uses: ./.github/workflows/infra-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      location: ${{ inputs.location }}
      publicDomain: ${{ inputs.publicDomain }}
      bindAliases: ${{ inputs.bindAliases }}
      aliasMode: ${{ inputs.aliasMode }}
      dryRun: ${{ inputs.dryRun }}
      cleanupInfra: ${{ inputs.cleanupInfra }}
      acrName: ${{ needs.resolve_platform.outputs.acrName }}
      acrLoginServer: ${{ needs.resolve_platform.outputs.acrLoginServer }}
      acrPullIdentityId: ${{ needs.resolve_platform.outputs.acrPullIdentityId }}
      gatewayImage: ${{ needs.resolve_platform.outputs.acrLoginServer && format('{0}/orderprocessing-gateway:phase10', needs.resolve_platform.outputs.acrLoginServer) || '' }}
      ordersImage: ${{ needs.resolve_platform.outputs.acrLoginServer && format('{0}/orderprocessing-orders:phase10', needs.resolve_platform.outputs.acrLoginServer) || '' }}
      paymentsImage: ${{ needs.resolve_platform.outputs.acrLoginServer && format('{0}/orderprocessing-payments:phase10', needs.resolve_platform.outputs.acrLoginServer) || '' }}
      inventoryImage: ${{ needs.resolve_platform.outputs.acrLoginServer && format('{0}/orderprocessing-inventory:phase10', needs.resolve_platform.outputs.acrLoginServer) || '' }}
      notificationsImage: ${{ needs.resolve_platform.outputs.acrLoginServer && format('{0}/orderprocessing-notifications:phase10', needs.resolve_platform.outputs.acrLoginServer) || '' }}
      uiImage: ${{ needs.resolve_platform.outputs.acrLoginServer && format('{0}/orderprocessing-ui:phase10', needs.resolve_platform.outputs.acrLoginServer) || '' }}
    secrets: inherit

  gate_diagnostic:
    name: Phase 10 Routed Gate Diagnostic
    runs-on: ubuntu-latest
    needs: [preflight, resolve_platform, build_images, route_child_workflow, deploy_or_cleanup]
    if: always()
    steps:
      - name: Write gate diagnostic
        shell: bash
        run: |
          echo "## 🔎 Phase 10 Routed Gate Diagnostic" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| dryRun | ${{ inputs.dryRun }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cleanupInfra | ${{ inputs.cleanupInfra }} |" >> $GITHUB_STEP_SUMMARY
          echo "| preflight | ${{ needs.preflight.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| resolve_platform | ${{ needs.resolve_platform.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| build_images | ${{ needs.build_images.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| route_child_workflow | ${{ needs.route_child_workflow.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| route_mode | ${{ needs.route_child_workflow.outputs.route_mode }} |" >> $GITHUB_STEP_SUMMARY
          echo "| route_reason | ${{ needs.route_child_workflow.outputs.route_reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| deploy_or_cleanup | ${{ needs.deploy_or_cleanup.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| deploy_call_expected | ${{ needs.route_child_workflow.outputs.should_call }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dryRun }}" = "true" ]; then
            echo "| decision | dry-run path, deploy intentionally skipped |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.cleanupInfra }}" = "true" ]; then
            echo "| decision | cleanup path, deploy intentionally replaced by teardown |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.preflight.result }}" != "success" ]; then
            echo "| decision | blocked before build/deploy by preflight |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.resolve_platform.result }}" != "success" ]; then
            echo "| decision | blocked before image build by platform foundation resolution |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build_images.result }}" != "success" ]; then
            echo "| decision | blocked before deploy by image build |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.route_child_workflow.result }}" != "success" ]; then
            echo "| decision | routed child workflow did not authorize child workflow invocation |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy_or_cleanup.result }}" = "success" ]; then
            echo "| decision | deploy or cleanup child workflow completed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| decision | deploy call was expected but child workflow result is skipped; inspect the child job logs and workflow_call wiring |" >> $GITHUB_STEP_SUMMARY
          fi

  summary:
    name: Phase 10 Run Summary
    runs-on: ubuntu-latest
    needs: [preflight, resolve_platform, build_images, route_child_workflow, deploy_or_cleanup, gate_diagnostic]
    if: always()
    steps:
      - name: Write summary
        shell: bash
        run: |
          echo "## 📊 Phase 10 Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 User Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Location | ${{ inputs.location }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry Run | ${{ inputs.dryRun }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cleanup Infra | ${{ inputs.cleanupInfra }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bind Aliases | ${{ inputs.bindAliases }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Alias Mode | ${{ inputs.aliasMode }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Public Domain | ${{ inputs.publicDomain || '(none)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Job Execution Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 10 Preflight | ${{ needs.preflight.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Resolve Phase 10 Platform Foundation | ${{ needs.resolve_platform.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Phase 10 Images | ${{ needs.build_images.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 10 Routed Child Workflow | ${{ needs.route_child_workflow.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Azure Phase 10 Resources (Internal) | ${{ needs.deploy_or_cleanup.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Summary | success |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.cleanupInfra }}" = "true" ]; then
            echo "| Route Gate | cleanup requested; deploy leg replaced by teardown |" >> $GITHUB_STEP_SUMMARY
            echo "| Route Status Note | expected teardown path, not an Azure deploy run |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.dryRun }}" = "true" ]; then
            echo "| Route Gate | dry-run requested; build and deploy legs skipped |" >> $GITHUB_STEP_SUMMARY
            echo "| Route Status Note | expected validation-only run |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.preflight.result }}" != "success" ]; then
            echo "| Route Gate | blocked by Phase 10 preflight failure |" >> $GITHUB_STEP_SUMMARY
            echo "| Route Status Note | fix preflight before expecting Azure deployment |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.resolve_platform.result }}" != "success" ]; then
            echo "| Route Gate | blocked by platform foundation resolution failure |" >> $GITHUB_STEP_SUMMARY
            echo "| Route Status Note | fix the platform foundation before expecting image build or Azure deployment |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build_images.result }}" != "success" ]; then
            echo "| Route Gate | blocked by image build failure |" >> $GITHUB_STEP_SUMMARY
            echo "| Route Status Note | fix the image build before expecting Azure deployment |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.route_child_workflow.result }}" != "success" ]; then
            echo "| Route Gate | routed child workflow did not authorize the child workflow call |" >> $GITHUB_STEP_SUMMARY
            echo "| Route Status Note | inspect the routed child workflow summary for the call mode and reason |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy_or_cleanup.result }}" != "success" ]; then
            echo "| Route Gate | Azure deployment or cleanup failed in the child workflow |" >> $GITHUB_STEP_SUMMARY
            echo "| Route Status Note | inspect the Deploy Azure Phase 10 Resources (Internal) job logs for the exact failure |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Route Gate | deployment path enabled |" >> $GITHUB_STEP_SUMMARY
            echo "| Route Status Note | Azure deployment should have started or completed normally |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.dryRun }}" = "true" ] || [ "${{ inputs.cleanupInfra }}" = "true" ]; then
            echo "| Build Skipped | Yes |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Build Skipped | No |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Cleanup Requested | ${{ inputs.cleanupInfra }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Environment Execution" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.environment }}" = "dev" ]; then
            echo "| Dev | ${{ needs.deploy_or_cleanup.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Staging | skipped |" >> $GITHUB_STEP_SUMMARY
            echo "| Prod | skipped |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.environment }}" = "staging" ]; then
            echo "| Dev | skipped |" >> $GITHUB_STEP_SUMMARY
            echo "| Staging | ${{ needs.deploy_or_cleanup.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Prod | skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Dev | skipped |" >> $GITHUB_STEP_SUMMARY
            echo "| Staging | skipped |" >> $GITHUB_STEP_SUMMARY
            echo "| Prod | ${{ needs.deploy_or_cleanup.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Run and Endpoint Traceability" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Wrapper Run ID | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Wrapper Run Attempt | ${{ github.run_attempt }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Wrapper Run URL | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment Name | ${{ needs.deploy_or_cleanup.outputs.deploymentName || '(not deployed)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform Resource Group | ${{ needs.resolve_platform.outputs.platformResourceGroup || '(not resolved)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform ACR | ${{ needs.resolve_platform.outputs.acrName || '(not resolved)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ACR Login Server | ${{ needs.resolve_platform.outputs.acrLoginServer || '(not resolved)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gateway URL | https://${{ needs.deploy_or_cleanup.outputs.gatewayFqdn || 'n/a' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gateway Health | https://${{ needs.deploy_or_cleanup.outputs.gatewayFqdn || 'n/a' }}/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Orders API Smoke | https://${{ needs.deploy_or_cleanup.outputs.gatewayFqdn || 'n/a' }}/api/v1/Info/runtime-configuration |" >> $GITHUB_STEP_SUMMARY
          echo "| Swagger | Reference only; use the routed Orders API smoke endpoint for Phase 10 proof. |" >> $GITHUB_STEP_SUMMARY
          echo "| UI URL | https://${{ needs.deploy_or_cleanup.outputs.uiFqdn || 'n/a' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📎 Child Summary Links" >> $GITHUB_STEP_SUMMARY
          echo "- Open the Build Phase 10 Images job for the per-service image logs." >> $GITHUB_STEP_SUMMARY
          echo "- Open the Phase 10 Routed Child Workflow job to see whether the reusable workflow call was authorized." >> $GITHUB_STEP_SUMMARY
          echo "- Open the Deploy Azure Phase 10 Resources (Internal) job for the Azure deployment details or teardown trace." >> $GITHUB_STEP_SUMMARY
          echo "- The detailed outputs remain in the nested child workflow summaries below this wrapper." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Child workflow details are available in the nested build and Azure deployment jobs below this wrapper summary." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Verification Checklist" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.cleanupInfra }}" = "true" ]; then
            echo "1. Confirm the resource group deletion request is visible in Azure." >> $GITHUB_STEP_SUMMARY
            echo "2. Confirm the environment will be recreated only after a fresh non-cleanup wrapper run." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.dryRun }}" = "true" ]; then
            echo "1. Review the what-if delta and compare it to the expected resource changes." >> $GITHUB_STEP_SUMMARY
            echo "2. Re-run the wrapper with dryRun=false when the plan is approved." >> $GITHUB_STEP_SUMMARY
          else
            echo "1. Open the Gateway Health URL and confirm the accepted Azure host is shown." >> $GITHUB_STEP_SUMMARY
            echo "2. Open the Orders API smoke URL through the gateway and confirm the API route resolves." >> $GITHUB_STEP_SUMMARY
            echo "3. Open the UI URL and confirm the frontend resolves successfully." >> $GITHUB_STEP_SUMMARY
            echo "4. Run the **02 Phase 10 Azure Runtime Smoke** workflow for Gateway/API/UI proof." >> $GITHUB_STEP_SUMMARY
            echo "5. Run the **03 Phase 10 Azure Transport Smoke** workflow for publish/consume, DLQ, and replay proof." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📎 Copyable Verification Targets" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Value |" >> $GITHUB_STEP_SUMMARY
