name: 01 Phase 10 Azure Deploy Orchestrator

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      location:
        description: 'Azure region'
        required: true
        default: 'centralindia'
        type: string
      publicDomain:
        description: 'Optional public DNS zone suffix used to build friendly aliases, e.g. contoso.com'
        required: false
        default: ''
        type: string
      bindAliases:
        description: 'Enable friendly alias summary and binding checks'
        required: false
        default: false
        type: boolean
      aliasMode:
        description: 'Friendly alias mode: direct ACA binding or front-door/DNS summary only'
        required: false
        default: 'direct'
        type: choice
        options:
          - direct
          - frontdoor
      dryRun:
        description: 'Dry run (what-if only)'
        required: true
        default: true
        type: boolean
      cleanupInfra:
        description: 'Destructive cleanup (tears down the environment-scoped resource group)'
        required: true
        default: false
        type: boolean
      candidateSha:
        description: 'Full source SHA already validated by hosted CI and immutable release build'
        required: false
        default: ''
        type: string
      releaseRunId:
        description: 'Exact successful Build Phase 10 Immutable Release workflow run ID'
        required: false
        default: ''
        type: string
      releaseArtifactName:
        description: 'Exact release artifact name from the selected producer run'
        required: false
        default: ''
        type: string
      approvedParameterIdentity:
        description: 'Reviewed SHA-256 from scripts/phase10-deployment-identity.mjs for these exact parameters'
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  verify_release:
    name: Verify candidate, hosted CI and immutable release evidence
    if: ${{ !inputs.cleanupInfra }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sourceSha: ${{ steps.manifest.outputs.source_sha }}
      deploymentWorkflowSha: ${{ github.sha }}
      releaseRunAttempt: ${{ steps.provenance.outputs.release_run_attempt }}
      releaseArtifactName: ${{ inputs.releaseArtifactName }}
      hostedCiRunId: ${{ steps.provenance.outputs.hosted_ci_run_id }}
      hostedCiRunAttempt: ${{ steps.provenance.outputs.hosted_ci_run_attempt }}
      hostedCiArtifactName: ${{ steps.provenance.outputs.hosted_ci_artifact_name }}
      sourceHostedCiRunId: ${{ steps.provenance.outputs.source_hosted_ci_run_id }}
      sourceHostedCiRunAttempt: ${{ steps.provenance.outputs.source_hosted_ci_run_attempt }}
      sourceHostedCiArtifactName: ${{ steps.provenance.outputs.source_hosted_ci_artifact_name }}
      gatewayImage: ${{ steps.manifest.outputs.gateway_image }}
      ordersImage: ${{ steps.manifest.outputs.orders_image }}
      paymentsImage: ${{ steps.manifest.outputs.payments_image }}
      inventoryImage: ${{ steps.manifest.outputs.inventory_image }}
      notificationsImage: ${{ steps.manifest.outputs.notifications_image }}
      uiImage: ${{ steps.manifest.outputs.ui_image }}
      functionsPackageSha256: ${{ steps.manifest.outputs.functions_package_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify deployment branch and source ancestry
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidateSha }}
          WORKFLOW_SHA: ${{ github.sha }}
          DEPLOYMENT_BRANCH: ${{ github.ref_name }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "candidateSha must be a full commit SHA." >&2; exit 1; }
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Deployment workflow SHA must be a full commit SHA." >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$WORKFLOW_SHA" ]] || { echo "The orchestrator checkout does not match its workflow revision." >&2; exit 1; }
          case "$TARGET_ENVIRONMENT:$DEPLOYMENT_BRANCH" in
            dev:dev|staging:staging|prod:main) ;;
            *) echo "Deployment workflow branch does not match the selected environment." >&2; exit 1 ;;
          esac
          git merge-base --is-ancestor "$CANDIDATE_SHA" "$WORKFLOW_SHA" || { echo "The immutable release source is not an ancestor of the deployment workflow revision." >&2; exit 1; }

      - name: Verify exact producer run, artifact and hosted CI result
        id: provenance
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ inputs.candidateSha }}
          DEPLOYMENT_WORKFLOW_SHA: ${{ github.sha }}
          DEPLOYMENT_BRANCH: ${{ github.ref_name }}
          RELEASE_RUN_ID: ${{ inputs.releaseRunId }}
          RELEASE_ARTIFACT_NAME: ${{ inputs.releaseArtifactName }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          ADR_VALIDATION_ENABLED: ${{ vars.ADR_VALIDATION_ENABLED }}
        run: node scripts/phase10-release-run.mjs verify

      - name: Download exact-run hosted CI evidence
        uses: actions/download-artifact@v6
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.provenance.outputs.hosted_ci_run_id }}
          name: ${{ steps.provenance.outputs.hosted_ci_artifact_name }}
          github-token: ${{ github.token }}
          path: hosted-ci-evidence

      - name: Download source-release hosted CI evidence
        uses: actions/download-artifact@v6
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.provenance.outputs.source_hosted_ci_run_id }}
          name: ${{ steps.provenance.outputs.source_hosted_ci_artifact_name }}
          github-token: ${{ github.token }}
          path: hosted-ci-source-evidence

      - name: Reconcile source hosted CI evidence to immutable release source
        shell: bash
        env:
          EVIDENCE_DIRECTORY: hosted-ci-source-evidence
          HOSTED_CI_RUN_ID: ${{ steps.provenance.outputs.source_hosted_ci_run_id }}
          HOSTED_CI_RUN_ATTEMPT: ${{ steps.provenance.outputs.source_hosted_ci_run_attempt }}
          CANDIDATE_SHA: ${{ inputs.candidateSha }}
          SOURCE_BRANCH: ${{ steps.provenance.outputs.release_source_branch }}
        run: node scripts/verify-phase10-hosted-ci-evidence.mjs

      - name: Reconcile hosted CI evidence contents to candidate
        shell: bash
        env:
          EVIDENCE_DIRECTORY: hosted-ci-evidence
          HOSTED_CI_RUN_ID: ${{ steps.provenance.outputs.hosted_ci_run_id }}
          HOSTED_CI_RUN_ATTEMPT: ${{ steps.provenance.outputs.hosted_ci_run_attempt }}
          CANDIDATE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: node scripts/verify-phase10-hosted-ci-evidence.mjs

      - name: Download selected run artifact only
        uses: actions/download-artifact@v6
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.releaseRunId }}
          name: ${{ inputs.releaseArtifactName }}
          github-token: ${{ github.token }}
          path: release

      - name: Verify immutable manifest, package hash and reviewed parameter identity
        id: manifest
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.candidateSha }}
          RELEASE_RUN_ID: ${{ inputs.releaseRunId }}
          RELEASE_RUN_ATTEMPT: ${{ steps.provenance.outputs.release_run_attempt }}
          RELEASE_ARTIFACT_NAME: ${{ inputs.releaseArtifactName }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          TARGET_LOCATION: ${{ inputs.location }}
          PUBLIC_DOMAIN: ${{ inputs.publicDomain }}
          BIND_ALIASES: ${{ inputs.bindAliases }}
          ALIAS_MODE: ${{ inputs.aliasMode }}
          CLEANUP_INFRA: ${{ inputs.cleanupInfra }}
          APPROVED_PARAMETER_IDENTITY: ${{ inputs.approvedParameterIdentity }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_PARAMETER_IDENTITY" =~ ^[0-9a-f]{64}$ ]] || { echo "A reviewed 64-character parameter identity is required." >&2; exit 1; }
          node scripts/phase10-release-manifest.mjs validate \
            --repository "${{ github.repository }}" \
            --sourceSha "$SOURCE_SHA" \
            --runId "$RELEASE_RUN_ID" \
            --runAttempt "$RELEASE_RUN_ATTEMPT" \
            --functionsZip release/functions.zip \
            --manifest release/release-manifest.json
          unzip -Z1 release/functions.zip > "$RUNNER_TEMP/functions-zip-entries.txt"
          node scripts/phase10-function-package.mjs entries "$RUNNER_TEMP/functions-zip-entries.txt"
          identity="$(node scripts/phase10-deployment-identity.mjs \
            --repoRoot . \
            --environment "$TARGET_ENVIRONMENT" \
            --location "$TARGET_LOCATION" \
            --publicDomain "$PUBLIC_DOMAIN" \
            --bindAliases "$BIND_ALIASES" \
            --aliasMode "$ALIAS_MODE" \
            --cleanupInfra "$CLEANUP_INFRA")"
          calculated="$(node -e 'const v=JSON.parse(process.argv[1]); process.stdout.write(v.identitySha256)' "$identity")"
          [[ "$calculated" == "$APPROVED_PARAMETER_IDENTITY" ]] || { echo "Approved deployment parameter identity does not match the selected inputs." >&2; exit 1; }
          node -e 'const fs=require("node:fs"); const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const keys={gateway:"gateway_image",orders:"orders_image",payments:"payments_image",inventory:"inventory_image",notifications:"notifications_image",ui:"ui_image"}; let out=`source_sha=${m.sourceSha}\nfunctions_package_sha256=${m.functionsPackage.sha256}\n`; for(const [name,key] of Object.entries(keys)){const image=m.images.find(x=>x.name===name); if(!image) throw new Error(`missing ${name}`); out+=`${key}=${image.image}\n`;} fs.appendFileSync(process.env.GITHUB_OUTPUT,out);' release/release-manifest.json

      - name: Fail closed on unresolved Azure runtime prerequisites
        run: node scripts/phase10-azure-static-preflight.mjs

  preflight:
    name: Phase 10 Preflight
    if: ${{ !inputs.cleanupInfra }}
    needs: [verify_release]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate configured identity and public origins before Azure login
        shell: bash
        env:
          IDENTITY_ENVIRONMENT: ${{ inputs.environment }}
          ENTRA_DIRECTORY_ID: ${{ vars.ENTRA_DIRECTORY_ID }}
          ENTRA_API_CLIENT_ID: ${{ vars.ENTRA_API_CLIENT_ID }}
          ENTRA_SPA_CLIENT_ID: ${{ vars.ENTRA_SPA_CLIENT_ID }}
          IDENTITY_PUBLIC_WEB_ORIGIN: ${{ vars.IDENTITY_PUBLIC_WEB_ORIGIN }}
          ENTRA_TENANT_CLAIM_TYPE: ${{ vars.ENTRA_TENANT_CLAIM_TYPE }}
          ENTRA_REGISTERED_REDIRECT_URIS: ${{ vars.ENTRA_REGISTERED_REDIRECT_URIS }}
          ENTRA_REGISTERED_LOGOUT_URIS: ${{ vars.ENTRA_REGISTERED_LOGOUT_URIS }}
          IDENTITY_TENANT_SELECTOR_ENABLED: ${{ vars.IDENTITY_TENANT_SELECTOR_ENABLED }}
        run: node scripts/prepare-entra-deployment.mjs --output "$RUNNER_TEMP/identity.parameters.json"

      - name: Azure CLI Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Check subscription, directory, RBAC and provider registrations
        shell: bash
        env:
          AZURE_EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}
          AZURE_EXPECTED_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENVIRONMENT" = "staging" ]; then ENV_SUFFIX="stg"; else ENV_SUFFIX="$TARGET_ENVIRONMENT"; fi
          export AZURE_TARGET_RESOURCE_GROUP="rg-orderprocessing-${ENV_SUFFIX}"
          node scripts/phase10-azure-preflight.mjs

  resolve_platform:
    name: Resolve Phase 10 Platform Foundation
    needs: [preflight]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      platformResourceGroup: ${{ steps.params.outputs.platformResourceGroup }}
      acrName: ${{ steps.params.outputs.acrName }}
      acrLoginServer: ${{ steps.params.outputs.acrLoginServer }}
      acrPullIdentityId: ${{ steps.params.outputs.acrPullIdentityId }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Azure CLI Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Resolve platform foundation inputs
        id: params
        shell: bash
        run: |
          PLATFORM_SUFFIX="platform"
          PLATFORM_RG="rg-orderprocessing-${PLATFORM_SUFFIX}"
          PLATFORM_ACR_NAME="$(printf 'xyops%s' "${{ github.repository_owner }}orderprocessing${PLATFORM_SUFFIX}" | tr '[:upper:]' '[:lower:]' | tr -d '-')"
          PLATFORM_ACR_LOGIN_SERVER="${PLATFORM_ACR_NAME}.azurecr.io"
          PLATFORM_PULL_IDENTITY_NAME="id-orderprocessing-acr-pull-${PLATFORM_SUFFIX}"
          PLATFORM_PULL_IDENTITY_ID="/subscriptions/${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}/resourceGroups/${PLATFORM_RG}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${PLATFORM_PULL_IDENTITY_NAME}"

          echo "platformResourceGroup=${PLATFORM_RG}" >> "$GITHUB_OUTPUT"
          echo "acrName=${PLATFORM_ACR_NAME}" >> "$GITHUB_OUTPUT"
          echo "acrLoginServer=${PLATFORM_ACR_LOGIN_SERVER}" >> "$GITHUB_OUTPUT"
          echo "acrPullIdentityId=${PLATFORM_PULL_IDENTITY_ID}" >> "$GITHUB_OUTPUT"

      - name: Verify platform foundation exists
        if: ${{ !inputs.dryRun && !inputs.cleanupInfra }}
        shell: bash
        run: |
          RG_NAME="${{ steps.params.outputs.platformResourceGroup }}"
          ACR_NAME="${{ steps.params.outputs.acrName }}"
          ACR_LOGIN_SERVER="${{ steps.params.outputs.acrLoginServer }}"
          ACR_PULL_IDENTITY_ID="${{ steps.params.outputs.acrPullIdentityId }}"

          if ! az group exists --name "$RG_NAME" | grep -q true; then
            echo "## ❌ Phase 10 platform foundation is missing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Platform Resource Group | ${RG_NAME} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| ACR Name | ${ACR_NAME} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Decision | Run 00 Azure Platform Foundation first |" >> "$GITHUB_STEP_SUMMARY"
            echo "Platform resource group ${RG_NAME} does not exist. Run the platform foundation workflow before the deploy orchestrator." >&2
            exit 1
          fi

          if ! az acr show --name "$ACR_NAME" --only-show-errors 1>/dev/null 2>&1; then
            echo "## ❌ Phase 10 platform ACR is missing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Platform Resource Group | ${RG_NAME} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| ACR Name | ${ACR_NAME} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Decision | Run 00 Azure Platform Foundation first |" >> "$GITHUB_STEP_SUMMARY"
            echo "ACR ${ACR_NAME} does not exist yet. Run the platform foundation workflow before the deploy orchestrator." >&2
            exit 1
          fi

          if ! az identity show --ids "$ACR_PULL_IDENTITY_ID" --only-show-errors 1>/dev/null 2>&1; then
            echo "## ❌ Phase 10 platform pull identity is missing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Platform Resource Group | ${RG_NAME} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Pull Identity | ${ACR_PULL_IDENTITY_ID} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Decision | Run 00 Azure Platform Foundation first |" >> "$GITHUB_STEP_SUMMARY"
            echo "Pull identity ${ACR_PULL_IDENTITY_ID} does not exist yet. Run the platform foundation workflow before the deploy orchestrator." >&2
            exit 1
          fi

          {
            echo "## 🧰 Phase 10 Platform Foundation Resolved"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Resource Group | ${RG_NAME} |"
            echo "| ACR Name | ${ACR_NAME} |"
            echo "| ACR Login Server | ${ACR_LOGIN_SERVER} |"
            echo "| Pull Identity | ${ACR_PULL_IDENTITY_ID} |"
            echo "| Status | ready |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "platformResourceGroup=${RG_NAME}" >> "$GITHUB_OUTPUT"
          echo "acrName=${ACR_NAME}" >> "$GITHUB_OUTPUT"
          echo "acrLoginServer=${ACR_LOGIN_SERVER}" >> "$GITHUB_OUTPUT"
          echo "acrPullIdentityId=${ACR_PULL_IDENTITY_ID}" >> "$GITHUB_OUTPUT"

  route_child_workflow:
    name: Phase 10 Routed Child Workflow
    runs-on: ubuntu-latest
    needs: [verify_release, preflight, resolve_platform]
    if: always()
    outputs:
      should_call: ${{ steps.route.outputs.should_call }}
      route_mode: ${{ steps.route.outputs.route_mode }}
      route_reason: ${{ steps.route.outputs.route_reason }}
    steps:
      - name: Resolve workflow route
        id: route
        shell: bash
        run: |
          SHOULD_CALL="false"
          ROUTE_MODE="blocked"
          ROUTE_REASON="unknown"

          if [ "${{ inputs.cleanupInfra }}" = "true" ]; then
            SHOULD_CALL="true"
            ROUTE_MODE="cleanup"
            ROUTE_REASON="destructive cleanup path"
          elif [ "${{ inputs.dryRun }}" = "true" ] && [ "${{ needs.verify_release.result }}" = "success" ] && [ "${{ needs.preflight.result }}" = "success" ] && [ "${{ needs.resolve_platform.result }}" = "success" ]; then
            SHOULD_CALL="true"
            ROUTE_MODE="validate"
            ROUTE_REASON="dry-run what-if path using prebuilt immutable release"
          elif [ "${{ inputs.dryRun }}" = "true" ]; then
            ROUTE_REASON="dry-run blocked by candidate, release, or preflight validation"
          elif [ "${{ needs.verify_release.result }}" = "success" ] && [ "${{ needs.preflight.result }}" = "success" ] && [ "${{ needs.resolve_platform.result }}" = "success" ]; then
            SHOULD_CALL="true"
            ROUTE_MODE="deploy"
            ROUTE_REASON="exact-SHA hosted checks, release artifact, and platform preflight completed"
          elif [ "${{ needs.verify_release.result }}" != "success" ]; then
            ROUTE_REASON="blocked by release evidence result: ${{ needs.verify_release.result }}"
          elif [ "${{ needs.preflight.result }}" != "success" ]; then
            ROUTE_REASON="blocked by preflight result: ${{ needs.preflight.result }}"
          elif [ "${{ needs.resolve_platform.result }}" != "success" ]; then
            ROUTE_REASON="blocked by platform foundation result: ${{ needs.resolve_platform.result }}"
          fi

          {
            echo "should_call=${SHOULD_CALL}"
            echo "route_mode=${ROUTE_MODE}"
            echo "route_reason=${ROUTE_REASON}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 🧭 Phase 10 Routed Child Workflow"
            echo ""
            echo "| Field | Value |"
            echo "|------|-------|"
            echo "| should_call | ${SHOULD_CALL} |"
            echo "| route_mode | ${ROUTE_MODE} |"
            echo "| route_reason | ${ROUTE_REASON} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_or_cleanup:
    name: Deploy Azure Phase 10 Resources (Internal)
    needs: [verify_release, resolve_platform, route_child_workflow]
    if: ${{ always() && needs.route_child_workflow.outputs.should_call == 'true' }}
    uses: ./.github/workflows/infra-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      location: ${{ inputs.location }}
      publicDomain: ${{ inputs.publicDomain }}
      bindAliases: ${{ inputs.bindAliases }}
      aliasMode: ${{ inputs.aliasMode }}
      dryRun: ${{ inputs.dryRun }}
      cleanupInfra: ${{ inputs.cleanupInfra }}
      candidateSha: ${{ inputs.candidateSha }}
      deploymentWorkflowSha: ${{ github.sha }}
      releaseRunId: ${{ inputs.releaseRunId }}
      releaseRunAttempt: ${{ needs.verify_release.outputs.releaseRunAttempt }}
      releaseArtifactName: ${{ inputs.releaseArtifactName }}
      functionsPackageSha256: ${{ needs.verify_release.outputs.functionsPackageSha256 }}
      approvedParameterIdentity: ${{ inputs.approvedParameterIdentity }}
      acrName: ${{ needs.resolve_platform.outputs.acrName }}
      acrLoginServer: ${{ needs.resolve_platform.outputs.acrLoginServer }}
      acrPullIdentityId: ${{ needs.resolve_platform.outputs.acrPullIdentityId }}
      gatewayImage: ${{ needs.verify_release.outputs.gatewayImage }}
      ordersImage: ${{ needs.verify_release.outputs.ordersImage }}
      paymentsImage: ${{ needs.verify_release.outputs.paymentsImage }}
      inventoryImage: ${{ needs.verify_release.outputs.inventoryImage }}
      notificationsImage: ${{ needs.verify_release.outputs.notificationsImage }}
      uiImage: ${{ needs.verify_release.outputs.uiImage }}
    secrets: inherit

  gate_diagnostic:
    name: Phase 10 Routed Gate Diagnostic
    runs-on: ubuntu-latest
    needs: [verify_release, preflight, resolve_platform, route_child_workflow, deploy_or_cleanup]
    if: always()
    steps:
      - name: Write gate diagnostic
        shell: bash
        run: |
          echo "## 🔎 Phase 10 Routed Gate Diagnostic" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| dryRun | ${{ inputs.dryRun }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cleanupInfra | ${{ inputs.cleanupInfra }} |" >> $GITHUB_STEP_SUMMARY
          echo "| verify_release | ${{ needs.verify_release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| preflight | ${{ needs.preflight.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| resolve_platform | ${{ needs.resolve_platform.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| route_child_workflow | ${{ needs.route_child_workflow.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| route_mode | ${{ needs.route_child_workflow.outputs.route_mode }} |" >> $GITHUB_STEP_SUMMARY
          echo "| route_reason | ${{ needs.route_child_workflow.outputs.route_reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| deploy_or_cleanup | ${{ needs.deploy_or_cleanup.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| deploy_call_expected | ${{ needs.route_child_workflow.outputs.should_call }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.dryRun }}" = "true" ]; then
            echo "| decision | dry-run path, deploy intentionally skipped |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.cleanupInfra }}" = "true" ]; then
            echo "| decision | cleanup path, deploy intentionally replaced by teardown |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.verify_release.result }}" != "success" ]; then
            echo "| decision | blocked before Azure login by candidate/release evidence |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.preflight.result }}" != "success" ]; then
            echo "| decision | blocked before deployment by preflight |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.resolve_platform.result }}" != "success" ]; then
            echo "| decision | blocked before deployment by platform foundation resolution |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.route_child_workflow.result }}" != "success" ]; then
            echo "| decision | routed child workflow did not authorize child workflow invocation |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy_or_cleanup.result }}" = "success" ]; then
            echo "| decision | deploy or cleanup child workflow completed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| decision | deploy call was expected but child workflow result is skipped; inspect the child job logs and workflow_call wiring |" >> $GITHUB_STEP_SUMMARY
          fi

  summary:
    name: Phase 10 Run Summary
    runs-on: ubuntu-latest
    needs: [verify_release, preflight, resolve_platform, route_child_workflow, deploy_or_cleanup, gate_diagnostic]
    if: always()
    steps:
      - name: Write summary
        shell: bash
        run: |
          echo "## 📊 Phase 10 Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 User Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Location | ${{ inputs.location }} |" >> $GITHUB_STEP_SUMMARY
