name: Deploy Azure Phase 10 Resources (Internal)

on:
  workflow_call:
    outputs:
      gatewayFqdn:
        description: 'Gateway ingress FQDN'
        value: ${{ jobs.deploy.outputs.gatewayFqdn }}
      uiFqdn:
        description: 'UI ingress FQDN'
        value: ${{ jobs.deploy.outputs.uiFqdn }}
      deploymentName:
        description: 'Deployment name'
        value: ${{ jobs.deploy.outputs.deploymentName }}
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      location:
        description: 'Azure region'
        required: true
        type: string
      publicDomain:
        description: 'Optional public DNS zone suffix used to build friendly aliases, e.g. contoso.com'
        required: false
        default: ''
        type: string
      bindAliases:
        description: 'Enable friendly alias summary and binding hints'
        required: false
        default: false
        type: boolean
      aliasMode:
        description: 'Friendly alias mode: direct ACA binding or front-door/DNS summary only'
        required: false
        default: 'direct'
        type: string
      dryRun:
        description: 'Dry run (what-if only)'
        required: true
        type: boolean
      cleanupInfra:
        description: 'Destructive cleanup (tears down the environment-scoped resource group)'
        required: true
        default: false
        type: boolean
      deploySql:
        description: 'Deploy the Phase 10 Azure SQL baseline slice'
        required: false
        default: true
        type: boolean
      deployRedis:
        description: 'Deploy the Phase 10 Azure Redis baseline slice'
        required: false
        default: true
        type: boolean
      acrLoginServer:
        description: 'Optional ACR login server for Phase 10 runtime images'
        required: false
        default: ''
        type: string
      acrName:
        description: 'Optional ACR registry name used for summaries and Azure login'
        required: false
        default: ''
        type: string
      acrPullIdentityId:
        description: 'Optional user-assigned identity resource id used by ACA for ACR pulls'
        required: false
        default: ''
        type: string
      gatewayImage:
        description: 'Gateway image override'
        required: false
        default: ''
        type: string
      ordersImage:
        description: 'Orders image override'
        required: false
        default: ''
        type: string
      paymentsImage:
        description: 'Payments image override'
        required: false
        default: ''
        type: string
      inventoryImage:
        description: 'Inventory image override'
        required: false
        default: ''
        type: string
      notificationsImage:
        description: 'Notifications image override'
        required: false
        default: ''
        type: string
      uiImage:
        description: 'UI image override'
        required: false
        default: ''
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read

jobs:
  debug_context:
    name: Deployment Context Debug
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Record workflow context
        shell: bash
        run: |
          echo "## 🧪 Deploy Workflow Context" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| event_name | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ref | ${{ github.ref }} |" >> $GITHUB_STEP_SUMMARY
          echo "| workflow | ${{ github.workflow }} |" >> $GITHUB_STEP_SUMMARY
          echo "| dryRun | ${{ inputs.dryRun }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cleanupInfra | ${{ inputs.cleanupInfra }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SQL Server + Redis baseline | automatic | Included in the default Phase 10 path |" >> $GITHUB_STEP_SUMMARY
          echo "| environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| location | ${{ inputs.location }} |" >> $GITHUB_STEP_SUMMARY
          echo "| acr_login_server | ${{ inputs.acrLoginServer || '(not provided)' }} |" >> $GITHUB_STEP_SUMMARY

  route:
    name: Routed Deploy Decision
    runs-on: ubuntu-latest
    if: always()
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      reason: ${{ steps.route.outputs.reason }}
      run_prevalidate: ${{ steps.route.outputs.run_prevalidate }}
      run_validate: ${{ steps.route.outputs.run_validate }}
      run_validate_only: ${{ steps.route.outputs.run_validate_only }}
      run_deploy: ${{ steps.route.outputs.run_deploy }}
      run_cleanup: ${{ steps.route.outputs.run_cleanup }}
    steps:
      - name: Resolve route
        id: route
        shell: bash
        run: |
          MODE="blocked"
          REASON="unknown"
          RUN_PREVALIDATE="false"
          RUN_VALIDATE="false"
          RUN_VALIDATE_ONLY="false"
          RUN_DEPLOY="false"
          RUN_CLEANUP="false"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MODE="validate"
            REASON="pull_request preview"
            RUN_VALIDATE="true"
            RUN_VALIDATE_ONLY="true"
          elif [ "${{ inputs.cleanupInfra }}" = "true" ]; then
            MODE="cleanup"
            REASON="cleanupInfra=true"
            RUN_PREVALIDATE="true"
            RUN_CLEANUP="true"
          elif [ "${{ inputs.dryRun }}" = "true" ]; then
            MODE="validate"
            REASON="dryRun=true"
            RUN_VALIDATE="true"
            RUN_VALIDATE_ONLY="true"
          else
            MODE="deploy"
            REASON="workflow_call deploy path"
            RUN_PREVALIDATE="true"
            RUN_DEPLOY="true"
          fi

          {
            echo "mode=${MODE}"
            echo "reason=${REASON}"
            echo "run_prevalidate=${RUN_PREVALIDATE}"
            echo "run_validate=${RUN_VALIDATE}"
            echo "run_validate_only=${RUN_VALIDATE_ONLY}"
            echo "run_deploy=${RUN_DEPLOY}"
            echo "run_cleanup=${RUN_CLEANUP}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 🧭 Routed Deploy Decision"
            echo ""
            echo "| Field | Value |"
            echo "|------|-------|"
            echo "| mode | ${MODE} |"
            echo "| reason | ${REASON} |"
          echo "| run_prevalidate | ${RUN_PREVALIDATE} |"
          echo "| run_validate | ${RUN_VALIDATE} |"
          echo "| run_validate_only | ${RUN_VALIDATE_ONLY} |"
          echo "| run_deploy | ${RUN_DEPLOY} |"
          echo "| run_cleanup | ${RUN_CLEANUP} |"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Bicep What-If (Dry Run)
    needs: route
    if: ${{ needs.route.outputs.run_validate == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_call' && inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guardrail Azure PowerShell switch forwarding
        shell: pwsh
        run: ./scripts/assert-powershell-switch-forwarding-guardrail.ps1
      
      - name: Determine parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo "template=infra/main.phase10.bicep" >> $GITHUB_OUTPUT
            echo "params=infra/parameters/phase10-${{ inputs.environment }}.json" >> $GITHUB_OUTPUT
            echo "phase10=true" >> $GITHUB_OUTPUT
            echo "env=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "deploySql=${{ inputs.deploySql }}" >> $GITHUB_OUTPUT
            echo "deployRedis=${{ inputs.deployRedis }}" >> $GITHUB_OUTPUT
            echo "sqlAdminUsername=sqladmin" >> $GITHUB_OUTPUT
            if [ "${{ inputs.environment }}" = "staging" ]; then ENV_SUFFIX="stg"; else ENV_SUFFIX="${{ inputs.environment }}"; fi
            echo "envSuffix=${ENV_SUFFIX}" >> $GITHUB_OUTPUT
            echo "location=${{ inputs.location }}" >> $GITHUB_OUTPUT
            if [ "${{ inputs.deploySql }}" = "true" ]; then
              SQL_ADMIN_PASSWORD="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)Aa1!"
              echo "::add-mask::${SQL_ADMIN_PASSWORD}"
              echo "sqlAdminPassword=${SQL_ADMIN_PASSWORD}" >> $GITHUB_OUTPUT
            else
              echo "sqlAdminPassword=" >> $GITHUB_OUTPUT
            fi
          else
            CHANGED_FILES="$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})"
            if printf '%s\n' "$CHANGED_FILES" | grep -Eq '^infra/(main\.phase10\.bicep|parameters/phase10-)'; then
              echo "template=infra/main.phase10.bicep" >> $GITHUB_OUTPUT
              echo "params=infra/parameters/phase10-dev.json" >> $GITHUB_OUTPUT
              echo "phase10=true" >> $GITHUB_OUTPUT
            else
              echo "template=infra/main.phase10.bicep" >> $GITHUB_OUTPUT
              echo "params=infra/parameters/phase10-dev.json" >> $GITHUB_OUTPUT
              echo "phase10=true" >> $GITHUB_OUTPUT
            fi
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "envSuffix=dev" >> $GITHUB_OUTPUT
            echo "location=centralindia" >> $GITHUB_OUTPUT
            echo "deploySql=false" >> $GITHUB_OUTPUT
            echo "deployRedis=false" >> $GITHUB_OUTPUT
            echo "sqlAdminUsername=sqladmin" >> $GITHUB_OUTPUT
            echo "sqlAdminPassword=" >> $GITHUB_OUTPUT
          fi
          PLATFORM_SUFFIX="platform"
          ACR_NAME="${{ inputs.acrName }}"
          if [ -z "$ACR_NAME" ]; then
            ACR_NAME="$(printf 'xyops%s' "${{ github.repository_owner }}orderprocessing${PLATFORM_SUFFIX}" | tr '[:upper:]' '[:lower:]' | tr -d '-')"
          fi
          ACR_LOGIN_SERVER="${{ inputs.acrLoginServer }}"
          if [ -z "$ACR_LOGIN_SERVER" ]; then
            ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"
          fi
          ACR_PULL_IDENTITY_ID="${{ inputs.acrPullIdentityId }}"
          if [ -z "$ACR_PULL_IDENTITY_ID" ]; then
            ACR_PULL_IDENTITY_ID="/subscriptions/${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}/resourceGroups/rg-orderprocessing-platform/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-orderprocessing-acr-pull-platform"
          fi
          GATEWAY_IMAGE="${{ inputs.gatewayImage }}"
          if [ -z "$GATEWAY_IMAGE" ]; then
            GATEWAY_IMAGE="${ACR_LOGIN_SERVER}/orderprocessing-gateway:phase10"
          fi
          ORDERS_IMAGE="${{ inputs.ordersImage }}"
          if [ -z "$ORDERS_IMAGE" ]; then
            ORDERS_IMAGE="${ACR_LOGIN_SERVER}/orderprocessing-orders:phase10"
          fi
          PAYMENTS_IMAGE="${{ inputs.paymentsImage }}"
          if [ -z "$PAYMENTS_IMAGE" ]; then
            PAYMENTS_IMAGE="${ACR_LOGIN_SERVER}/orderprocessing-payments:phase10"
          fi
          INVENTORY_IMAGE="${{ inputs.inventoryImage }}"
          if [ -z "$INVENTORY_IMAGE" ]; then
            INVENTORY_IMAGE="${ACR_LOGIN_SERVER}/orderprocessing-inventory:phase10"
          fi
          NOTIFICATIONS_IMAGE="${{ inputs.notificationsImage }}"
          if [ -z "$NOTIFICATIONS_IMAGE" ]; then
            NOTIFICATIONS_IMAGE="${ACR_LOGIN_SERVER}/orderprocessing-notifications:phase10"
          fi
          UI_IMAGE="${{ inputs.uiImage }}"
          if [ -z "$UI_IMAGE" ]; then
            UI_IMAGE="${ACR_LOGIN_SERVER}/orderprocessing-ui:phase10"
          fi
          echo "platformAcrName=${ACR_NAME}" >> $GITHUB_OUTPUT
          echo "acrLoginServer=${ACR_LOGIN_SERVER}" >> $GITHUB_OUTPUT
          echo "acrPullIdentityId=${ACR_PULL_IDENTITY_ID}" >> $GITHUB_OUTPUT
          echo "gatewayImage=${GATEWAY_IMAGE}" >> $GITHUB_OUTPUT
          echo "ordersImage=${ORDERS_IMAGE}" >> $GITHUB_OUTPUT
          echo "paymentsImage=${PAYMENTS_IMAGE}" >> $GITHUB_OUTPUT
          echo "inventoryImage=${INVENTORY_IMAGE}" >> $GITHUB_OUTPUT
          echo "notificationsImage=${NOTIFICATIONS_IMAGE}" >> $GITHUB_OUTPUT
          echo "uiImage=${UI_IMAGE}" >> $GITHUB_OUTPUT
      
      - name: Azure CLI Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Resolve deployment principal
        id: deployment_principal
        shell: bash
        run: |
          CLIENT_ID="${{ secrets.AZUREAPPSERVICE_CLIENTID }}"
          PRINCIPAL_OBJECT_ID="$(az ad sp show --id "$CLIENT_ID" --query id -o tsv 2>/dev/null || true)"

          if [ -z "$PRINCIPAL_OBJECT_ID" ]; then
            echo "## ❌ Could not resolve deployment principal" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The Phase 10 deploy needs the OIDC service principal object id so Bicep can grant Key Vault secret read access for Azure verification." >> "$GITHUB_STEP_SUMMARY"
            echo "Could not resolve Azure service principal object id for the configured OIDC client id." >&2
            exit 1
          fi

          echo "objectId=${PRINCIPAL_OBJECT_ID}" >> "$GITHUB_OUTPUT"
          echo "✅ Deployment principal resolved for Key Vault verification access." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Azure resource providers are registered
        shell: bash
        run: |
          PROVIDERS=(
            Microsoft.App
            Microsoft.AlertsManagement
            Microsoft.Cache
            Microsoft.ContainerRegistry
            Microsoft.Insights
            Microsoft.KeyVault
            Microsoft.ManagedIdentity
            Microsoft.OperationalInsights
            Microsoft.ServiceBus
            Microsoft.Sql
          )

          MISSING=()
          echo "Verifying Azure providers needed by the Phase 10 stack..."
          for PROVIDER in "${PROVIDERS[@]}"; do
            STATE=$(az provider show --namespace "$PROVIDER" --query registrationState -o tsv 2>/dev/null || echo "NotRegistered")
            if [ "$STATE" != "Registered" ]; then
              echo " - $PROVIDER is $STATE"
              MISSING+=("${PROVIDER}:${STATE}")
            else
              echo " - $PROVIDER already registered"
            fi
          done

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "## ❌ Azure resource providers are not ready" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Run **00 Azure Platform Foundation** first. Provider registration is a subscription-level platform concern and is intentionally not performed by the normal app deploy path." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Provider | State |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            for ENTRY in "${MISSING[@]}"; do
              echo "| ${ENTRY%%:*} | ${ENTRY#*:} |" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "Missing Azure provider registrations. Run 00 Azure Platform Foundation before rerunning 01." >&2
            exit 1
          fi

          echo "✅ Azure resource providers are ready." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Registry Pull Configuration
        shell: bash
        run: |
          ACR_NAME="${{ steps.params.outputs.platformAcrName }}"
          ACR_LOGIN_SERVER="${{ steps.params.outputs.acrLoginServer }}"
          ACR_PULL_IDENTITY_ID="${{ steps.params.outputs.acrPullIdentityId }}"

          if [ -z "$ACR_NAME" ] || [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "❌ Phase 10 deployment requires platform ACR inputs." >> $GITHUB_STEP_SUMMARY
            echo "Run the 00 Azure Platform Foundation workflow first, then rerun this workflow with the platform ACR details available." >> $GITHUB_STEP_SUMMARY
            echo "Phase 10 deployment requires platform ACR inputs." >&2
            exit 1
          fi

          ACR_ID=$(az acr show --name "$ACR_NAME" --query id -o tsv 2>/dev/null || true)

          if [ -z "$ACR_ID" ]; then
            echo "❌ Phase 10 platform ACR could not be resolved." >> $GITHUB_STEP_SUMMARY
            echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| ACR Name | ${ACR_NAME} |" >> $GITHUB_STEP_SUMMARY
            echo "| ACR ID | ${ACR_ID:-'(not found)'} |" >> $GITHUB_STEP_SUMMARY
            echo "Phase 10 platform ACR could not be resolved." >&2
            exit 1
          fi

          echo "✅ ACR runtime image path selected: ${ACR_LOGIN_SERVER}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Phase 10 deploy will use ACR scoped-token authentication unless a managed-identity pull grant is configured separately." >> $GITHUB_STEP_SUMMARY

      - name: What-If (subscription scope)
        run: |
          ENV_SUFFIX=${{ steps.params.outputs.envSuffix }}
          LOCATION=${{ steps.params.outputs.location }}
          TEMPLATE_FILE="${{ steps.params.outputs.template }}"
          PARAM_FILE="${{ steps.params.outputs.params }}"
          az deployment sub what-if \
            --location "$LOCATION" \
            --template-file "$TEMPLATE_FILE" \
            --parameters @"${PARAM_FILE}" \
            --validation-level ProviderNoRbac \
            --parameters deploySql="${{ steps.params.outputs.deploySql }}" \
            --parameters deployRedis="${{ steps.params.outputs.deployRedis }}" \
            --parameters sqlAdminUsername="${{ steps.params.outputs.sqlAdminUsername }}" \
            --parameters sqlAdminPassword="${{ steps.params.outputs.sqlAdminPassword }}" \
            --parameters platformAcrName="${{ steps.params.outputs.platformAcrName }}" \
            --parameters platformAcrLoginServer="${{ steps.params.outputs.acrLoginServer }}" \
            --parameters platformAcrPullIdentityId="${{ steps.params.outputs.acrPullIdentityId }}" \
            --parameters gatewayImage="${{ steps.params.outputs.gatewayImage }}" \
            --parameters ordersImage="${{ steps.params.outputs.ordersImage }}" \
            --parameters paymentsImage="${{ steps.params.outputs.paymentsImage }}" \
            --parameters inventoryImage="${{ steps.params.outputs.inventoryImage }}" \
            --parameters notificationsImage="${{ steps.params.outputs.notificationsImage }}" \
            --parameters uiImage="${{ steps.params.outputs.uiImage }}"

  pre-validate:
    name: Pre-Deployment Validation
    needs: route
    if: ${{ needs.route.outputs.run_prevalidate == 'true' }}
    uses: ./.github/workflows/validate-deployment.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      run-whatif: false
      verify-oidc: false
      check-config: false  # SharedSettings validation is a config-quality check, not an infra preview gate.
      template-file: infra/main.phase10.bicep
      parameter-file: infra/parameters/phase10-${{ inputs.environment }}.json
      location: ${{ inputs.location }}

  deploy:
    name: Deploy Azure Phase 10 Resources (Internal)
    needs: [route, pre-validate]
    if: ${{ always() && needs.route.outputs.run_deploy == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    outputs:
      gatewayFqdn: ${{ steps.outputs.outputs.gatewayFqdn }}
      uiFqdn: ${{ steps.outputs.outputs.uiFqdn }}
      sqlServerFqdn: ${{ steps.outputs.outputs.sqlServerFqdn }}
      sqlDatabaseName: ${{ steps.outputs.outputs.sqlDatabaseName }}
      tenantCDatabaseName: ${{ steps.outputs.outputs.tenantCDatabaseName }}
      dedicatedDatabaseNames: ${{ steps.outputs.outputs.dedicatedDatabaseNames }}
      redisHostName: ${{ steps.outputs.outputs.redisHost }}
      redisSslPort: ${{ steps.outputs.outputs.redisSslPort }}
      deploymentName: ${{ steps.params.outputs.deploymentName }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guardrail Azure PowerShell switch forwarding
        shell: pwsh
        run: ./scripts/assert-powershell-switch-forwarding-guardrail.ps1

      - name: Confirm routed validation finished
        if: ${{ needs['pre-validate'].result != 'success' }}
        shell: bash
        run: |
          echo "## ❌ Routed deploy blocked" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| route mode | ${{ needs.route.outputs.mode }} |" >> $GITHUB_STEP_SUMMARY
          echo "| route reason | ${{ needs.route.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pre-validate result | ${{ needs['pre-validate'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| decision | deploy was requested, but the validation gate did not complete successfully |" >> $GITHUB_STEP_SUMMARY
          echo "Validation must complete successfully before the routed deploy continues." >&2
          exit 1
      
      - name: Determine parameters
        id: params
        run: |
          echo "env=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          if [ "${{ inputs.environment }}" = "staging" ]; then ENV_SUFFIX="stg"; else ENV_SUFFIX="${{ inputs.environment }}"; fi
          echo "envSuffix=${ENV_SUFFIX}" >> $GITHUB_OUTPUT
          echo "location=${{ inputs.location }}" >> $GITHUB_OUTPUT
          echo "deploymentName=infra-${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_OUTPUT
          echo "template=infra/main.phase10.bicep" >> $GITHUB_OUTPUT
          echo "file=infra/parameters/phase10-${{ inputs.environment }}.json" >> $GITHUB_OUTPUT
          echo "phase10=true" >> $GITHUB_OUTPUT
          echo "deploySql=true" >> $GITHUB_OUTPUT
          echo "deployRedis=true" >> $GITHUB_OUTPUT
          echo "sqlAdminUsername=sqladmin" >> $GITHUB_OUTPUT
          SQL_ADMIN_PASSWORD="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)Aa1!"
          echo "::add-mask::${SQL_ADMIN_PASSWORD}"
          echo "sqlAdminPassword=${SQL_ADMIN_PASSWORD}" >> $GITHUB_OUTPUT
          PLATFORM_SUFFIX="platform"
          ACR_NAME="${{ inputs.acrName }}"
          if [ -z "$ACR_NAME" ]; then
            ACR_NAME="$(printf 'xyops%s' "${{ github.repository_owner }}orderprocessing${PLATFORM_SUFFIX}" | tr '[:upper:]' '[:lower:]' | tr -d '-')"
          fi
          ACR_LOGIN_SERVER="${{ inputs.acrLoginServer }}"
          if [ -z "$ACR_LOGIN_SERVER" ]; then
            ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"
          fi
          ACR_PULL_IDENTITY_ID="${{ inputs.acrPullIdentityId }}"
          if [ -z "$ACR_PULL_IDENTITY_ID" ]; then
            ACR_PULL_IDENTITY_ID="/subscriptions/${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}/resourceGroups/rg-orderprocessing-platform/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-orderprocessing-acr-pull-platform"
          fi
          GATEWAY_IMAGE="${{ inputs.gatewayImage }}"
          if [ -z "$GATEWAY_IMAGE" ]; then
            GATEWAY_IMAGE="${ACR_LOGIN_SERVER}/orderprocessing-gateway:phase10"
          fi
          ORDERS_IMAGE="${{ inputs.ordersImage }}"
          if [ -z "$ORDERS_IMAGE" ]; then
            ORDERS_IMAGE="${ACR_LOGIN_SERVER}/orderprocessing-orders:phase10"
          fi
          PAYMENTS_IMAGE="${{ inputs.paymentsImage }}"
          if [ -z "$PAYMENTS_IMAGE" ]; then
            PAYMENTS_IMAGE="${ACR_LOGIN_SERVER}/orderprocessing-payments:phase10"
          fi
          INVENTORY_IMAGE="${{ inputs.inventoryImage }}"
          if [ -z "$INVENTORY_IMAGE" ]; then
            INVENTORY_IMAGE="${ACR_LOGIN_SERVER}/orderprocessing-inventory:phase10"
          fi
          NOTIFICATIONS_IMAGE="${{ inputs.notificationsImage }}"
          if [ -z "$NOTIFICATIONS_IMAGE" ]; then
            NOTIFICATIONS_IMAGE="${ACR_LOGIN_SERVER}/orderprocessing-notifications:phase10"
          fi
          UI_IMAGE="${{ inputs.uiImage }}"
          if [ -z "$UI_IMAGE" ]; then
            UI_IMAGE="${ACR_LOGIN_SERVER}/orderprocessing-ui:phase10"
          fi
          echo "platformAcrName=${ACR_NAME}" >> $GITHUB_OUTPUT
          echo "acrLoginServer=${ACR_LOGIN_SERVER}" >> $GITHUB_OUTPUT
          echo "acrPullIdentityId=${ACR_PULL_IDENTITY_ID}" >> $GITHUB_OUTPUT
          echo "gatewayImage=${GATEWAY_IMAGE}" >> $GITHUB_OUTPUT
          echo "ordersImage=${ORDERS_IMAGE}" >> $GITHUB_OUTPUT
          echo "paymentsImage=${PAYMENTS_IMAGE}" >> $GITHUB_OUTPUT
          echo "inventoryImage=${INVENTORY_IMAGE}" >> $GITHUB_OUTPUT
          echo "notificationsImage=${NOTIFICATIONS_IMAGE}" >> $GITHUB_OUTPUT
          echo "uiImage=${UI_IMAGE}" >> $GITHUB_OUTPUT
      
      - name: Azure CLI Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Resolve deployment principal
        id: deployment_principal
        shell: bash
        run: |
          CLIENT_ID="${{ secrets.AZUREAPPSERVICE_CLIENTID }}"
          PRINCIPAL_OBJECT_ID="$(az ad sp show --id "$CLIENT_ID" --query id -o tsv 2>/dev/null || true)"

          if [ -z "$PRINCIPAL_OBJECT_ID" ]; then
            echo "## ❌ Could not resolve deployment principal" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The Phase 10 deploy needs the OIDC service principal object id so Bicep can grant Key Vault secret read access for Azure verification." >> "$GITHUB_STEP_SUMMARY"
            echo "Could not resolve Azure service principal object id for the configured OIDC client id." >&2
            exit 1
          fi

          echo "objectId=${PRINCIPAL_OBJECT_ID}" >> "$GITHUB_OUTPUT"
          echo "✅ Deployment principal resolved for Key Vault verification access." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Azure resource providers are registered
        shell: bash
        run: |
          PROVIDERS=(
            Microsoft.App
            Microsoft.AlertsManagement
            Microsoft.Cache
            Microsoft.ContainerRegistry
            Microsoft.Insights
            Microsoft.KeyVault
            Microsoft.ManagedIdentity
            Microsoft.OperationalInsights
            Microsoft.ServiceBus
            Microsoft.Sql
          )

          MISSING=()
          echo "Verifying Azure providers needed by the Phase 10 stack..."
          for PROVIDER in "${PROVIDERS[@]}"; do
            STATE=$(az provider show --namespace "$PROVIDER" --query registrationState -o tsv 2>/dev/null || echo "NotRegistered")
            if [ "$STATE" != "Registered" ]; then
              echo " - $PROVIDER is $STATE"
              MISSING+=("${PROVIDER}:${STATE}")
            else
              echo " - $PROVIDER already registered"
            fi
          done

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "## ❌ Azure resource providers are not ready" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Run **00 Azure Platform Foundation** first. Provider registration is a subscription-level platform concern and is intentionally not performed by the normal app deploy path." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Provider | State |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            for ENTRY in "${MISSING[@]}"; do
              echo "| ${ENTRY%%:*} | ${ENTRY#*:} |" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "Missing Azure provider registrations. Run 00 Azure Platform Foundation before rerunning 01." >&2
            exit 1
          fi

          echo "✅ Azure resource providers are ready." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Registry Pull Configuration
        shell: bash
        run: |
          ACR_NAME="${{ steps.params.outputs.platformAcrName }}"
          ACR_LOGIN_SERVER="${{ steps.params.outputs.acrLoginServer }}"
          ACR_PULL_IDENTITY_ID="${{ steps.params.outputs.acrPullIdentityId }}"

          if [ -z "$ACR_NAME" ] || [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "❌ Phase 10 deployment requires platform ACR inputs." >> $GITHUB_STEP_SUMMARY
            echo "Run the 00 Azure Platform Foundation workflow first, then rerun this workflow with the platform ACR details available." >> $GITHUB_STEP_SUMMARY
            echo "Phase 10 deployment requires platform ACR inputs." >&2
            exit 1
          fi

          ACR_ID=$(az acr show --name "$ACR_NAME" --query id -o tsv 2>/dev/null || true)

          if [ -z "$ACR_ID" ]; then
            echo "❌ Phase 10 platform ACR could not be resolved." >> $GITHUB_STEP_SUMMARY
            echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| ACR Name | ${ACR_NAME} |" >> $GITHUB_STEP_SUMMARY
            echo "| ACR ID | ${ACR_ID:-'(not found)'} |" >> $GITHUB_STEP_SUMMARY
            echo "Phase 10 platform ACR could not be resolved." >&2
            exit 1
          fi

          echo "✅ ACR runtime image path selected: ${ACR_LOGIN_SERVER}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Phase 10 deploy will use ACR scoped-token authentication unless a managed-identity pull grant is configured separately." >> $GITHUB_STEP_SUMMARY

      - name: Prepare ACR Pull Token
        id: acr_pull_token
        shell: bash
        run: |
          ACR_NAME="${{ steps.params.outputs.platformAcrName }}"
          SCOPE_MAP_NAME="sm-orderprocessing-aca-pull-${{ steps.params.outputs.envSuffix }}"
          TOKEN_NAME="tok-orderprocessing-aca-pull-${{ steps.params.outputs.envSuffix }}"
          TOKEN_EXPIRATION="$(date -u -d '+365 days' '+%Y-%m-%dT%H:%M:%SZ')"

          if az acr scope-map show --registry "$ACR_NAME" --name "$SCOPE_MAP_NAME" --only-show-errors 1>/dev/null 2>&1; then
            az acr scope-map update \
              --registry "$ACR_NAME" \
              --name "$SCOPE_MAP_NAME" \
              --add-repository orderprocessing-gateway content/read \
              --add-repository orderprocessing-orders content/read \
              --add-repository orderprocessing-payments content/read \
              --add-repository orderprocessing-inventory content/read \
              --add-repository orderprocessing-notifications content/read \
              --add-repository orderprocessing-ui content/read \
              --only-show-errors 1>/dev/null
          else
            az acr scope-map create \
              --registry "$ACR_NAME" \
              --name "$SCOPE_MAP_NAME" \
              --repository orderprocessing-gateway content/read \
              --repository orderprocessing-orders content/read \
              --repository orderprocessing-payments content/read \
              --repository orderprocessing-inventory content/read \
              --repository orderprocessing-notifications content/read \
              --repository orderprocessing-ui content/read \
              --only-show-errors 1>/dev/null
          fi

          if az acr token show --registry "$ACR_NAME" --name "$TOKEN_NAME" --only-show-errors 1>/dev/null 2>&1; then
            az acr token update \
              --registry "$ACR_NAME" \
              --name "$TOKEN_NAME" \
              --scope-map "$SCOPE_MAP_NAME" \
              --status enabled \
              --only-show-errors 1>/dev/null
          else
            az acr token create \
              --registry "$ACR_NAME" \
              --name "$TOKEN_NAME" \
              --scope-map "$SCOPE_MAP_NAME" \
              --status enabled \
              --only-show-errors 1>/dev/null
          fi

          TOKEN_PASSWORD=$(az acr token credential generate \
            --registry "$ACR_NAME" \
            --name "$TOKEN_NAME" \
            --expiration "$TOKEN_EXPIRATION" \
            --password1 \
            --query 'passwords[0].value' \
            -o tsv)

          echo "::add-mask::${TOKEN_PASSWORD}"
          echo "username=${TOKEN_NAME}" >> "$GITHUB_OUTPUT"
          echo "password=${TOKEN_PASSWORD}" >> "$GITHUB_OUTPUT"

          echo "✅ ACR scoped pull token prepared for Container Apps runtime image pulls." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve Deleted Key Vault Reservation
        shell: bash
        run: |
          KV_NAME="kv-orderprocessing-${{ steps.params.outputs.envSuffix }}"
          LOCATION="${{ steps.params.outputs.location }}"
          echo "Checking deleted Key Vault state for ${KV_NAME}..."

          if az keyvault list-deleted --query "[?name=='${KV_NAME}'] | length(@)" -o tsv | grep -q '^1$'; then
            echo "A deleted Key Vault named '${KV_NAME}' is still reserved by Azure soft-delete."
            echo "Attempting to purge '${KV_NAME}' in '${LOCATION}' before deployment..."

            if ! PURGE_OUTPUT=$(az keyvault purge --name "${KV_NAME}" --location "${LOCATION}" --only-show-errors 2>&1); then
              echo "## ❌ Deleted Key Vault reservation could not be purged" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
              echo "|---|---|" >> $GITHUB_STEP_SUMMARY
              echo "| Key Vault | ${KV_NAME} |" >> $GITHUB_STEP_SUMMARY
              echo "| Location | ${LOCATION} |" >> $GITHUB_STEP_SUMMARY
              echo "| Reason | Azure denied or failed the purge operation |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              echo "${PURGE_OUTPUT}" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "Deleted Key Vault reservation could not be purged for '${KV_NAME}'." >&2
              exit 1
            fi

            for attempt in {1..30}; do
              if ! az keyvault list-deleted --query "[?name=='${KV_NAME}'] | length(@)" -o tsv | grep -q '^1$'; then
                echo "✅ Purged deleted Key Vault reservation for '${KV_NAME}'." >> $GITHUB_STEP_SUMMARY
                exit 0
              fi

              echo "Waiting for Key Vault purge propagation (${attempt}/30)..."
              sleep 10
            done

            echo "## ❌ Deleted Key Vault reservation still visible after purge" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Azure accepted the purge request, but '${KV_NAME}' is still visible in deleted vaults after waiting." >> $GITHUB_STEP_SUMMARY
            echo "Wait a few minutes for Azure propagation, then rerun the workflow." >> $GITHUB_STEP_SUMMARY
            echo "Deleted Key Vault reservation still visible after purge for '${KV_NAME}'." >&2
            exit 1
          fi

          echo "✅ No deleted Key Vault conflict detected for '${KV_NAME}'." >> $GITHUB_STEP_SUMMARY

      - name: Enable Key Vault for template deployment
        run: |
          # Phase 10 creates its own Key Vault in the same deployment.
          # If the vault already exists, keep template deployment enabled for follow-up runs.
          KV_NAME="kv-orderprocessing-${{ steps.params.outputs.envSuffix }}"
          KV_ID=$(az keyvault show --name "$KV_NAME" --query id -o tsv 2>/dev/null || true)
          if [ -z "$KV_ID" ]; then
            echo "Key Vault '$KV_NAME' does not exist yet. Continuing so the Phase 10 deployment can create it."
          else
            echo "Enabling enabledForTemplateDeployment on $KV_NAME..."
            az keyvault update --name "$KV_NAME" --enabled-for-template-deployment true
            echo "Done."
          fi

      - name: Deploy (subscription scope)
        id: deploy
        run: |
          az deployment sub create \
            --name ${{ steps.params.outputs.deploymentName }} \
            --location ${{ steps.params.outputs.location }} \
            --template-file ${{ steps.params.outputs.template }} \
            --parameters @${{ steps.params.outputs.file }} \
            --parameters deploySql="${{ steps.params.outputs.deploySql }}" \
            --parameters deployRedis="${{ steps.params.outputs.deployRedis }}" \
            --parameters sqlAdminUsername="${{ steps.params.outputs.sqlAdminUsername }}" \
            --parameters sqlAdminPassword="${{ steps.params.outputs.sqlAdminPassword }}" \
            --parameters platformAcrName="${{ steps.params.outputs.platformAcrName }}" \
            --parameters platformAcrLoginServer="${{ steps.params.outputs.acrLoginServer }}" \
            --parameters platformAcrPullIdentityId="${{ steps.params.outputs.acrPullIdentityId }}" \
            --parameters deploymentPrincipalObjectId="${{ steps.deployment_principal.outputs.objectId }}" \
            --parameters acrRegistryUsername="${{ steps.acr_pull_token.outputs.username }}" \
            --parameters acrRegistryPassword="${{ steps.acr_pull_token.outputs.password }}" \
            --parameters gatewayImage="${{ steps.params.outputs.gatewayImage }}" \
            --parameters ordersImage="${{ steps.params.outputs.ordersImage }}" \
            --parameters paymentsImage="${{ steps.params.outputs.paymentsImage }}" \
            --parameters inventoryImage="${{ steps.params.outputs.inventoryImage }}" \
            --parameters notificationsImage="${{ steps.params.outputs.notificationsImage }}" \
            --parameters uiImage="${{ steps.params.outputs.uiImage }}"

      - name: Print Deployment Failure Details
        if: ${{ failure() && steps.deploy.outcome == 'failure' }}
        shell: bash
        run: |
          DEPLOYMENT_NAME="${{ steps.params.outputs.deploymentName }}"
          ENV_SUFFIX="${{ steps.params.outputs.envSuffix }}"
          RG_NAME="rg-orderprocessing-${ENV_SUFFIX}"
          NESTED_DEPLOYMENT_NAME="containerapps-${ENV_SUFFIX}"

          echo "## ❌ Phase 10 Azure deployment failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Subscription deployment | ${DEPLOYMENT_NAME} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resource group | ${RG_NAME} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Nested deployment | ${NESTED_DEPLOYMENT_NAME} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Subscription-scope deployment operations:"
          az deployment operation sub list \
            --name "$DEPLOYMENT_NAME" \
            --query "[].{provisioningState:properties.provisioningState,resource:properties.targetResource.resourceName,type:properties.targetResource.resourceType,statusCode:properties.statusCode,message:properties.statusMessage.error.message}" \
            -o table || true

          echo "Container Apps nested deployment operations:"
          az deployment operation group list \
            --resource-group "$RG_NAME" \
            --name "$NESTED_DEPLOYMENT_NAME" \
            --query "[].{provisioningState:properties.provisioningState,resource:properties.targetResource.resourceName,type:properties.targetResource.resourceType,statusCode:properties.statusCode,message:properties.statusMessage.error.message}" \
            -o table || true
      
      - name: Get Deployment Outputs
        id: outputs
        run: |
          DEPLOYMENT_NAME="${{ steps.params.outputs.deploymentName }}"
          echo "Fetching outputs for deployment: ${DEPLOYMENT_NAME}"

          RG_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.resourceGroupName.value" -o tsv)
          SB_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.serviceBusNamespaceName.value" -o tsv)
          LA_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.logAnalyticsWorkspaceName.value" -o tsv)
          ME_ID=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.managedEnvironmentId.value" -o tsv)
          GW_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.gatewayContainerAppName.value" -o tsv)
          ORDERS_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.ordersContainerAppName.value" -o tsv)
          PAYMENTS_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.paymentsContainerAppName.value" -o tsv)
          INVENTORY_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.inventoryContainerAppName.value" -o tsv)
          NOTIFICATIONS_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.notificationsContainerAppName.value" -o tsv)
          UI_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.uiContainerAppName.value" -o tsv)
          GATEWAY_FQDN=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.gatewayContainerAppFqdn.value" -o tsv)
          UI_FQDN=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.uiContainerAppFqdn.value" -o tsv)
          FUNC_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.functionAppName.value" -o tsv)
          KV_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.keyVaultName.value" -o tsv)
          AI_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.appInsightsName.value" -o tsv)
          ACR_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.acrName.value" -o tsv)
          ACR_LOGIN_SERVER=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.acrLoginServer.value" -o tsv)
          SQL_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.sqlServerName.value" -o tsv)
          SQL_FQDN=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.sqlServerFqdn.value" -o tsv)
          SQL_DB_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.sqlDatabaseName.value" -o tsv)
          TENANT_C_DB_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.tenantCDatabaseName.value" -o tsv)
          REDIS_NAME=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.redisName.value" -o tsv)
          REDIS_HOST=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.redisHostName.value" -o tsv)
          REDIS_SSL_PORT=$(az deployment sub show --name ${DEPLOYMENT_NAME} --query "properties.outputs.redisSslPort.value" -o tsv)

          echo "rg=${RG_NAME}" >> $GITHUB_OUTPUT
          echo "sb=${SB_NAME}" >> $GITHUB_OUTPUT
          echo "la=${LA_NAME}" >> $GITHUB_OUTPUT
          echo "me=${ME_ID}" >> $GITHUB_OUTPUT
          echo "gateway=${GW_NAME}" >> $GITHUB_OUTPUT
          echo "orders=${ORDERS_NAME}" >> $GITHUB_OUTPUT
          echo "payments=${PAYMENTS_NAME}" >> $GITHUB_OUTPUT
          echo "inventory=${INVENTORY_NAME}" >> $GITHUB_OUTPUT
          echo "notifications=${NOTIFICATIONS_NAME}" >> $GITHUB_OUTPUT
          echo "ui=${UI_NAME}" >> $GITHUB_OUTPUT
          echo "gatewayFqdn=${GATEWAY_FQDN}" >> $GITHUB_OUTPUT
          echo "uiFqdn=${UI_FQDN}" >> $GITHUB_OUTPUT
          echo "function=${FUNC_NAME}" >> $GITHUB_OUTPUT
          echo "keyvault=${KV_NAME}" >> $GITHUB_OUTPUT
          echo "insights=${AI_NAME}" >> $GITHUB_OUTPUT
          echo "acr=${ACR_NAME}" >> $GITHUB_OUTPUT
          echo "acrLoginServer=${ACR_LOGIN_SERVER}" >> $GITHUB_OUTPUT
          echo "sqlServer=${SQL_NAME}" >> $GITHUB_OUTPUT
          echo "sqlServerFqdn=${SQL_FQDN}" >> $GITHUB_OUTPUT
          echo "sqlDatabase=${SQL_DB_NAME}" >> $GITHUB_OUTPUT
          echo "sqlDatabaseName=${SQL_DB_NAME}" >> $GITHUB_OUTPUT
          echo "tenantCDatabaseName=${TENANT_C_DB_NAME}" >> $GITHUB_OUTPUT
          echo "dedicatedDatabaseNames=${TENANT_C_DB_NAME}" >> $GITHUB_OUTPUT
          echo "redis=${REDIS_NAME}" >> $GITHUB_OUTPUT
          echo "redisHost=${REDIS_HOST}" >> $GITHUB_OUTPUT
          echo "redisSslPort=${REDIS_SSL_PORT}" >> $GITHUB_OUTPUT

      - name: Run Azure SQL Migrations
        if: ${{ steps.params.outputs.deploySql == 'true' }}
        shell: pwsh
        run: |
          Write-Host "Running Phase 10 Azure SQL migrations for ${{ steps.params.outputs.env }}..."

          ./Resources/Azure-Deployment/run-database-migrations.ps1 `
            -Environment "${{ steps.params.outputs.env }}" `
            -BaseName "orderprocessing" `
            -AdminUsername "${{ steps.params.outputs.sqlAdminUsername }}" `
            -AdminPassword "${{ steps.params.outputs.sqlAdminPassword }}" `
            -Owner "${{ github.repository_owner }}"

          if ($LASTEXITCODE -ne 0) {
              throw "Phase 10 Azure SQL migrations failed with exit code $LASTEXITCODE."
          }

          "✅ Phase 10 Azure SQL migrations completed." | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Grant Phase 10 Runtime SQL Managed Identity Access
        if: ${{ steps.params.outputs.deploySql == 'true' }}
        shell: pwsh
        run: |
          Write-Host "Granting Azure SQL access to Phase 10 runtime identities for ${{ steps.params.outputs.env }}..."

          ./Resources/Azure-Deployment/setup-phase10-sql-managed-identities.ps1 `
            -Environment "${{ steps.params.outputs.env }}" `
            -BaseName "orderprocessing" `
            -UseSqlAuthentication `
            -SqlAdminUsername "${{ steps.params.outputs.sqlAdminUsername }}" `
            -SqlAdminPassword "${{ steps.params.outputs.sqlAdminPassword }}"

          if ($LASTEXITCODE -ne 0) {
              throw "Phase 10 runtime SQL identity setup failed with exit code $LASTEXITCODE."
          }

          "✅ Phase 10 runtime SQL identities granted access to the shared registry database and every active dedicated tenant database resolved from tenant topology." | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Refresh Runtime Hosts After SQL Setup
        if: ${{ steps.params.outputs.deploySql == 'true' }}
        shell: bash
        run: |
          RG_NAME="${{ steps.outputs.outputs.rg }}"
          REVISION_MARKER="${{ github.run_id }}-${{ github.run_attempt }}"
          BACKEND_APPS=(
            "${{ steps.outputs.outputs.gateway }}"
            "${{ steps.outputs.outputs.orders }}"
            "${{ steps.outputs.outputs.payments }}"
            "${{ steps.outputs.outputs.inventory }}"
            "${{ steps.outputs.outputs.notifications }}"
          )

          echo "Refreshing backend Container Apps after SQL migrations..."
          for APP_NAME in "${BACKEND_APPS[@]}"; do
            if [ -z "$APP_NAME" ]; then
              continue
            fi

            echo "Refreshing ${APP_NAME}..."
            az containerapp update \
              --resource-group "$RG_NAME" \
              --name "$APP_NAME" \
              --set-env-vars "Phase10__SchemaMigrationRun=${REVISION_MARKER}" "Phase10__SqlIdentityGrantRun=${REVISION_MARKER}" \
              --only-show-errors 1>/dev/null
          done

          FUNCTION_APP="${{ steps.outputs.outputs.function }}"
          if [ -n "$FUNCTION_APP" ]; then
            echo "Restarting Function App ${FUNCTION_APP}..."
            az functionapp restart \
              --resource-group "$RG_NAME" \
              --name "$FUNCTION_APP" \
              --only-show-errors 1>/dev/null
          fi

          echo "✅ Phase 10 runtime hosts refreshed after SQL migrations and identity grants." >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve Friendly Aliases
        id: aliases
        shell: bash
        run: |
          DOMAIN_SUFFIX="${{ inputs.publicDomain }}"
          if [ -z "$DOMAIN_SUFFIX" ]; then
            DOMAIN_SUFFIX="yourdomain.com"
          fi

          case "${{ steps.params.outputs.env }}" in
            dev)
              API_ALIAS="api-dev.${DOMAIN_SUFFIX}"
              UI_ALIAS="ui-dev.${DOMAIN_SUFFIX}"
              ;;
            staging)
              API_ALIAS="api-staging.${DOMAIN_SUFFIX}"
              UI_ALIAS="ui-staging.${DOMAIN_SUFFIX}"
              ;;
            prod)
              API_ALIAS="api.${DOMAIN_SUFFIX}"
              UI_ALIAS="ui.${DOMAIN_SUFFIX}"
              ;;
            *)
              echo "Unsupported environment: ${{ steps.params.outputs.env }}"
              exit 1
              ;;
          esac

          echo "apiAlias=${API_ALIAS}" >> $GITHUB_OUTPUT
          echo "uiAlias=${UI_ALIAS}" >> $GITHUB_OUTPUT

          echo "Friendly alias mapping:" >> $GITHUB_STEP_SUMMARY
          echo "- API: ${API_ALIAS}" >> $GITHUB_STEP_SUMMARY
          echo "- UI: ${UI_ALIAS}" >> $GITHUB_STEP_SUMMARY

      - name: Alias Guidance and Binding
        shell: bash
        run: |
          RG_NAME="${{ steps.outputs.outputs.rg }}"
          GW_APP="${{ steps.outputs.outputs.gateway }}"
          UI_APP="${{ steps.outputs.outputs.ui }}"
          API_ALIAS="${{ steps.aliases.outputs.apiAlias }}"
          UI_ALIAS="${{ steps.aliases.outputs.uiAlias }}"

          echo "Alias mode: ${{ inputs.aliasMode }}" >> $GITHUB_STEP_SUMMARY
          echo "Bind aliases requested: ${{ inputs.bindAliases }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ inputs.bindAliases }}" = "true" ] && [ "${{ inputs.aliasMode }}" = "direct" ]; then
            echo "Binding ${API_ALIAS} to ${GW_APP} in ${RG_NAME}..."
            az containerapp hostname bind \
              --resource-group "${RG_NAME}" \
              --name "${GW_APP}" \
              --hostname "${API_ALIAS}" \
              --validation-method CNAME

            echo "Binding ${UI_ALIAS} to ${UI_APP} in ${RG_NAME}..."
            az containerapp hostname bind \
              --resource-group "${RG_NAME}" \
              --name "${UI_APP}" \
              --hostname "${UI_ALIAS}" \
              --validation-method CNAME

            echo "Friendly alias bindings completed." >> $GITHUB_STEP_SUMMARY
            echo "- API Alias bound to Gateway Container App" >> $GITHUB_STEP_SUMMARY
            echo "- UI Alias bound to UI Container App" >> $GITHUB_STEP_SUMMARY
          else
            echo "Friendly alias summary:" >> $GITHUB_STEP_SUMMARY
            echo "- API origin: https://${{ steps.outputs.outputs.gatewayFqdn }}" >> $GITHUB_STEP_SUMMARY
            echo "- UI origin: https://${{ steps.outputs.outputs.uiFqdn }}" >> $GITHUB_STEP_SUMMARY
            echo "- API public name: https://${API_ALIAS}" >> $GITHUB_STEP_SUMMARY
            echo "- UI public name: https://${UI_ALIAS}" >> $GITHUB_STEP_SUMMARY
            if [ "${{ inputs.bindAliases }}" = "true" ] && [ "${{ inputs.aliasMode }}" = "frontdoor" ]; then
              echo "Use these aliases as the public names for Front Door or DNS CNAMEs." >> $GITHUB_STEP_SUMMARY
            else
              echo "Alias binding is disabled for this run, so only the mapping summary is recorded." >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Verify Runtime Hosts From Azure Control Plane
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:RUNNER_TEMP 'phase10-azure-runtime-hosts-deploy.md'

          & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-phase10-azure-runtime-hosts.ps1 `
            -Environment '${{ steps.params.outputs.env }}' `
            -ResourceGroupName '${{ steps.outputs.outputs.rg }}' `
            -SummaryPath $summaryPath

          $verifyExitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $summaryPath) {
            Get-Content -LiteralPath $summaryPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

          if ($verifyExitCode -ne 0) {
            throw "Phase 10 Azure runtime host verification failed with exit code $verifyExitCode."
          }

      - name: Verify Active Tenant Topology Contract
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:RUNNER_TEMP 'phase10-azure-tenant-topology-deploy.md'

          & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-phase10-azure-tenant-topology.ps1 `
            -Environment '${{ steps.params.outputs.env }}' `
            -ResourceGroupName '${{ steps.outputs.outputs.rg }}' `
            -SummaryPath $summaryPath

          $verifyExitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $summaryPath) {
            Get-Content -LiteralPath $summaryPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

          if ($verifyExitCode -ne 0) {
            throw "Phase 10 Azure tenant topology verification failed with exit code $verifyExitCode."
          }

      - name: Post-Deployment Endpoint Smoke
        shell: bash
        run: |
          GATEWAY_HEALTH="https://${{ steps.outputs.outputs.gatewayFqdn }}/"
          ORDERS_SMOKE="https://${{ steps.outputs.outputs.gatewayFqdn }}/api/v1/Info/runtime-configuration"
          UI_URL="https://${{ steps.outputs.outputs.uiFqdn }}/customers"

          smoke_url() {
            local name="$1"
            local url="$2"
            local expected="$3"
            local attempt
            local response
            local body
            local status

            echo "Checking ${name}: ${url}"
            for attempt in {1..18}; do
              response="$(curl --show-error --silent --location --max-time 30 --write-out '\n%{http_code}' "$url" || true)"
              status="$(printf '%s' "$response" | tail -n 1)"
              body="$(printf '%s' "$response" | sed '$d')"
              if [ -n "$body" ]; then
                if [[ "$status" =~ ^[0-9]{3}$ ]] && [ "$status" -ge 200 ] && [ "$status" -lt 400 ] && { [ -z "$expected" ] || printf '%s' "$body" | grep -Fq "$expected"; }; then
                  echo "✅ ${name} responded on attempt ${attempt}" >> $GITHUB_STEP_SUMMARY
                  echo "- ${name} status: ${status}" >> $GITHUB_STEP_SUMMARY
                  return 0
                fi
              fi

              echo "Attempt ${attempt}/18 did not pass for ${name}; status=${status:-none}; waiting 10 seconds..."
              sleep 10
            done

            echo "❌ ${name} did not pass endpoint smoke after 18 attempts." >> $GITHUB_STEP_SUMMARY
            echo "URL: ${url}" >> $GITHUB_STEP_SUMMARY
            echo "Last HTTP status: ${status:-none}" >> $GITHUB_STEP_SUMMARY
            echo "Expected marker: ${expected:-any response body}" >> $GITHUB_STEP_SUMMARY
            echo "Last response preview:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            printf '%s' "$body" | head -c 1000 >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${name} endpoint smoke failed for ${url}" >&2
            return 1
          }

          {
            echo "## 🔎 Phase 10 Post-Deployment Endpoint Smoke"
            echo ""
            echo "| Check | URL | Expected |"
            echo "|------|-----|----------|"
            echo "| Gateway Health | ${GATEWAY_HEALTH} | healthy |"
            echo "| Orders API Smoke | ${ORDERS_SMOKE} | activeTenantCode |"
            echo "| UI Reachability | ${UI_URL} | <!doctype html |"
          } >> $GITHUB_STEP_SUMMARY

          smoke_url "Gateway Health" "$GATEWAY_HEALTH" "healthy"
          smoke_url "Orders API Smoke" "$ORDERS_SMOKE" "activeTenantCode"
          smoke_url "UI Reachability" "$UI_URL" "<!doctype html"
      
      - name: Deployment Summary
        run: |
          echo "## 🚀 Phase 10 Routed Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**GitHub Environment:** ${{ steps.params.outputs.env }}" >> $GITHUB_STEP_SUMMARY
          echo "**Azure Resource Suffix:** ${{ steps.params.outputs.envSuffix }}" >> $GITHUB_STEP_SUMMARY
          echo "**Parameter File:** ${{ steps.params.outputs.file }}" >> $GITHUB_STEP_SUMMARY
          echo "**Location:** ${{ steps.params.outputs.location }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment:** ${{ steps.params.outputs.deploymentName }}" >> $GITHUB_STEP_SUMMARY
          echo "**Route Mode:** ${{ needs.route.outputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "**Route Reason:** ${{ needs.route.outputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Resources Created" >> $GITHUB_STEP_SUMMARY
          echo "- **Resource Group:** ${{ steps.outputs.outputs.rg }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service Bus Namespace:** ${{ steps.outputs.outputs.sb }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Log Analytics Workspace:** ${{ steps.outputs.outputs.la }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Managed Environment:** ${{ steps.outputs.outputs.me }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Gateway Container App:** ${{ steps.outputs.outputs.gateway }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Orders Container App:** ${{ steps.outputs.outputs.orders }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Payments Container App:** ${{ steps.outputs.outputs.payments }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Inventory Container App:** ${{ steps.outputs.outputs.inventory }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Notifications Container App:** ${{ steps.outputs.outputs.notifications }}" >> $GITHUB_STEP_SUMMARY
          echo "- **UI Container App:** ${{ steps.outputs.outputs.ui }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Gateway URL:** https://${{ steps.outputs.outputs.gatewayFqdn }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Orders API Smoke:** https://${{ steps.outputs.outputs.gatewayFqdn }}/api/v1/Info/runtime-configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Swagger:** Not a Phase 10 smoke gate; use the Orders API smoke endpoint for routed API proof." >> $GITHUB_STEP_SUMMARY
          echo "- **UI URL:** https://${{ steps.outputs.outputs.uiFqdn }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Alias:** https://${{ steps.aliases.outputs.apiAlias }}" >> $GITHUB_STEP_SUMMARY
          echo "- **UI Alias:** https://${{ steps.aliases.outputs.uiAlias }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Function App:** ${{ steps.outputs.outputs.function }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Key Vault:** ${{ steps.outputs.outputs.keyvault }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App Insights:** ${{ steps.outputs.outputs.insights }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Azure Container Registry:** ${{ steps.outputs.outputs.acr }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ACR Login Server:** ${{ steps.outputs.outputs.acrLoginServer }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.outputs.outputs.sqlServerFqdn }}" ]; then
            echo "- **SQL Server FQDN:** ${{ steps.outputs.outputs.sqlServerFqdn }}" >> $GITHUB_STEP_SUMMARY
            echo "- **SQL Shared Database:** ${{ steps.outputs.outputs.sqlDatabaseName }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Dedicated Tenant Databases:** ${{ steps.outputs.outputs.dedicatedDatabaseNames }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **SQL Server FQDN:** (not deployed)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${{ steps.outputs.outputs.redisHost }}" ]; then
            echo "- **Redis Host:** ${{ steps.outputs.outputs.redisHost }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Redis SSL Port:** ${{ steps.outputs.outputs.redisSslPort }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Redis Host:** (not deployed)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Verify the outputs against the runbook." >> $GITHUB_STEP_SUMMARY
          echo "2. Bind the friendly aliases to the Container App FQDNs or Front Door if alias binding was requested." >> $GITHUB_STEP_SUMMARY
          echo "3. Run the **02 Phase 10 Azure Runtime Smoke** workflow." >> $GITHUB_STEP_SUMMARY
          echo "4. Confirm Gateway/API/UI runtime checks pass in that workflow summary." >> $GITHUB_STEP_SUMMARY
          echo "5. Run the **03 Phase 10 Azure Transport Smoke** workflow." >> $GITHUB_STEP_SUMMARY
          echo "6. Confirm publish/consume, DLQ forwarding, and replay checks pass in that workflow summary." >> $GITHUB_STEP_SUMMARY

  cleanup:
    name: Cleanup Infrastructure (Internal)
    needs: [route, pre-validate]
    if: ${{ always() && needs.route.outputs.run_cleanup == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Confirm routed validation finished
        if: ${{ needs['pre-validate'].result != 'success' }}
        shell: bash
        run: |
          echo "## ❌ Routed cleanup blocked" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| route mode | ${{ needs.route.outputs.mode }} |" >> $GITHUB_STEP_SUMMARY
          echo "| route reason | ${{ needs.route.outputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pre-validate result | ${{ needs['pre-validate'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| decision | cleanup was requested, but the validation gate did not complete successfully |" >> $GITHUB_STEP_SUMMARY
          echo "Validation must complete successfully before the routed cleanup continues." >&2
          exit 1

      - name: Determine parameters
        id: params
        run: |
          echo "env=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          if [ "${{ inputs.environment }}" = "staging" ]; then ENV_SUFFIX="stg"; else ENV_SUFFIX="${{ inputs.environment }}"; fi
          echo "envSuffix=${ENV_SUFFIX}" >> $GITHUB_OUTPUT
          echo "location=${{ inputs.location }}" >> $GITHUB_OUTPUT
          echo "deploymentName=infra-cleanup-${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_OUTPUT

      - name: Azure CLI Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Confirm cleanup target
        shell: bash
        run: |
          RG_NAME="rg-orderprocessing-${{ steps.params.outputs.envSuffix }}"
          echo "About to delete resource group: ${RG_NAME}"
          echo "This will remove the entire Phase 10 environment for: ${{ steps.params.outputs.env }}"
          echo "Proceeding with teardown because cleanupInfra=true and dryRun=false."

      - name: Delete resource group
        shell: bash
        run: |
          RG_NAME="rg-orderprocessing-${{ steps.params.outputs.envSuffix }}"
          az group delete --name "${RG_NAME}" --yes

      - name: Purge environment Key Vault reservation
        shell: bash
        run: |
          KV_NAME="kv-orderprocessing-${{ steps.params.outputs.envSuffix }}"
          LOCATION="${{ steps.params.outputs.location }}"

          echo "Checking whether ${KV_NAME} entered Key Vault soft-delete after RG cleanup..."
          for attempt in {1..30}; do
            if az keyvault list-deleted --query "[?name=='${KV_NAME}'] | length(@)" -o tsv | grep -q '^1$'; then
              echo "Deleted Key Vault '${KV_NAME}' detected. Purging the name reservation..."
              if ! PURGE_OUTPUT=$(az keyvault purge --name "${KV_NAME}" --location "${LOCATION}" --only-show-errors 2>&1); then
                echo "## ⚠️ Cleanup completed, but Key Vault purge failed" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
                echo "|---|---|" >> $GITHUB_STEP_SUMMARY
                echo "| Key Vault | ${KV_NAME} |" >> $GITHUB_STEP_SUMMARY
                echo "| Location | ${LOCATION} |" >> $GITHUB_STEP_SUMMARY
                echo "| Impact | Next deploy may be blocked until the deleted vault is purged or expires |" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo '```text' >> $GITHUB_STEP_SUMMARY
                echo "${PURGE_OUTPUT}" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "Key Vault purge failed for '${KV_NAME}'." >&2
                exit 1
              fi

              echo "✅ Purged deleted Key Vault reservation for '${KV_NAME}'." >> $GITHUB_STEP_SUMMARY
              exit 0
            fi

            echo "Waiting for deleted Key Vault '${KV_NAME}' to appear (${attempt}/30)..."
            sleep 10
          done

          echo "No deleted Key Vault reservation found for '${KV_NAME}' after RG cleanup." >> $GITHUB_STEP_SUMMARY

      - name: Cleanup Summary
        run: |
          echo "## 🗑️ Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**GitHub Environment:** ${{ steps.params.outputs.env }}" >> $GITHUB_STEP_SUMMARY
          echo "**Azure Resource Suffix:** ${{ steps.params.outputs.envSuffix }}" >> $GITHUB_STEP_SUMMARY
          echo "**Location:** ${{ steps.params.outputs.location }}" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** Phase X cleanup / destructive teardown" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Cleanup Requested" >> $GITHUB_STEP_SUMMARY
          echo "- Resource group delete completed for rg-orderprocessing-${{ steps.params.outputs.envSuffix }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deleted Key Vault name reservation was checked and purged when present." >> $GITHUB_STEP_SUMMARY
