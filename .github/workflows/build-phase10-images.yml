name: Build Phase 10 Service Images (Internal)

on:
  workflow_call:
    inputs:
      imageTag:
        description: 'Image tag to publish'
        required: false
        default: 'phase10'
        type: string
      registryLoginServer:
        description: 'ACR login server for the persistent Phase 10 platform registry.'
        required: true
        default: ''
        type: string
      registryName:
        description: 'ACR name used for Azure login.'
        required: true
        default: ''
        type: string
      environment:
        description: 'Target GitHub environment for Azure-backed registry login.'
        required: false
        default: 'dev'
        type: string
permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_call' && inputs.environment || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            repository: orderprocessing-gateway
            dockerfile: XYDataLabs.OrderProcessingSystem.Gateway/Dockerfile
            context: .
          - name: orders
            repository: orderprocessing-orders
            dockerfile: XYDataLabs.OrderProcessingSystem.Orders.API/Dockerfile
            context: .
          - name: inventory
            repository: orderprocessing-inventory
            dockerfile: XYDataLabs.OrderProcessingSystem.Inventory.API/Dockerfile
            context: .
          - name: notifications
            repository: orderprocessing-notifications
            dockerfile: XYDataLabs.OrderProcessingSystem.Notifications.API/Dockerfile
            context: .
          - name: ui
            repository: orderprocessing-ui
            dockerfile: frontend/apps/web/Dockerfile
            context: .

    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tag
        id: tag
        shell: bash
        run: |
          if [ -z "${{ inputs.registryLoginServer }}" ] || [ -z "${{ inputs.registryName }}" ]; then
            echo "Phase 10 image builds require the persistent platform ACR inputs." >&2
            exit 1
          fi

          TAG="${{ inputs.imageTag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.sha }}"
          fi
          echo "imageTag=$TAG" >> $GITHUB_OUTPUT
          echo "image=${{ inputs.registryLoginServer }}/${{ matrix.repository }}" >> $GITHUB_OUTPUT
          echo "registry=acr" >> $GITHUB_OUTPUT

      - name: Azure CLI Login for ACR
        if: ${{ steps.tag.outputs.registry == 'acr' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Log in to Azure Container Registry
        if: ${{ steps.tag.outputs.registry == 'acr' }}
        shell: bash
        run: |
          az acr login --name "${{ inputs.registryName }}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.imageTag }}
            ${{ steps.tag.outputs.image }}:latest

      - name: Image summary
        shell: bash
        run: |
          {
            echo "## Image published: ${{ matrix.name }}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Registry | ${{ steps.tag.outputs.registry }} |"
            echo "| Repository | ${{ steps.tag.outputs.image }} |"
            echo "| Tag | ${{ steps.tag.outputs.imageTag }} |"
          } >> "$GITHUB_STEP_SUMMARY"
