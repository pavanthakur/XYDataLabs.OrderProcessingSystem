name: Validate AI Customization

on:
  push:
    branches: [ main, dev, staging ]
    paths:
      - 'AGENTS.md'
      - 'memories/repo/**'
      - 'scripts/tests/test-ai-customization.ps1'
      - '.github/copilot-instructions.md'
      - '.github/completion-check-rubric.md'
      - '.github/instructions/**'
      - '.github/prompts/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/workflows/validate-ai-customization.yml'
      - '.github/workflows/README.md'
      - 'docs/AI-OPERATING-MODEL.md'
      - 'docs/DEVELOPER-OPERATING-MODEL.md'
      - 'docs/README.md'
      - 'docs/internal/DEFERRED-WORK-LOG.md'
      - 'docs/internal/README.md'
      - 'scripts/validate-ai-customization.ps1'
      - 'scripts/README.md'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'memories/repo/**'
      - 'scripts/tests/test-ai-customization.ps1'
      - '.github/copilot-instructions.md'
      - '.github/completion-check-rubric.md'
      - '.github/instructions/**'
      - '.github/prompts/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/workflows/validate-ai-customization.yml'
      - '.github/workflows/README.md'
      - 'docs/AI-OPERATING-MODEL.md'
      - 'docs/DEVELOPER-OPERATING-MODEL.md'
      - 'docs/README.md'
      - 'docs/internal/DEFERRED-WORK-LOG.md'
      - 'docs/internal/README.md'
      - 'scripts/validate-ai-customization.ps1'
      - 'scripts/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate shared AI assets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate AI customization assets
        shell: pwsh
        run: scripts/validate-ai-customization.ps1

      - name: Test governance validator with isolated positive and negative fixtures
        shell: pwsh
        run: scripts/tests/test-ai-customization.ps1 -ArtifactDirectory TestResults/AIGovernance/ci

      - name: Preserve sanitized governance test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ai-governance-${{ matrix.os }}
          path: |
            TestResults/AIGovernance/ci/summary.json
            TestResults/AIGovernance/ci/logs/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host 'AI customization validation complete. See step output for details.'
          Write-Host 'Checks: safe repository paths | instruction budgets | metadata/discovery | evidence consistency | known unsafe directives | sanitized diagnostics | isolated regression fixtures'
          Write-Host 'Structural validation is not agent behavior or runtime acceptance. Review each step outcome; this summary does not override failures.'
