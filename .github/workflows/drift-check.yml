name: Drift Scanner

on:
  push:
    paths:
      - '**'
  pull_request:
    paths:
      - '**'

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run drift scanner
        working-directory: ${{ github.workspace }}
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/drift-scanner.ps1
