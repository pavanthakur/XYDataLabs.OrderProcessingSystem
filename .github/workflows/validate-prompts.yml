name: CI - Validate AI Prompts
on:
  push:
    paths:
      - '.github/prompts/**'
  pull_request:
    paths:
      - '.github/prompts/**'

jobs:
  validate-prompts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run prompt validation script
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .github\ci\validate-prompts.ps1
