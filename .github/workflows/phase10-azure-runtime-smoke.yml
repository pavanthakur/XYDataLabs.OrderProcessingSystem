name: 02 Phase 10 Azure Runtime Smoke

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  runtime_smoke:
    name: 02 Phase 10 Azure Runtime Smoke
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Azure CLI Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Resolve Phase 10 runtime topology
        id: topology
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            ENV_SUFFIX="stg"
            TARGET_KEY="azure-stg"
          elif [ "${{ inputs.environment }}" = "prod" ]; then
            ENV_SUFFIX="prod"
            TARGET_KEY="azure-prod"
          else
            ENV_SUFFIX="dev"
            TARGET_KEY="azure-dev"
          fi

          TARGET_JSON="$(TARGET_KEY="$TARGET_KEY" node -e 'const doc = require("./automation/config/runtime-targets.json"); const target = doc.targets.find((item) => item.key === process.env.TARGET_KEY); if (!target) { throw new Error(`Unknown runtime target ${process.env.TARGET_KEY}`); } process.stdout.write(JSON.stringify(target));')"
          read_target_field() {
            TARGET_JSON="$TARGET_JSON" FIELD_NAME="$1" node -e 'const target = JSON.parse(process.env.TARGET_JSON); process.stdout.write(String(target[process.env.FIELD_NAME] || ""));'
          }

          RG_NAME="$(read_target_field azureResourceGroupName)"
          GATEWAY_APP="$(read_target_field azureGatewayContainerAppName)"
          ORDERS_APP="$(read_target_field azureOrdersContainerAppName)"
          PAYMENTS_APP="$(read_target_field azurePaymentsContainerAppName)"
          INVENTORY_APP="$(read_target_field azureInventoryContainerAppName)"
          NOTIFICATIONS_APP="$(read_target_field azureNotificationsContainerAppName)"
          UI_APP="$(read_target_field azureUiContainerAppName)"
          FUNCTION_APP="$(read_target_field azureFunctionAppName)"
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

          if [ -z "$RG_NAME" ] || [ -z "$GATEWAY_APP" ] || [ -z "$ORDERS_APP" ] || [ -z "$PAYMENTS_APP" ] || [ -z "$INVENTORY_APP" ] || [ -z "$NOTIFICATIONS_APP" ] || [ -z "$UI_APP" ] || [ -z "$FUNCTION_APP" ]; then
            echo "Selected runtime target ${TARGET_KEY} is missing Azure runtime host metadata in automation/config/runtime-targets.json." >&2
            exit 1
          fi

          RESOURCE_GROUP_URL="https://portal.azure.com/#/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/overview"
          GATEWAY_URL="https://portal.azure.com/#/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.App/containerApps/${GATEWAY_APP}/overview"
          ORDERS_URL="https://portal.azure.com/#/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.App/containerApps/${ORDERS_APP}/overview"
          PAYMENTS_URL="https://portal.azure.com/#/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.App/containerApps/${PAYMENTS_APP}/overview"
          INVENTORY_URL="https://portal.azure.com/#/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.App/containerApps/${INVENTORY_APP}/overview"
          NOTIFICATIONS_URL="https://portal.azure.com/#/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.App/containerApps/${NOTIFICATIONS_APP}/overview"
          UI_URL="https://portal.azure.com/#/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.App/containerApps/${UI_APP}/overview"
          FUNCTION_URL="https://portal.azure.com/#/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.Web/sites/${FUNCTION_APP}/overview"

          echo "envSuffix=${ENV_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "targetKey=${TARGET_KEY}" >> "$GITHUB_OUTPUT"
          echo "resourceGroup=${RG_NAME}" >> "$GITHUB_OUTPUT"
          echo "gatewayApp=${GATEWAY_APP}" >> "$GITHUB_OUTPUT"
          echo "ordersApp=${ORDERS_APP}" >> "$GITHUB_OUTPUT"
          echo "paymentsApp=${PAYMENTS_APP}" >> "$GITHUB_OUTPUT"
          echo "inventoryApp=${INVENTORY_APP}" >> "$GITHUB_OUTPUT"
          echo "notificationsApp=${NOTIFICATIONS_APP}" >> "$GITHUB_OUTPUT"
          echo "uiApp=${UI_APP}" >> "$GITHUB_OUTPUT"
          echo "functionApp=${FUNCTION_APP}" >> "$GITHUB_OUTPUT"

          {
            echo "## 02 Phase 10 Azure Runtime Smoke Context"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| Azure Resource Suffix | ${ENV_SUFFIX} |"
            echo "| Resource Group | ${RG_NAME} |"
            echo "| Gateway Container App | ${GATEWAY_APP} |"
            echo "| Orders Container App | ${ORDERS_APP} |"
            echo "| Payments Container App | ${PAYMENTS_APP} |"
            echo "| Inventory Container App | ${INVENTORY_APP} |"
            echo "| Notifications Container App | ${NOTIFICATIONS_APP} |"
            echo "| UI Container App | ${UI_APP} |"
            echo "| Function App | ${FUNCTION_APP} |"
            echo ""
            echo "### Azure Links"
            echo ""
            echo "- [Resource group](${RESOURCE_GROUP_URL})"
            echo "- [Gateway Container App](${GATEWAY_URL})"
            echo "- [Orders Container App](${ORDERS_URL})"
            echo "- [Payments Container App](${PAYMENTS_URL})"
            echo "- [Inventory Container App](${INVENTORY_URL})"
            echo "- [Notifications Container App](${NOTIFICATIONS_URL})"
            echo "- [UI Container App](${UI_URL})"
            echo "- [Function App](${FUNCTION_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify runtime hosts from Azure control plane
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:RUNNER_TEMP 'phase10-azure-runtime-hosts.md'

          & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-phase10-azure-runtime-hosts.ps1 `
            -Environment '${{ inputs.environment }}' `
            -ResourceGroupName '${{ steps.topology.outputs.resourceGroup }}' `
            -GatewayContainerAppName '${{ steps.topology.outputs.gatewayApp }}' `
            -OrdersContainerAppName '${{ steps.topology.outputs.ordersApp }}' `
            -PaymentsContainerAppName '${{ steps.topology.outputs.paymentsApp }}' `
            -InventoryContainerAppName '${{ steps.topology.outputs.inventoryApp }}' `
            -NotificationsContainerAppName '${{ steps.topology.outputs.notificationsApp }}' `
            -UiContainerAppName '${{ steps.topology.outputs.uiApp }}' `
            -FunctionAppName '${{ steps.topology.outputs.functionApp }}' `
            -SummaryPath $summaryPath

          $verifyExitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $summaryPath) {
            Get-Content -LiteralPath $summaryPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

          if ($verifyExitCode -ne 0) {
            throw "Phase 10 Azure runtime host verification failed with exit code $verifyExitCode."
          }

      - name: Verify active tenant topology contract
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:RUNNER_TEMP 'phase10-azure-tenant-topology.md'

          & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-phase10-azure-tenant-topology.ps1 `
            -Environment '${{ inputs.environment }}' `
            -ResourceGroupName '${{ steps.topology.outputs.resourceGroup }}' `
            -SummaryPath $summaryPath

          $verifyExitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $summaryPath) {
            Get-Content -LiteralPath $summaryPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

          if ($verifyExitCode -ne 0) {
            throw "Phase 10 Azure tenant topology verification failed with exit code $verifyExitCode."
          }

      - name: Run runtime API UI smoke
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:RUNNER_TEMP 'phase10-azure-runtime-smoke.md'

          & pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/run-phase10-azure-runtime-smoke.ps1 `
            -Environment '${{ inputs.environment }}' `
            -ResourceGroupName '${{ steps.topology.outputs.resourceGroup }}' `
            -SummaryPath $summaryPath

          $smokeExitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $summaryPath) {
            Get-Content -LiteralPath $summaryPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

          if ($smokeExitCode -ne 0) {
            throw "Phase 10 Azure runtime smoke failed with exit code $smokeExitCode."
          }

      - name: Upload runtime smoke summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase10-azure-runtime-smoke-${{ inputs.environment }}
          path: |
            ${{ runner.temp }}/phase10-azure-runtime-hosts.md
            ${{ runner.temp }}/phase10-azure-tenant-topology.md
            ${{ runner.temp }}/phase10-azure-tenant-topology.json
            ${{ runner.temp }}/phase10-azure-runtime-smoke.md
          if-no-files-found: ignore
          retention-days: 14
