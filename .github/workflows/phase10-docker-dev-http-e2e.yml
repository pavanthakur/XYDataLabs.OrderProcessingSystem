name: 99 Phase 10 Docker Dev HTTP End-to-End (local-Optional)

on:
  workflow_dispatch:
    inputs:
      stabilizationDelaySeconds:
        description: 'Seconds to wait before smoke and validation'
        required: true
        default: 120
        type: number
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths:
      - '.github/workflows/phase10-docker-dev-http-e2e.yml'
      - 'scripts/run-phase10-docker-dev-e2e-hook.ps1'
      - 'scripts/run-phase10-local-container-stack-end-to-end.ps1'
      - 'scripts/run-phase10-docker-dev-smoke.ps1'
      - 'scripts/run-integration-tests-docker.ps1'
      - 'scripts/run-playwright-full-validation.ps1'
      - 'scripts/start-phase10-docker-dev.ps1'
      - 'compose/docker-compose.phase10.yml'
      - '.vscode/tasks.json'
      - 'automation/package.json'
      - 'automation/README.md'

permissions:
  contents: read

jobs:
  phase10-docker-dev-http-e2e:
    name: 99 Phase 10 Docker Dev HTTP End-to-End (local-Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STABILIZATION_DELAY_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.stabilizationDelaySeconds || 120 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Confirm Docker availability
        run: docker info

      - name: Create CI Docker env file
        shell: pwsh
        run: |
          $envPath = Join-Path $PWD 'Resources/Docker/.env.local'
          $content = @(
            '# Generated by 99 Phase 10 Docker Dev HTTP End-to-End (local-Optional) for CI only.'
            'LOCAL_SQL_PASSWORD=Phase10_CI_SQL_2026!'
            'LOCAL_CERT_PASSWORD=Phase10_CI_CERT_2026!'
            'LOCAL_OPENPAY_MERCHANT_ID=local-sandbox-only'
            'LOCAL_OPENPAY_PUBLIC_KEY=local-sandbox-only'
            'LOCAL_OPENPAY_PRIVATE_KEY=local-sandbox-only'
            'LOCAL_OPENPAY_DEVICE_SESSION_ID=local-sandbox-only'
            'LOCAL_OPENPAY_WEBHOOK_SECRET=local-sandbox-only'
            'LOCAL_RAZORPAY_MERCHANT_ID=local-sandbox-only'
            'LOCAL_RAZORPAY_PRIVATE_KEY=local-sandbox-only'
            'LOCAL_RAZORPAY_WEBHOOK_SECRET=local-sandbox-only'
            'KEYCLOAK_TENANT_ADMIN_PASSWORD=Phase10_CI_Keycloak_2026!'
            'LOCAL_KEYCLOAK_BACKEND_CLIENT_SECRET=Phase10_CI_Keycloak_Backend_2026!'
            'ORDERPROCESSING_SQLSERVER_IMAGE=mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04'
          )
          Set-Content -LiteralPath $envPath -Value $content -Encoding utf8
          Write-Host "Created CI-only Docker env file at $envPath"

      - name: Install EF Core CLI
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.13
          "$HOME/.dotnet/tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          dotnet ef --version

      - name: Install frontend smoke dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium

      - name: Install automation matrix dependencies
        working-directory: automation
        run: npm ci

      - name: Resolve run packet context
        id: run_packet
        shell: pwsh
        run: |
          $runId = "phase10-docker-dev-http-${{ github.run_id }}-${{ github.run_attempt }}"
          $runRoot = Join-Path (Join-Path $PWD 'TestResults/Playwright/phase10-docker-http') $runId
          $summaryPath = Join-Path $runRoot 'run-summary.md'
          $summaryJsonPath = Join-Path $runRoot 'run-summary.json'
          $latestPointerPath = Join-Path (Join-Path $PWD 'TestResults/Playwright/phase10-docker-http') 'latest-playwright-run.txt'
          $latestFailurePointerPath = Join-Path (Join-Path $PWD 'TestResults/Playwright/phase10-docker-http') 'latest-playwright-failure.txt'

          New-Item -ItemType Directory -Path $runRoot -Force | Out-Null

          "run_id=$runId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "run_root=$runRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "summary_path=$summaryPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "summary_json_path=$summaryJsonPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "latest_pointer_path=$latestPointerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "latest_failure_pointer_path=$latestFailurePointerPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Resolved Phase 10 run packet context:"
          Write-Host "  Run ID: $runId"
          Write-Host "  Run Root: $runRoot"
          Write-Host "  Summary: $summaryPath"

      - name: Run Phase 10 Docker Dev HTTP hook
        shell: pwsh
        env:
          PHASE10_RUN_ID: ${{ steps.run_packet.outputs.run_id }}
          PHASE10_RUN_ROOT: ${{ steps.run_packet.outputs.run_root }}
        run: |
          $args = @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-File', 'scripts/run-phase10-docker-dev-e2e-hook.ps1',
            '-StabilizationDelaySeconds', $env:STABILIZATION_DELAY_SECONDS,
            '-RunId', $env:PHASE10_RUN_ID
          )
          & pwsh @args

      - name: Print failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $runRoot = '${{ steps.run_packet.outputs.run_root }}'
          $summaryPath = '${{ steps.run_packet.outputs.summary_path }}'
          $summaryJsonPath = '${{ steps.run_packet.outputs.summary_json_path }}'
          $logRoot = Join-Path $PWD 'TestResults/Playwright/phase10-docker-http'
          $candidateFiles = @(
            $summaryPath,
            $summaryJsonPath,
            (Join-Path $logRoot 'latest-playwright-full-validation.txt'),
            (Join-Path $logRoot 'latest-playwright-smoke.txt'),
            (Join-Path $PWD 'TestResults/Playwright/latest-playwright-run.txt')
          )

          if (-not [string]::IsNullOrWhiteSpace($runRoot) -and (Test-Path -LiteralPath $runRoot)) {
            Write-Host ""
            Write-Host "=== Phase 10 resolved run packet ===" -ForegroundColor Cyan
            Write-Host $runRoot

            if (Test-Path -LiteralPath $summaryPath) {
              Write-Host ""
              Write-Host "--- run-summary.md ---" -ForegroundColor Yellow
              Get-Content -LiteralPath $summaryPath -Tail 160
            }

            if (Test-Path -LiteralPath $summaryJsonPath) {
              Write-Host ""
              Write-Host "--- run-summary.json ---" -ForegroundColor Yellow
              Get-Content -LiteralPath $summaryJsonPath -Tail 160
            }
          }

          foreach ($pointer in $candidateFiles) {
            if (-not (Test-Path -LiteralPath $pointer)) {
              continue
            }

            $runDir = (Get-Content -LiteralPath $pointer -Raw).Trim()
            if ([string]::IsNullOrWhiteSpace($runDir) -or -not (Test-Path -LiteralPath $runDir)) {
              continue
            }

            Write-Host ""
            Write-Host "=== Phase 10 diagnostic run directory ===" -ForegroundColor Cyan
            Write-Host $runDir

            $summary = Join-Path $runDir 'summary.json'
            if (Test-Path -LiteralPath $summary) {
              Write-Host ""
              Write-Host "--- summary.json ---" -ForegroundColor Yellow
              Get-Content -LiteralPath $summary -Tail 120
            }

            $logs = Get-ChildItem -LiteralPath $runDir -File -Filter '*.log' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 5

            foreach ($log in $logs) {
              Write-Host ""
              Write-Host "--- $($log.Name) tail ---" -ForegroundColor Yellow
              Get-Content -LiteralPath $log.FullName -Tail 80
            }
          }

      - name: Capture Docker container diagnostics
        if: failure()
        shell: pwsh
        run: |
          $runRoot = '${{ steps.run_packet.outputs.run_root }}'
          if ([string]::IsNullOrWhiteSpace($runRoot) -or -not (Test-Path -LiteralPath $runRoot)) {
            throw "Run root was not created; cannot capture Docker diagnostics."
          }

          $composeArgs = @(
            'compose',
            '-f', 'compose/docker-compose.phase10.yml',
            '--env-file', 'Resources/Docker/.env.local'
          )

          $psLog = Join-Path $runRoot 'docker-compose-ps.log'
          $serviceLogs = Join-Path $runRoot 'docker-compose-service-logs.log'

          & docker @composeArgs ps | Tee-Object -FilePath $psLog
          & docker @composeArgs logs orders gateway payments inventory notifications keycloak-local servicebus-emulator `
            | Tee-Object -FilePath $serviceLogs

      - name: Upload Phase 10 logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase10-docker-dev-http-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/Playwright/phase10-docker-http/${{ steps.run_packet.outputs.run_id }}/**
          if-no-files-found: warn
          retention-days: 14

      - name: Write summary
        if: always()
        shell: pwsh
        run: |
          $runId = '${{ steps.run_packet.outputs.run_id }}'
          $runRoot = '${{ steps.run_packet.outputs.run_root }}'
          $summaryPath = '${{ steps.run_packet.outputs.summary_path }}'
          $summaryJsonPath = '${{ steps.run_packet.outputs.summary_json_path }}'
          $summary = @()
          $summary += '## 99 Phase 10 Docker Dev HTTP End-to-End (local-Optional)'
          $summary += ''
          $summary += '- Hook: `scripts/run-phase10-docker-dev-e2e-hook.ps1`'
          $summary += '- Automation alias: `npm --prefix automation run xydatalabs-test-docker-local-e2e-dev`'
          $summary += '- Compatibility alias: `npm --prefix automation run run:docker:dev:http:e2e-hook`'
          $summary += ('- Run packet root: `' + $runRoot + '`')
          $summary += ('- Run summary: `' + $summaryPath + '`')
          $summary += ('- JSON summary: `' + $summaryJsonPath + '`')
          $summary += '- Artifact bundle: `phase10-docker-dev-http-e2e-${{ github.run_id }}-${{ github.run_attempt }}`'
          $summary += ''
          $summary += '### Expected sequence'
          $summary += '1. Ready + Keycloak'
          $summary += '2. Playwright smoke'
          $summary += '3. Integration suite'
          $summary += '4. Payment matrix'
          $summary += '5. Full validation'
          $summary += ''
          $summary += '### Artifacts'
          $summary += '- End-to-end summary JSON'
          $summary += '- Run summary markdown'
          $summary += '- Smoke pointer file'
          $summary += '- Full-validation pointer file'
          $summary += ('- Deterministic run packet id: `' + $runId + '`')
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
