name: 99 Phase 10 Docker Dev HTTP End-to-End (local-Optional)

on:
  workflow_dispatch:
    inputs:
      stabilizationDelaySeconds:
        description: 'Seconds to wait before smoke and validation'
        required: true
        default: 120
        type: number
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths:
      - '.github/workflows/phase10-docker-dev-http-e2e.yml'
      - 'scripts/run-phase10-docker-dev-e2e-hook.ps1'
      - 'scripts/run-phase10-local-container-stack-end-to-end.ps1'
      - 'scripts/run-phase10-docker-dev-smoke.ps1'
      - 'scripts/run-integration-tests-docker.ps1'
      - 'scripts/run-playwright-full-validation.ps1'
      - 'scripts/start-phase10-docker-dev.ps1'
      - 'compose/docker-compose.phase10.yml'
      - '.vscode/tasks.json'
      - 'automation/package.json'
      - 'automation/README.md'

permissions:
  contents: read

jobs:
  phase10-docker-dev-http-e2e:
    name: 99 Phase 10 Docker Dev HTTP End-to-End (local-Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STABILIZATION_DELAY_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.stabilizationDelaySeconds || 120 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Confirm Docker availability
        run: docker info

      - name: Create CI Docker env file
        shell: pwsh
        run: |
          $envPath = Join-Path $PWD 'Resources/Docker/.env.local'
          $content = @(
            '# Generated by 99 Phase 10 Docker Dev HTTP End-to-End (local-Optional) for CI only.'
            'LOCAL_SQL_PASSWORD=Phase10_CI_SQL_2026!'
            'LOCAL_CERT_PASSWORD=Phase10_CI_CERT_2026!'
            'LOCAL_OPENPAY_MERCHANT_ID=local-sandbox-only'
            'LOCAL_OPENPAY_PUBLIC_KEY=local-sandbox-only'
            'LOCAL_OPENPAY_PRIVATE_KEY=local-sandbox-only'
            'LOCAL_OPENPAY_DEVICE_SESSION_ID=local-sandbox-only'
            'LOCAL_OPENPAY_WEBHOOK_SECRET=local-sandbox-only'
            'LOCAL_RAZORPAY_MERCHANT_ID=local-sandbox-only'
            'LOCAL_RAZORPAY_PRIVATE_KEY=local-sandbox-only'
            'LOCAL_RAZORPAY_WEBHOOK_SECRET=local-sandbox-only'
            'KEYCLOAK_TENANT_ADMIN_PASSWORD=Phase10_CI_Keycloak_2026!'
            'ORDERPROCESSING_SQLSERVER_IMAGE=mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04'
          )
          Set-Content -LiteralPath $envPath -Value $content -Encoding utf8
          Write-Host "Created CI-only Docker env file at $envPath"

      - name: Install EF Core CLI
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.13
          "$HOME/.dotnet/tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          dotnet ef --version

      - name: Install frontend smoke dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium

      - name: Install automation matrix dependencies
        working-directory: automation
        run: npm ci

      - name: Run Phase 10 Docker Dev HTTP hook
        shell: pwsh
        run: |
          $args = @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-File', 'scripts/run-phase10-docker-dev-e2e-hook.ps1',
            '-StabilizationDelaySeconds', $env:STABILIZATION_DELAY_SECONDS
          )
          & pwsh @args

      - name: Print failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $logRoot = Join-Path $PWD 'TestResults/Playwright/phase10-docker-http'
          $candidateFiles = @(
            (Join-Path $logRoot 'latest-playwright-full-validation.txt'),
            (Join-Path $logRoot 'latest-playwright-smoke.txt'),
            (Join-Path $PWD 'TestResults/Playwright/latest-playwright-run.txt')
          )

          foreach ($pointer in $candidateFiles) {
            if (-not (Test-Path -LiteralPath $pointer)) {
              continue
            }

            $runDir = (Get-Content -LiteralPath $pointer -Raw).Trim()
            if ([string]::IsNullOrWhiteSpace($runDir) -or -not (Test-Path -LiteralPath $runDir)) {
              continue
            }

            Write-Host ""
            Write-Host "=== Phase 10 diagnostic run directory ===" -ForegroundColor Cyan
            Write-Host $runDir

            $summary = Join-Path $runDir 'summary.json'
            if (Test-Path -LiteralPath $summary) {
              Write-Host ""
              Write-Host "--- summary.json ---" -ForegroundColor Yellow
              Get-Content -LiteralPath $summary -Tail 120
            }

            $logs = Get-ChildItem -LiteralPath $runDir -File -Filter '*.log' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 5

            foreach ($log in $logs) {
              Write-Host ""
              Write-Host "--- $($log.Name) tail ---" -ForegroundColor Yellow
              Get-Content -LiteralPath $log.FullName -Tail 80
            }
          }

      - name: Upload Phase 10 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-docker-dev-http-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/Playwright/phase10-docker-http/**
            TestResults/Integration/**
          if-no-files-found: warn
          retention-days: 14

      - name: Write summary
        if: always()
        shell: pwsh
        run: |
          $summary = @()
          $summary += '## 99 Phase 10 Docker Dev HTTP End-to-End (local-Optional)'
          $summary += ''
          $summary += '- Hook: `scripts/run-phase10-docker-dev-e2e-hook.ps1`'
          $summary += '- Automation alias: `npm --prefix automation run xydatalabs-test-docker-local-e2e-dev`'
          $summary += '- Compatibility alias: `npm --prefix automation run run:docker:dev:http:e2e-hook`'
          $summary += '- Logs: `TestResults/Playwright/phase10-docker-http`'
          $summary += '- Latest smoke pointer: `TestResults/Playwright/phase10-docker-http/latest-playwright-smoke.txt`'
          $summary += '- Latest full-validation pointer: `TestResults/Playwright/phase10-docker-http/latest-playwright-full-validation.txt`'
          $summary += '- End-to-end summary JSON: `TestResults/Playwright/phase10-docker-http/<timestamp>_endtoend/summary.json`'
          $summary += '- Artifact bundle: `phase10-docker-dev-http-e2e-${{ github.run_id }}-${{ github.run_attempt }}`'
          $summary += ''
          $summary += '### Expected sequence'
          $summary += '1. Ready + Keycloak'
          $summary += '2. Playwright smoke'
          $summary += '3. Integration suite'
          $summary += '4. Payment matrix'
          $summary += '5. Full validation'
          $summary += ''
          $summary += '### Artifacts'
          $summary += '- End-to-end summary JSON'
          $summary += '- Smoke pointer file'
          $summary += '- Full-validation pointer file'
          $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
