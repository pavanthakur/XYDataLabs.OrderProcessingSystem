name: 04 Phase 10 Azure Payment Matrix

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      tenantTimeoutMs:
        description: 'Per-tenant timeout in milliseconds'
        required: true
        default: 180000
        type: number
      skipVerification:
        description: 'Skip App Insights and Azure SQL verification after browser flow'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  azure_payment_matrix:
    name: 04 Phase 10 Azure Payment Matrix
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Azure CLI Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Resolve Phase 10 Azure E2E topology
        id: topology
        shell: bash
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            ENV_SUFFIX="stg"
            TARGET_KEY="azure-stg"
          elif [ "${{ inputs.environment }}" = "prod" ]; then
            ENV_SUFFIX="prod"
            TARGET_KEY="azure-prod"
          else
            ENV_SUFFIX="dev"
            TARGET_KEY="azure-dev"
          fi

          TARGET_JSON="$(TARGET_KEY="$TARGET_KEY" node -e 'const doc = require("./automation/config/runtime-targets.json"); const target = doc.targets.find((item) => item.key === process.env.TARGET_KEY); if (!target) { throw new Error(`Unknown runtime target ${process.env.TARGET_KEY}`); } process.stdout.write(JSON.stringify(target));')"
          read_target_field() {
            TARGET_JSON="$TARGET_JSON" FIELD_NAME="$1" node -e 'const target = JSON.parse(process.env.TARGET_JSON); process.stdout.write(String(target[process.env.FIELD_NAME] || ""));'
          }

          RG_NAME="$(read_target_field azureResourceGroupName)"
          GATEWAY_APP="$(read_target_field azureGatewayContainerAppName)"
          UI_APP="$(read_target_field azureUiContainerAppName)"
          SQL_SERVER="$(read_target_field azureSqlServerName)"
          REDIS_NAME="$(read_target_field azureRedisName)"
          GATEWAY_BASE_URL="$(read_target_field apiBaseUrl | sed 's#/*$##')"
          UI_BASE_URL="$(read_target_field baseUrl | sed 's#/*$##')"
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

          if [ -z "$RG_NAME" ] || [ -z "$GATEWAY_APP" ] || [ -z "$UI_APP" ] || [ -z "$SQL_SERVER" ] || [ -z "$REDIS_NAME" ]; then
            echo "Selected runtime target ${TARGET_KEY} is missing Azure resource metadata in automation/config/runtime-targets.json." >&2
            exit 1
          fi

          GATEWAY_FQDN="$(az containerapp show --resource-group "$RG_NAME" --name "$GATEWAY_APP" --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)"
          UI_FQDN="$(az containerapp show --resource-group "$RG_NAME" --name "$UI_APP" --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)"

          if [ -n "$GATEWAY_FQDN" ]; then
            GATEWAY_BASE_URL="https://${GATEWAY_FQDN}"
          fi

          if [ -n "$UI_FQDN" ]; then
            UI_BASE_URL="https://${UI_FQDN}"
          fi

          if [ -z "$GATEWAY_BASE_URL" ] || [ -z "$UI_BASE_URL" ]; then
            echo "Failed to resolve Gateway/UI URLs from automation/config/runtime-targets.json or Azure Container Apps." >&2
            exit 1
          fi

          RESOURCE_GROUP_URL="https://portal.azure.com/#/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/overview"
          GATEWAY_URL="https://portal.azure.com/#/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.App/containerApps/${GATEWAY_APP}/overview"
          UI_URL="https://portal.azure.com/#/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.App/containerApps/${UI_APP}/overview"

          echo "envSuffix=${ENV_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "targetKey=${TARGET_KEY}" >> "$GITHUB_OUTPUT"
          echo "resourceGroup=${RG_NAME}" >> "$GITHUB_OUTPUT"
          echo "gatewayApp=${GATEWAY_APP}" >> "$GITHUB_OUTPUT"
          echo "uiApp=${UI_APP}" >> "$GITHUB_OUTPUT"
          echo "sqlServer=${SQL_SERVER}" >> "$GITHUB_OUTPUT"
          echo "redisName=${REDIS_NAME}" >> "$GITHUB_OUTPUT"
          echo "gatewayBaseUrl=${GATEWAY_BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "uiBaseUrl=${UI_BASE_URL}" >> "$GITHUB_OUTPUT"

          {
            echo "## 04 Phase 10 Azure Payment Matrix Context"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| Azure Resource Suffix | ${ENV_SUFFIX} |"
            echo "| Runtime Target | ${TARGET_KEY} |"
            echo "| Resource Group | ${RG_NAME} |"
            echo "| Gateway Base URL | ${GATEWAY_BASE_URL} |"
            echo "| UI Base URL | ${UI_BASE_URL} |"
            echo "| SQL Server | ${SQL_SERVER} |"
            echo "| Redis | ${REDIS_NAME} |"
            echo ""
            echo "### Azure Links"
            echo ""
            echo "- [Resource group](${RESOURCE_GROUP_URL})"
            echo "- [Gateway Container App](${GATEWAY_URL})"
            echo "- [UI Container App](${UI_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify SQL and Redis baseline resources exist
        shell: bash
        run: |
          RG_NAME="${{ steps.topology.outputs.resourceGroup }}"
          SQL_SERVER="${{ steps.topology.outputs.sqlServer }}"
          REDIS_NAME="${{ steps.topology.outputs.redisName }}"

          az sql server show --resource-group "$RG_NAME" --name "$SQL_SERVER" --only-show-errors 1>/dev/null
          az resource show \
            --resource-group "$RG_NAME" \
            --resource-type "Microsoft.Cache/redisEnterprise" \
            --name "$REDIS_NAME" \
            --only-show-errors \
            1>/dev/null

          {
            echo ""
            echo "### SQL and Redis Baseline"
            echo ""
            echo "| Resource | Status |"
            echo "|---|---|"
            echo "| SQL Server ${SQL_SERVER} | Present |"
            echo "| Redis ${REDIS_NAME} | Present |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify tenant and provider matrix contract
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $PWD 'TestResults/Playwright/azure-https'
          $summaryPath = Join-Path $artifactRoot 'topology-preflight-${{ inputs.environment }}-${{ github.run_id }}.md'

          $verifyError = $null
          try {
            & scripts/verify-phase10-azure-tenant-topology.ps1 `
              -Environment '${{ inputs.environment }}' `
              -ResourceGroupName '${{ steps.topology.outputs.resourceGroup }}' `
              -GatewayBaseUrl '${{ steps.topology.outputs.gatewayBaseUrl }}' `
              -SummaryPath $summaryPath
          }
          catch {
            $verifyError = $_
          }

          if (Test-Path -LiteralPath $summaryPath) {
            Get-Content -LiteralPath $summaryPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

          if ($null -ne $verifyError) {
            throw "Azure payment matrix topology/provider preflight failed. $($verifyError.Exception.Message) Run the Phase 10 deploy orchestrator to synchronize provider aliases before retrying the matrix."
          }

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Install Playwright browser
        working-directory: automation
        run: npx playwright install chromium

      - name: Run all tenants with assigned payment providers
        shell: bash
        env:
          XYDATALABS_RUNTIME_TARGET_AZURE_DEV_BASE_URL: ${{ steps.topology.outputs.uiBaseUrl }}
          XYDATALABS_RUNTIME_TARGET_AZURE_DEV_API_BASE_URL: ${{ steps.topology.outputs.gatewayBaseUrl }}
          XYDATALABS_RUNTIME_TARGET_AZURE_STG_BASE_URL: ${{ steps.topology.outputs.uiBaseUrl }}
          XYDATALABS_RUNTIME_TARGET_AZURE_STG_API_BASE_URL: ${{ steps.topology.outputs.gatewayBaseUrl }}
          XYDATALABS_RUNTIME_TARGET_AZURE_PROD_BASE_URL: ${{ steps.topology.outputs.uiBaseUrl }}
          XYDATALABS_RUNTIME_TARGET_AZURE_PROD_API_BASE_URL: ${{ steps.topology.outputs.gatewayBaseUrl }}
        run: |
          EXTRA_ARGS=()
          if [ "${{ inputs.skipVerification }}" = "true" ]; then
            EXTRA_ARGS+=("--skip-verification")
          fi

          npm --prefix automation run run:azure:matrix -- \
            --target "${{ steps.topology.outputs.targetKey }}" \
            --tenant-timeout-ms "${{ inputs.tenantTimeoutMs }}" \
            "${EXTRA_ARGS[@]}"

      - name: Verify assigned topology remains unchanged
        if: always()
        shell: pwsh
        run: |
          $summaryPath = Join-Path $PWD 'TestResults/Playwright/azure-https/topology-postflight-${{ inputs.environment }}-${{ github.run_id }}.md'
          & scripts/verify-phase10-azure-tenant-topology.ps1 `
            -Environment '${{ inputs.environment }}' `
            -ResourceGroupName '${{ steps.topology.outputs.resourceGroup }}' `
            -GatewayBaseUrl '${{ steps.topology.outputs.gatewayBaseUrl }}' `
            -SummaryPath $summaryPath

          if (Test-Path -LiteralPath $summaryPath) {
            Get-Content -LiteralPath $summaryPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Resolve Azure matrix run packet
        id: run_packet
        if: always()
        shell: pwsh
        run: |
          $environmentKey = 'azure-https'
          $pointerPath = Join-Path $PWD "TestResults/Playwright/$environmentKey/latest-playwright-matrix.txt"
          $runRoot = ''
          if (Test-Path -LiteralPath $pointerPath) {
            $runRoot = (Get-Content -LiteralPath $pointerPath -Raw).Trim()
          }

          $summaryPath = if (-not [string]::IsNullOrWhiteSpace($runRoot)) { Join-Path $runRoot 'summary.md' } else { '' }
          $summaryJsonPath = if (-not [string]::IsNullOrWhiteSpace($runRoot)) { Join-Path $runRoot 'summary.json' } else { '' }

          "run_root=$runRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "summary_path=$summaryPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "summary_json_path=$summaryJsonPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if (-not [string]::IsNullOrWhiteSpace($summaryPath) -and (Test-Path -LiteralPath $summaryPath)) {
            Get-Content -LiteralPath $summaryPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Print failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $runRoot = '${{ steps.run_packet.outputs.run_root }}'
          if ([string]::IsNullOrWhiteSpace($runRoot) -or -not (Test-Path -LiteralPath $runRoot)) {
            Write-Host 'No Azure matrix run packet was resolved.'
            return
          }

          Write-Host "Azure matrix run packet: $runRoot"
          foreach ($fileName in @('summary.md', 'summary.json', 'progress.log', 'startup.log')) {
            $path = Join-Path $runRoot $fileName
            if (Test-Path -LiteralPath $path) {
              Write-Host ""
              Write-Host "--- $fileName ---"
              Get-Content -LiteralPath $path -Tail 160
            }
          }

      - name: Upload Azure payment matrix run packet
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase10-azure-payment-matrix-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/Playwright/azure-https/**
          if-no-files-found: warn
          retention-days: 14
