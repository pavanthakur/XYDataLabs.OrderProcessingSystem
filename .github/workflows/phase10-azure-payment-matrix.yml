name: 04 Phase 10 Azure Payment Matrix

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (workflow 04 is dev-only)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
      runMode:
        description: 'Service preflight runs in GitHub without payments and may use a temporary SQL firewall lease. Supervised modes only print desktop commands. Fill lookup fields only for Razorpay order lookup.'
        required: true
        default: service-preflight
        type: choice
        options:
          - service-preflight
          - supervised-browser-auth
          - supervised-sandbox-payments
          - razorpay-order-lookup
      lookupTenantCode:
        description: 'Razorpay lookup only: exact tenant code for the existing order. Otherwise leave blank.'
        required: false
        type: string
      lookupOrderId:
        description: 'Razorpay lookup only: existing order_* ID, not a pay_* ID. Otherwise leave blank.'
        required: false
        type: string
      lookupAmountMinor:
        description: 'Razorpay lookup only: expected amount in paise (INR 200 = 20000), not a charge amount. Otherwise keep 0.'
        required: false
        default: 0
        type: number

permissions:
  contents: read

concurrency:
  group: phase10-azure-${{ inputs.environment }}
  queue: max
  cancel-in-progress: false

jobs:
  supervised_browser_handoff:
    if: inputs.runMode == 'supervised-browser-auth' || inputs.runMode == 'supervised-sandbox-payments'
    name: 'Desktop browser handoff (awaiting evidence)'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Print supervised Azure-dev instructions (no browser or payments run here)
        shell: pwsh
        env:
          RUN_MODE: ${{ inputs.runMode }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          LOOKUP_TENANT: ${{ inputs.lookupTenantCode }}
          LOOKUP_ORDER: ${{ inputs.lookupOrderId }}
          LOOKUP_AMOUNT: ${{ inputs.lookupAmountMinor }}
        run: |
          if ($env:TARGET_ENVIRONMENT -ne 'dev' -or $env:GITHUB_REF -ne 'refs/heads/dev') { throw 'Browser handoff requires branch dev and environment dev.' }
          if ($env:LOOKUP_TENANT -or $env:LOOKUP_ORDER -or [long]$env:LOOKUP_AMOUNT -ne 0) { throw 'Lookup parameters are not allowed in supervised modes.' }
          $desktopMode = if ($env:RUN_MODE -eq 'supervised-browser-auth') { 'AuthPreflight' } else { 'ProviderMatrix' }
          @(
            '## Awaiting supervised evidence — browser and payments NOT RUN'
            'No browser or payment test ran in GitHub. Run the command below on your desktop.'
            "Use a clean desktop checkout of workflow SHA $env:GITHUB_SHA (handoff run $env:GITHUB_RUN_ID)."
            'First verify a passing service-preflight packet for the same candidate and deployment. Replace the subscription placeholder with the approved dev subscription ID.'
            'ProviderMatrix requires separate approval to create sandbox transactions. Selecting this mode is not that approval.'
            ''
            '```powershell'
            "pwsh -NoProfile -File scripts/run-phase10-azure-dev-operator-matrix.ps1 -Mode $desktopMode -ExpectedSubscriptionId '<approved-dev-subscription-id>'"
            '```'
            ''
            'Complete normal Entra sign-in on your desktop. Record the sanitized result with this run ID, source SHA, and tested deployment identity. A successful handoff is not acceptance.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  azure_payment_matrix:
    if: inputs.runMode != 'supervised-browser-auth' && inputs.runMode != 'supervised-sandbox-payments'
    name: ${{ inputs.runMode == 'razorpay-order-lookup' && '04 Phase 10 Read-Only Provider Lookup' || '04 Phase 10 Azure Service Preflight' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate hosted Azure-dev run selection
        shell: pwsh
        env:
          RUN_MODE: ${{ inputs.runMode }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          LOOKUP_TENANT: ${{ inputs.lookupTenantCode }}
          LOOKUP_ORDER: ${{ inputs.lookupOrderId }}
          LOOKUP_AMOUNT: ${{ inputs.lookupAmountMinor }}
        run: |
          if ($env:TARGET_ENVIRONMENT -ne 'dev' -or $env:GITHUB_REF -ne 'refs/heads/dev') { throw 'Hosted workflow 04 requires branch dev and environment dev.' }
          if ($env:RUN_MODE -notin @('service-preflight','razorpay-order-lookup')) { throw 'Unknown hosted run mode.' }
          if ($env:RUN_MODE -eq 'razorpay-order-lookup') {
            if ($env:LOOKUP_TENANT -cnotmatch '^[A-Za-z0-9_-]{1,64}$' -or $env:LOOKUP_ORDER -cnotmatch '^order_[A-Za-z0-9]{1,80}$' -or [long]$env:LOOKUP_AMOUNT -le 0) { throw 'Invalid read-only lookup parameters.' }
          }
          elseif ($env:LOOKUP_TENANT -or $env:LOOKUP_ORDER -or [long]$env:LOOKUP_AMOUNT -ne 0) { throw 'Lookup parameters require explicit diagnostic-only selection.' }

      - name: Azure CLI Login (OIDC)
        id: azure_login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Resolve Phase 10 Azure E2E topology
        id: topology
        shell: bash
        env:
          EXPECTED_UI_ORIGIN: ${{ vars.IDENTITY_PUBLIC_WEB_ORIGIN }}
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            ENV_SUFFIX="stg"
            TARGET_KEY="azure-stg"
          elif [ "${{ inputs.environment }}" = "prod" ]; then
            ENV_SUFFIX="prod"
            TARGET_KEY="azure-prod"
          else
            ENV_SUFFIX="dev"
            TARGET_KEY="azure-dev"
          fi


          TARGET_JSON="$(TARGET_KEY="$TARGET_KEY" node -e 'const doc = require("./automation/config/runtime-targets.json"); const target = doc.targets.find((item) => item.key === process.env.TARGET_KEY); if (!target) { throw new Error(`Unknown runtime target ${process.env.TARGET_KEY}`); } process.stdout.write(JSON.stringify(target));')"
          read_target_field() {
            TARGET_JSON="$TARGET_JSON" FIELD_NAME="$1" node -e 'const target = JSON.parse(process.env.TARGET_JSON); process.stdout.write(String(target[process.env.FIELD_NAME] || ""));'
          }

          RG_NAME="$(read_target_field azureResourceGroupName)"
          GATEWAY_APP="$(read_target_field azureGatewayContainerAppName)"
          UI_APP="$(read_target_field azureUiContainerAppName)"
          URL_MODE="$(read_target_field publicUrlMode)"
          SQL_SERVER="$(read_target_field azureSqlServerName)"
          REDIS_NAME="$(read_target_field azureRedisName)"
          APP_INSIGHTS_NAME="$(read_target_field azureApplicationInsightsName)"
          KEY_VAULT_NAME="$(read_target_field azureKeyVaultName)"
          GATEWAY_BASE_URL="$(read_target_field publicApiBaseUrl | sed 's#/*$##')"
          UI_BASE_URL="$(read_target_field publicUiBaseUrl | sed 's#/*$##')"
          ALLOW_GENERATED_FALLBACK="$(read_target_field allowGeneratedAzureUrlFallback)"
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

          if [ -z "$RG_NAME" ] || [ -z "$GATEWAY_APP" ] || [ -z "$UI_APP" ] || [ -z "$SQL_SERVER" ] || [ -z "$REDIS_NAME" ]; then
            echo "Selected runtime target ${TARGET_KEY} is missing Azure resource metadata in automation/config/runtime-targets.json." >&2
            exit 1
          fi

          if [ -z "$GATEWAY_BASE_URL" ]; then
            GATEWAY_BASE_URL="$(read_target_field apiBaseUrl | sed 's#/*$##')"
          fi

          if [ -z "$UI_BASE_URL" ]; then
            UI_BASE_URL="$(read_target_field baseUrl | sed 's#/*$##')"
          fi

          GATEWAY_FQDN="$(az containerapp show --resource-group "$RG_NAME" --name "$GATEWAY_APP" --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)"
          UI_FQDN="$(az containerapp show --resource-group "$RG_NAME" --name "$UI_APP" --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)"
          if [ "$URL_MODE" = "generated" ]; then
            [ "$TARGET_KEY" = "azure-dev" ] || { echo 'Generated URL mode is dev-only.' >&2; exit 1; }
            ENV_NAME="$(read_target_field azureManagedEnvironmentName)"
            DOMAIN="$(az containerapp env show --resource-group "$RG_NAME" --name "$ENV_NAME" --query properties.defaultDomain -o tsv --only-show-errors)"
            RESOLVED="$(node scripts/resolve-phase10-azure-generated-urls.mjs --target "$TARGET_KEY" --default-domain "$DOMAIN" --gateway-fqdn "$GATEWAY_FQDN" --ui-fqdn "$UI_FQDN" --expected-ui-origin "$EXPECTED_UI_ORIGIN" --require-live-apps)"
            GATEWAY_BASE_URL="$(RESOLVED_JSON="$RESOLVED" node -e 'process.stdout.write(JSON.parse(process.env.RESOLVED_JSON).apiOrigin)')"
            UI_BASE_URL="$(RESOLVED_JSON="$RESOLVED" node -e 'process.stdout.write(JSON.parse(process.env.RESOLVED_JSON).uiOrigin)')"
          fi
          AZURE_GENERATED_GATEWAY_URL=""
          AZURE_GENERATED_UI_URL=""

          if [ -n "$GATEWAY_FQDN" ]; then
            AZURE_GENERATED_GATEWAY_URL="https://${GATEWAY_FQDN}"
          fi

          if [ -n "$UI_FQDN" ]; then
            AZURE_GENERATED_UI_URL="https://${UI_FQDN}"
          fi

          if [ -z "$GATEWAY_BASE_URL" ] || [ -z "$UI_BASE_URL" ]; then
            echo "Failed to resolve public Gateway/UI URLs from automation/config/runtime-targets.json." >&2
            exit 1
          fi

          if { [[ "$GATEWAY_BASE_URL" == *".azurecontainerapps.io"* ]] || [[ "$UI_BASE_URL" == *".azurecontainerapps.io"* ]]; } && [ "$ALLOW_GENERATED_FALLBACK" != "true" ]; then
            echo "Configured public smoke URLs must not use generated Azure Container Apps FQDNs unless allowGeneratedAzureUrlFallback=true." >&2
            echo "Gateway Base URL: ${GATEWAY_BASE_URL}" >&2
            echo "UI Base URL: ${UI_BASE_URL}" >&2
            exit 1
          fi

          RESOURCE_GROUP_URL="https://portal.azure.com/#/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/overview"
          GATEWAY_URL="https://portal.azure.com/#/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.App/containerApps/${GATEWAY_APP}/overview"
          UI_URL="https://portal.azure.com/#/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.App/containerApps/${UI_APP}/overview"

          echo "envSuffix=${ENV_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "targetKey=${TARGET_KEY}" >> "$GITHUB_OUTPUT"
          echo "resourceGroup=${RG_NAME}" >> "$GITHUB_OUTPUT"
          echo "gatewayApp=${GATEWAY_APP}" >> "$GITHUB_OUTPUT"
          echo "uiApp=${UI_APP}" >> "$GITHUB_OUTPUT"
          echo "sqlServer=${SQL_SERVER}" >> "$GITHUB_OUTPUT"
          echo "redisName=${REDIS_NAME}" >> "$GITHUB_OUTPUT"
          echo "appInsightsName=${APP_INSIGHTS_NAME}" >> "$GITHUB_OUTPUT"
          echo "keyVaultName=${KEY_VAULT_NAME}" >> "$GITHUB_OUTPUT"
          echo "gatewayBaseUrl=${GATEWAY_BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "uiBaseUrl=${UI_BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "azureGeneratedGatewayUrl=${AZURE_GENERATED_GATEWAY_URL}" >> "$GITHUB_OUTPUT"
          echo "azureGeneratedUiUrl=${AZURE_GENERATED_UI_URL}" >> "$GITHUB_OUTPUT"

          {
            echo "## 04 Phase 10 Azure Payment Matrix Context"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| Azure Resource Suffix | ${ENV_SUFFIX} |"
            echo "| Runtime Target | ${TARGET_KEY} |"
            echo "| Resource Group | ${RG_NAME} |"
            echo "| Public Gateway Base URL | ${GATEWAY_BASE_URL} |"
            echo "| Public UI Base URL | ${UI_BASE_URL} |"
            echo "| Azure Generated Gateway URL | ${AZURE_GENERATED_GATEWAY_URL:-n/a} |"
            echo "| Azure Generated UI URL | ${AZURE_GENERATED_UI_URL:-n/a} |"
            echo "| Generated URL Policy Enabled | ${ALLOW_GENERATED_FALLBACK:-false} |"
            echo "| SQL Server | ${SQL_SERVER} |"
            echo "| Redis | ${REDIS_NAME} |"
            echo ""
            echo "### Azure Links"
            echo ""
            echo "- [Resource group](${RESOURCE_GROUP_URL})"
            echo "- [Gateway Container App](${GATEWAY_URL})"
            echo "- [UI Container App](${UI_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify SQL and Redis baseline resources exist
        shell: bash
        run: |
          RG_NAME="${{ steps.topology.outputs.resourceGroup }}"
          SQL_SERVER="${{ steps.topology.outputs.sqlServer }}"
          REDIS_NAME="${{ steps.topology.outputs.redisName }}"

          az sql server show --resource-group "$RG_NAME" --name "$SQL_SERVER" --only-show-errors 1>/dev/null
          az resource show \
            --resource-group "$RG_NAME" \
            --resource-type "Microsoft.Cache/redisEnterprise" \
            --name "$REDIS_NAME" \
            --only-show-errors \
            1>/dev/null

          {
            echo ""
            echo "### SQL and Redis Baseline"
            echo ""
            echo "| Resource | Status |"
            echo "|---|---|"
            echo "| SQL Server ${SQL_SERVER} | Present |"
            echo "| Redis ${REDIS_NAME} | Present |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify tenant and provider matrix contract
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $PWD 'TestResults/Playwright/azure-https'
          $summaryPath = Join-Path $artifactRoot 'topology-preflight-${{ inputs.environment }}-${{ github.run_id }}.md'
          $verifyError = $null
          try {
            $topologyParameters = @{
              Environment = '${{ inputs.environment }}'
              ResourceGroupName = '${{ steps.topology.outputs.resourceGroup }}'
              GatewayBaseUrl = '${{ steps.topology.outputs.gatewayBaseUrl }}'
              SummaryPath = $summaryPath
            }
            if ('${{ inputs.environment }}' -eq 'dev') { $topologyParameters.RequiredProviderCodes = @('Razorpay', 'OpenPay') }
            & scripts/verify-phase10-azure-tenant-topology.ps1 @topologyParameters
          }
          catch {
            $verifyError = $_
          }

          if (Test-Path -LiteralPath $summaryPath) {
            Get-Content -LiteralPath $summaryPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

          if ($null -ne $verifyError) {
            throw "Azure payment matrix topology/provider preflight failed. $($verifyError.Exception.Message) Run the Phase 10 deploy orchestrator to synchronize provider aliases before retrying the matrix."
          }

      - name: Install automation dependencies
        working-directory: automation
        run: npm ci

      - name: Run no-payment service preflight
        if: inputs.runMode == 'service-preflight'
        shell: bash
        env:
          PHASE10_FIREWALL_RUN_ID: ${{ github.run_id }}
          PHASE10_FIREWALL_RUN_ATTEMPT: ${{ github.run_attempt }}
          XYDATALABS_RUNTIME_TARGET_AZURE_DEV_BASE_URL: ${{ steps.topology.outputs.uiBaseUrl }}
          XYDATALABS_RUNTIME_TARGET_AZURE_DEV_API_BASE_URL: ${{ steps.topology.outputs.gatewayBaseUrl }}
          XYDATALABS_RUNTIME_TARGET_AZURE_STG_BASE_URL: ${{ steps.topology.outputs.uiBaseUrl }}
          XYDATALABS_RUNTIME_TARGET_AZURE_STG_API_BASE_URL: ${{ steps.topology.outputs.gatewayBaseUrl }}
          XYDATALABS_RUNTIME_TARGET_AZURE_PROD_BASE_URL: ${{ steps.topology.outputs.uiBaseUrl }}
          XYDATALABS_RUNTIME_TARGET_AZURE_PROD_API_BASE_URL: ${{ steps.topology.outputs.gatewayBaseUrl }}
          XYDATALABS_AZURE_APP_INSIGHTS_NAME: ${{ steps.topology.outputs.appInsightsName }}
          XYDATALABS_AZURE_KEY_VAULT_NAME: ${{ steps.topology.outputs.keyVaultName }}
          XYDATALABS_AZURE_SQL_SERVER_NAME: ${{ steps.topology.outputs.sqlServer }}
          XYDATALABS_AZURE_RESOURCE_GROUP_NAME: ${{ steps.topology.outputs.resourceGroup }}
          EXPECTED_AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}
        run: |
          npm --prefix automation run run:azure:matrix -- \
            --target "${{ steps.topology.outputs.targetKey }}" \
            --service-preflight-only
          echo 'Browser and sandbox payments: NOT RUN (service preflight only).' >> "$GITHUB_STEP_SUMMARY"

      - name: Read existing Razorpay order and payments (no charge)
        if: inputs.runMode == 'razorpay-order-lookup'
        shell: pwsh
        env:
          LOOKUP_TENANT: ${{ inputs.lookupTenantCode }}
          LOOKUP_ORDER: ${{ inputs.lookupOrderId }}
          LOOKUP_AMOUNT: ${{ inputs.lookupAmountMinor }}
          EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}
        run: |
          & scripts/lookup-phase10-azure-razorpay-order.ps1 `
            -TenantCode $env:LOOKUP_TENANT -OrderId $env:LOOKUP_ORDER `
            -ExpectedAmountMinor ([long]$env:LOOKUP_AMOUNT) `
            -ExpectedSubscriptionId $env:EXPECTED_SUBSCRIPTION_ID

      - name: Verify assigned topology remains unchanged
        if: always()
        shell: pwsh
        run: |
          $summaryPath = Join-Path $PWD 'TestResults/Playwright/azure-https/topology-postflight-${{ inputs.environment }}-${{ github.run_id }}.md'
          & scripts/verify-phase10-azure-tenant-topology.ps1 `
            -Environment '${{ inputs.environment }}' `
            -ResourceGroupName '${{ steps.topology.outputs.resourceGroup }}' `
            -GatewayBaseUrl '${{ steps.topology.outputs.gatewayBaseUrl }}' `
            -SummaryPath $summaryPath

          if (Test-Path -LiteralPath $summaryPath) {
            Get-Content -LiteralPath $summaryPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Resolve Azure matrix run packet
        id: run_packet
        if: always()
        shell: pwsh
        run: |
          $environmentKey = 'azure-https'
          $pointerPath = Join-Path $PWD "TestResults/Playwright/$environmentKey/latest-playwright-matrix.txt"
          $runRoot = ''
          if (Test-Path -LiteralPath $pointerPath) {
            $runRoot = (Get-Content -LiteralPath $pointerPath -Raw).Trim()
          }

          $summaryPath = if (-not [string]::IsNullOrWhiteSpace($runRoot)) { Join-Path $runRoot 'summary.md' } else { '' }
          $summaryJsonPath = if (-not [string]::IsNullOrWhiteSpace($runRoot)) { Join-Path $runRoot 'summary.json' } else { '' }

          "run_root=$runRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "summary_path=$summaryPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "summary_json_path=$summaryJsonPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if (-not [string]::IsNullOrWhiteSpace($summaryPath) -and (Test-Path -LiteralPath $summaryPath)) {
            Get-Content -LiteralPath $summaryPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Print failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $runRoot = '${{ steps.run_packet.outputs.run_root }}'
          if ([string]::IsNullOrWhiteSpace($runRoot) -or -not (Test-Path -LiteralPath $runRoot)) {
            Write-Host 'No Azure matrix run packet was resolved.'
            return
          }

          Write-Host "Azure matrix run packet: $runRoot"
          foreach ($fileName in @('summary.md', 'summary.json', 'progress.log', 'startup.log')) {
            $path = Join-Path $runRoot $fileName
            if (Test-Path -LiteralPath $path) {
              Write-Host ""
              Write-Host "--- $fileName ---"
              Get-Content -LiteralPath $path -Tail 160
            }
          }

      - name: Ensure payment verifier firewall leases are cleaned
        if: always() && steps.azure_login.outcome == 'success'
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/cleanup-phase10-azure-firewall-lease.ps1 `
            -ManifestDirectory $env:RUNNER_TEMP `
            -ExpectedRunId '${{ github.run_id }}'
          if ($LASTEXITCODE -ne 0) { throw 'Payment matrix firewall lease cleanup could not be verified.' }

      - name: Upload Azure payment matrix run packet
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase10-azure-${{ inputs.runMode == 'razorpay-order-lookup' && 'provider-lookup' || 'service-preflight' }}-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/Playwright/azure-https/**
            ${{ runner.temp }}/phase10-sql-firewall-lease-payment-${{ github.run_id }}-*.json
          if-no-files-found: warn
          retention-days: 14
